<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#131e30;--panel2:#1b2b41;--line:#324259;--muted:#a9bdd0;--text:#f0f5ff;--accent:#55dbba;--blue:#91b9ff;--red:#ff9ba1;--warn:#f7cb84;--r:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at top right,#18334b 0%,transparent 36%),var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);line-height:1.5}main{max-width:1030px;margin:auto;padding:20px 16px 60px}h1,h2,h3,p{margin:0}h1{font-size:clamp(1.8rem,4.6vw,3.15rem);line-height:1.15;letter-spacing:-.045em}h2{font-size:1.3rem;letter-spacing:-.025em}h3{font-size:1.03rem}p{color:var(--muted)}button,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}.btn{background:var(--accent);color:#09241d;border:1px solid transparent;border-radius:13px;padding:13px 17px;font-weight:750;transition:transform .08s,border-color .15s}.btn:hover:not(:disabled){transform:translateY(-1px)}.btn.secondary{background:var(--panel2);color:var(--text);border-color:var(--line)}.btn.ghost{background:transparent;border-color:var(--line);color:var(--text)}.btn.sm{padding:8px 12px;border-radius:10px;font-size:.9rem}.full{width:100%}.pill{display:inline-block;font-size:.76rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:7px 11px;background:#143a39;border:1px solid #24635c;border-radius:999px}.container{border:1px solid var(--line);background:linear-gradient(150deg,rgba(26,42,61,.9),rgba(15,25,41,.97));border-radius:var(--r);box-shadow:0 18px 50px #0003;padding:23px}.hero{padding:29px 0 25px}.hero p{max-width:700px;margin-top:12px;line-height:1.6}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.stat{border:1px solid var(--line);border-radius:14px;background:#1a2b41;padding:16px}.stat b{display:block;font-size:2rem;letter-spacing:-.04em}.stat span{color:var(--muted);font-size:.83rem}.btnrow{display:flex;gap:11px;flex-wrap:wrap;margin-top:20px}.btnrow .btn{flex:1;min-width:170px}.note{border-left:3px solid var(--warn);background:rgba(247,203,132,.07);color:#e6d9bb;padding:12px 14px;border-radius:0 10px 10px 0;font-size:.88rem;margin-top:20px}.topicgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.topicbtn{border:1px solid var(--line);background:rgba(30,47,69,.8);border-radius:13px;min-height:70px;text-align:left;color:var(--text);padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.topicbtn.active,.topicbtn:hover{border-color:var(--accent);background:#20433f}.topicbtn span{font-weight:650}.topicbtn small{border-radius:8px;background:#273c51;color:var(--muted);padding:4px 8px;white-space:nowrap}.sub{margin-top:5px;font-size:.9rem}.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.progress-shell{height:8px;background:#304056;border-radius:99px;overflow:hidden;margin:15px 0}.progress-fill{height:100%;background:linear-gradient(90deg,#4bd4b2,#96c7ff);transition:width .2s}.timer{font-variant-numeric:tabular-nums;border:1px solid var(--line);background:#172638;border-radius:11px;padding:8px 12px;font-weight:750;white-space:nowrap}.timer.urgent{color:var(--red);border-color:var(--red)}.meta{font-size:.86rem;color:var(--muted)}.question{font-size:clamp(1.3rem,2.8vw,1.7rem);line-height:1.42;letter-spacing:-.025em;margin:20px 0 21px}.choices{display:grid;gap:11px}.option{display:flex;align-items:flex-start;gap:14px;text-align:left;width:100%;padding:14px;border-radius:13px;background:#18283d;color:var(--text);border:1px solid var(--line)}.option:hover:not(:disabled){background:#223650;border-color:#6385a8}.option.selected{border-color:var(--blue);background:#23415d}.option.good{border-color:#49bf9b;background:#153c36}.option.bad{border-color:#e47e85;background:#492e3b}.letter{display:inline-grid;place-items:center;border-radius:10px;border:1px solid #52647d;min-width:31px;height:31px;font-weight:800;background:#29394e;flex-shrink:0}.option-label{padding-top:2px}.explain{padding:14px 15px;border-radius:12px;background:#162f38;border:1px solid #2d665b;margin-top:15px;color:#d8f8ec}.explain strong{display:block;color:var(--accent);margin-bottom:4px}.explain.wrong{background:#3a2734;border-color:#905665;color:#f6d7df}.explain.wrong strong{color:#ffb9c0}.testcontrols{display:flex;flex-wrap:wrap;gap:9px;justify-content:space-between;margin:24px 0 10px}.testcontrols .btn{flex:1;min-width:105px}.navigator{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:17px}.navbtn{border:1px solid #33485f;background:#19283c;color:#d9e8f6;border-radius:9px;min-height:38px;font-weight:650;font-size:.86rem}.navbtn.current{outline:2px solid var(--blue);outline-offset:1px}.navbtn.done{background:#20473d;border-color:#2a805f}.navbtn.flagged:after{content:'•';color:var(--warn);padding-left:1px}.legend{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:.8rem;margin-top:12px}.key{display:inline-block;border-radius:4px;background:#20473d;width:10px;height:10px;margin-right:5px}.key.todo{background:#19283c;border:1px solid #52637a}.key.flag{background:var(--warn)}.smallhint{font-size:.86rem;color:var(--muted);margin-top:9px}.summaryScore{text-align:center;font-size:4rem;font-weight:850;letter-spacing:-.075em;margin:9px 0 0}.summaryTag{text-align:center;color:var(--muted);margin-bottom:18px}.topicrow{display:grid;grid-template-columns:minmax(140px,1fr) auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0;font-size:.91rem}.topicrow:last-child{border-bottom:0}.mini{height:5px;background:#293d51;border-radius:99px;margin-top:7px}.mini div{height:5px;background:#4bd4b2;border-radius:99px}.reviewCard{border:1px solid var(--line);background:#172538;padding:15px;border-radius:13px;margin-top:10px}.reviewCard .q{font-size:1.03rem;font-weight:700;margin:4px 0 8px}.reviewCard p{font-size:.9rem;margin-top:5px}.answerBad{color:#ffb5bd;font-weight:650}.answerGood{color:#75e5bf;font-weight:700}.foot{margin-top:24px;color:#8ba6bd;font-size:.78rem}.hidden{display:none!important}select{background:#1d2e43;border:1px solid #51667e;color:var(--text);border-radius:10px;padding:11px;max-width:100%}a{color:#9fcbff}@media(max-width:640px){main{padding:14px 11px 38px}.container{padding:15px}.hero{padding:19px 0 13px}.statgrid{gap:7px}.stat{padding:10px}.stat b{font-size:1.65rem}.stat span{font-size:.7rem}.topicgrid{grid-template-columns:1fr}.navigator{grid-template-columns:repeat(7,1fr)}.btnrow .btn{min-width:100%}.testcontrols .btn{font-size:.86rem;padding:11px 6px}.option{padding:12px}.question{margin:15px 0}.meta{font-size:.76rem}.topicrow{grid-template-columns:1fr auto}}
</style>

<script>
const BANK=[{"id":1,"topic":"Assembly methods","q":"When should assembly be carefully planned?","options":["During installation","At the design stage","During commissioning","During final inspection"],"answer":1,"why":"The manual says successful assembly depends on planning at the design stage.","page":"A&D p.1"},{"id":2,"topic":"Assembly methods","q":"What must an assembly sequence preserve?","options":["Specified tightening torque","Parts availability","Fastener accessibility","Surface finish"],"answer":2,"why":"Previously fitted parts must not block subsequent components or fastenings.","page":"A&D p.1"},{"id":3,"topic":"Assembly methods","q":"Which assembly method matches precision plungers to barrels?","options":["Line assembly","Trial assembly","Batch assembly","Selective assembly"],"answer":3,"why":"Selective assembly matches component combinations to obtain fine tolerances.","page":"A&D p.2"},{"id":4,"topic":"Assembly methods","q":"Which assembly method suits high-volume production without hand-fitting?","options":["Non-selective assembly","Selective assembly","One-off assembly","Trial assembly"],"answer":0,"why":"Non-selective assembly relies on interchangeable components made to the required tolerances.","page":"A&D p.2"},{"id":5,"topic":"Assembly methods","q":"Replacing an obsolete motor using new on-site mountings is an example of:","options":["Batch assembly","Line assembly","On-site assembly without prefabrication","Workshop repair"],"answer":2,"why":"The fitter adapts mountings and shaft alignment on site when no prefabricated kit is available.","page":"A&D p.4"},{"id":6,"topic":"Assembly methods","q":"Workshop-made ductwork fitted at the installation site is:","options":["One-off assembly","Partial prefabrication","Line assembly","Selective assembly"],"answer":1,"why":"Ventilation sections can be made in a workshop then erected on site.","page":"A&D p.4"},{"id":7,"topic":"Assembly methods","q":"Why must large-structure assembly be carefully sequenced?","options":["To avoid team interference","To simplify alignment checks","To reduce crane capacity","To avoid site fabrication"],"answer":0,"why":"Many teams and lifting operations must progress without obstructing one another.","page":"A&D p.4"},{"id":8,"topic":"Assembly methods","q":"Why perform a trial assembly before delivery?","options":["To estimate labour hours","To confirm transport sequence","To select coating materials","To check fit and correct snags"],"answer":3,"why":"Trial assembly checks and tests components before dismantling them for transport.","page":"A&D pp.3–4"},{"id":9,"topic":"Assembly methods","q":"Which assembly may require the fitter to drill and tap final holes?","options":["Line assembly","Batch assembly","One-off assembly","Automatic assembly"],"answer":2,"why":"In one-off assembly, partly finished pieces may need final drilling, tapping or reaming.","page":"A&D p.4"},{"id":10,"topic":"Assembly methods","q":"A small number of identical lathe chucks is assembled by:","options":["Batch assembly","Line assembly","On-site dismantling","Selective assembly"],"answer":0,"why":"Batch assembly concerns a small or medium number of devices of the same type.","page":"A&D p.5"},{"id":11,"topic":"Assembly methods","q":"Which assembly uses a conveyor and many operators?","options":["One-off assembly","Trial assembly","Selective assembly","Line assembly"],"answer":3,"why":"Line assembly passes work along a conveyor, each station adding parts or subassemblies.","page":"A&D p.5"},{"id":12,"topic":"Assembly methods","q":"After repairing an on-site hydraulic leak, what is done before pressure-testing?","options":["Check bearing alignment","Bleed trapped air","Inspect pipe threads","Replace inlet fittings"],"answer":1,"why":"The manual describes refilling, bleeding off air, then pressure testing.","page":"A&D p.5"},{"id":13,"topic":"Assembly methods","q":"A failed motor is sent away to the manufacturer for repair. This is:","options":["Trial assembly","On-site repair","Workshop repair","Batch assembly"],"answer":2,"why":"Workshop repair removes the defective equipment for service elsewhere.","page":"A&D p.5"},{"id":14,"topic":"Assembly methods","q":"Why fit a reconditioned motor while the old one is repaired?","options":["To maintain production","To alter motor rating","To simplify lubrication","To avoid alignment checks"],"answer":0,"why":"A replacement unit prevents the machine remaining idle during workshop repair.","page":"A&D p.5"},{"id":15,"topic":"Tools and dismantling","q":"Which tool tightens bolts to a specified torque?","options":["Ratchet wrench","Torque wrench","Ring spanner","Adjustable spanner"],"answer":1,"why":"Torque wrenches are used when the specified tightening torque must be achieved.","page":"A&D p.13"},{"id":16,"topic":"Tools and dismantling","q":"Which torque wrench signals a preset value by a click?","options":["Beam type","Dial type","Click type","Digital display type"],"answer":2,"why":"A click-type wrench signals that the preset torque has been reached.","page":"A&D p.13"},{"id":17,"topic":"Tools and dismantling","q":"Why should a pipe not extend a spanner handle?","options":["It lowers torque accuracy","It changes thread pitch","It changes bolt grade","It may overload the fastener or tool"],"answer":3,"why":"Extra leverage can overstress the fastener and damage the spanner jaws.","page":"A&D pp.12–13"},{"id":18,"topic":"Tools and dismantling","q":"For better control, how should a spanner usually be pulled?","options":["Toward the body","Away from the body","With short jerks","At an angle to the nut"],"answer":0,"why":"The manual advises pulling toward the body where possible to reduce loss-of-control risk.","page":"A&D p.13"},{"id":19,"topic":"Tools and dismantling","q":"A screwdriver should be selected to match the screw’s:","options":["Thread pitch","Metal grade","Head recess","Overall length"],"answer":2,"why":"A properly fitting tip reduces damage to the screw head and tool.","page":"A&D p.14"},{"id":20,"topic":"Tools and dismantling","q":"Pliers are generally unsuitable for tightening:","options":["Split pins","Hexagon nuts","Electrical wire","Small sheet metal"],"answer":1,"why":"Pliers can damage the corners of hexagon nuts and bolts.","page":"A&D p.14"},{"id":21,"topic":"Tools and dismantling","q":"Which tool supports a rivet head while the other end is formed?","options":["Rivet set","Drawing-up tool","Nut splitter","Dolly"],"answer":3,"why":"The dolly or hold-up supports the existing rivet head.","page":"A&D p.11"},{"id":22,"topic":"Tools and dismantling","q":"Which tool brings riveted plates into close contact?","options":["Drawing-up tool","Rivet set","Dolly","Rivet snap"],"answer":0,"why":"The drawing-up tool pulls the parts tightly together before the rivet head is finished.","page":"A&D p.11"},{"id":23,"topic":"Tools and dismantling","q":"Which tool finishes forming a rivet head?","options":["Dolly","Rivet set","Drawing-up tool","Ball-pein hammer"],"answer":1,"why":"The rivet set finishes the rivet to its proper shape.","page":"A&D p.11"},{"id":24,"topic":"Tools and dismantling","q":"Which tool removes a seized nut by splitting it?","options":["Easy-out","Impact spanner","Nut splitter","Stud extractor"],"answer":2,"why":"A nut splitter fractures the nut to free it from a stud or bolt.","page":"A&D p.17"},{"id":25,"topic":"Tools and dismantling","q":"Which tool uses a left-handed thread to remove broken studs?","options":["Stud remover","Impact spanner","Nut splitter","Easy-out"],"answer":3,"why":"The easy-out bites into a drilled pilot hole in the broken stud or screw.","page":"A&D p.18"},{"id":26,"topic":"Tools and dismantling","q":"Which tool uses gripping rollers to remove a stud?","options":["Stud remover","Torque multiplier","Rivet set","Feeler gauge"],"answer":0,"why":"A stud remover grips the exposed stud, often by a roller mechanism.","page":"A&D pp.17–18"},{"id":27,"topic":"Tools and dismantling","q":"What is used to ease a rusted threaded joint before removal?","options":["Flux paste","Penetrating oil","Soft solder","Marking blue"],"answer":1,"why":"Penetrating oil seeps into threads and helps loosen corrosion or deposits.","page":"A&D pp.9,17"},{"id":28,"topic":"Fasteners and washers","q":"A screw driven into a previously tapped hole is a:","options":["Machine screw","Socket screw","Self-tapping screw","Cap screw"],"answer":0,"why":"Machine screws are designed to fasten into previously tapped holes.","page":"A&D p.23"},{"id":29,"topic":"Fasteners and washers","q":"Which screw head is intended to sit flush with the surface?","options":["Pan head","Cheese head","Raised round head","Countersunk head"],"answer":3,"why":"A countersunk head fits into a matching countersink.","page":"A&D p.23"},{"id":30,"topic":"Fasteners and washers","q":"Which screw is commonly tightened with a hexagon key?","options":["Slotted machine screw","Socket-head screw","Raised countersunk screw","Phillips screw"],"answer":1,"why":"Socket screws contain a hexagon recess for an Allen key.","page":"A&D p.24"},{"id":31,"topic":"Fasteners and washers","q":"Which socket screw can lock a collar onto a shaft?","options":["Cap screw","Countersunk screw","Grub screw","Socket-button screw"],"answer":2,"why":"Grub screws can secure knobs and collars on shafts.","page":"A&D p.24"},{"id":32,"topic":"Fasteners and washers","q":"A thread-forming self-tapping screw makes its thread by:","options":["Displacing the material","Shaving the material","Heating the material","Pre-tapping the hole"],"answer":0,"why":"The thread-forming type displaces softer work material to produce the mating thread.","page":"A&D p.24"},{"id":33,"topic":"Fasteners and washers","q":"What feature helps a thread-cutting self-tapping screw cut metal?","options":["Nylon ring","Castellations","Spring washer","Cutting flutes"],"answer":3,"why":"The manual describes grooves or flutes that provide cutting action.","page":"A&D p.24"},{"id":34,"topic":"Fasteners and washers","q":"What usually distinguishes a bolt from a machine screw?","options":["A bolt forms its own thread","A bolt is used with a nut","A bolt is always socket-headed","A bolt has a tapered thread"],"answer":1,"why":"The manual describes bolts as intended for fastening with a nut.","page":"A&D p.25"},{"id":35,"topic":"Fasteners and washers","q":"What is the main function of a plain washer?","options":["Maintain pipe alignment","Seal mating joint faces","Spread tightening load","Set bolt thread pitch"],"answer":2,"why":"Plain washers distribute load and protect surfaces without providing locking action.","page":"A&D p.25"},{"id":36,"topic":"Fasteners and washers","q":"In M16 × 2, what does the number 2 indicate?","options":["Thread pitch in millimetres","Nominal diameter in millimetres","Thread engagement length","Thread depth in millimetres"],"answer":0,"why":"M16 × 2 identifies a 16 mm nominal diameter and 2 mm thread pitch.","page":"A&D p.26"},{"id":37,"topic":"Locking devices","q":"Which nut is secured by a split pin through a drilled bolt?","options":["Nyloc nut","Wing nut","Castellated nut","Cap nut"],"answer":2,"why":"Castellated or slotted nuts can be locked with a split pin through the bolt.","page":"A&D p.28"},{"id":38,"topic":"Locking devices","q":"A Nyloc nut resists loosening using a:","options":["Lead insert","Nylon insert","Copper washer","Rivet head"],"answer":1,"why":"The nylon collar grips the bolt thread and provides prevailing torque.","page":"A&D p.28"},{"id":39,"topic":"Locking devices","q":"Which nut has deformed arms that spring back against the screw?","options":["Aerotight nut","Wing nut","Flanged nut","Plain nut"],"answer":0,"why":"Aerotight nuts have deformed arms that resist working loose.","page":"A&D p.28"},{"id":40,"topic":"Locking devices","q":"What locks a tab washer after tightening?","options":["Heating the washer","Using thread adhesive","Compressing a nylon insert","Bending a tab against the nut"],"answer":3,"why":"A tab is bent against the fastener to resist rotation.","page":"A&D p.28"},{"id":41,"topic":"Locking devices","q":"Which washer is flattened during tightening to resist loosening?","options":["Plain washer","Fibre washer","Helical spring washer","Large-area washer"],"answer":2,"why":"A split/helical spring washer exerts a spring effect when compressed.","page":"A&D p.28"},{"id":42,"topic":"Riveting, soldering and brazing","q":"Why is riveting regarded as a permanent joint?","options":["The joint is always pressure-tight","Removal usually destroys the rivet","Rivets require brazing","The head cannot be formed again"],"answer":1,"why":"Rivets are removed by damaging or destroying the rivet itself.","page":"A&D pp.23,29"},{"id":43,"topic":"Riveting, soldering and brazing","q":"A blind rivet is useful when access is available from:","options":["One side only","Both sides with a dolly","The internal cavity","Two parallel faces only"],"answer":0,"why":"Blind or pop rivets are fitted where only one side of an assembly can be reached.","page":"A&D p.30"},{"id":44,"topic":"Riveting, soldering and brazing","q":"Which soldering process melts the filler, not the base metal?","options":["Arc welding","Gas welding","Resistance welding","Soft soldering"],"answer":3,"why":"In soft soldering, the solder melts while the parent metals remain solid.","page":"A&D p.30"},{"id":45,"topic":"Riveting, soldering and brazing","q":"A flux is mainly used in soldering to:","options":["Increase joint clearance","Raise the solder solidus","Remove or prevent surface oxides","Prevent dissimilar-metal contact"],"answer":2,"why":"Flux helps remove oxides and prevent oxide formation during joining.","page":"A&D p.31"},{"id":46,"topic":"Riveting, soldering and brazing","q":"Which flux type generally requires residue removal because it is corrosive?","options":["Passive resin flux","Active acid flux","Inert gas","Dry nitrogen"],"answer":1,"why":"Active acid flux is corrosive, so residue must be cleaned away.","page":"A&D p.31"},{"id":47,"topic":"Riveting, soldering and brazing","q":"What is a heat sink used for during soldering?","options":["Protecting heat-sensitive components","Increasing joint clearance","Spreading solder evenly","Increasing tip temperature"],"answer":0,"why":"A heat sink absorbs heat and limits damage to nearby sensitive parts.","page":"A&D p.31"},{"id":48,"topic":"Riveting, soldering and brazing","q":"Which joining method uses filler above about 450°C without melting the base metal?","options":["Soft soldering","Spot welding","Adhesive bonding","Brazing"],"answer":3,"why":"Brazing uses a higher-melting filler than soft soldering, but the parent metal does not melt.","page":"A&D pp.32–34"},{"id":49,"topic":"Riveting, soldering and brazing","q":"What draws molten brazing alloy into a close-fitting joint?","options":["Flux pressure","Gravity feed","Capillary action","Surface compression"],"answer":2,"why":"Brazing depends on capillary action drawing filler into suitable clearances.","page":"A&D p.32"},{"id":50,"topic":"Welding","q":"Which process uses a flux-coated consumable electrode?","options":["MMA welding","MAG welding","TIG welding","Oxy-acetylene welding"],"answer":0,"why":"Manual metal arc welding uses a consumable flux-coated electrode.","page":"A&D p.35"},{"id":51,"topic":"Welding","q":"Which welding process uses a non-consumable tungsten electrode?","options":["MMA","MAG","Oxy-fuel","TIG"],"answer":3,"why":"Tungsten inert-gas welding uses a non-consumable tungsten electrode.","page":"A&D p.35"},{"id":52,"topic":"Welding","q":"Which gases commonly shield TIG welding?","options":["Oxygen or nitrogen","Argon or helium","Carbon dioxide or oxygen","Acetylene or hydrogen"],"answer":1,"why":"TIG uses inert shielding gases such as argon or helium.","page":"A&D p.35"},{"id":53,"topic":"Welding","q":"Which process feeds a continuous consumable wire electrode?","options":["TIG welding","MMA welding","MAG welding","Gas welding"],"answer":2,"why":"MAG welding feeds a continuous consumable wire electrode through a gun.","page":"A&D p.36"},{"id":54,"topic":"Welding","q":"Using carbon dioxide shielding for steel welding is commonly called:","options":["CO₂/MAG welding","TIG welding","MMA welding","Oxy-fuel welding"],"answer":0,"why":"The manual describes carbon-dioxide-shielded MAG welding of plain-carbon and low-alloy steels.","page":"A&D p.36"},{"id":55,"topic":"Welding","q":"What gas combination produces a typical oxy-acetylene welding flame?","options":["Argon and nitrogen","Oxygen and hydrogen","Air and carbon dioxide","Oxygen and acetylene"],"answer":3,"why":"Oxy-acetylene welding burns acetylene with oxygen to provide a high-temperature flame.","page":"A&D p.36"},{"id":56,"topic":"Adhesives","q":"Adhesives are broadly classified as:","options":["Metallic and ceramic","Natural and synthetic","Ferrous and non-ferrous","Dry and wet"],"answer":1,"why":"The classification on page 38 has the two main groups: natural and synthetic.","page":"A&D p.38"},{"id":57,"topic":"Adhesives","q":"Which is a natural adhesive origin?","options":["Animal","Epoxy","Cyanoacrylate","Polyamide"],"answer":0,"why":"Natural adhesives are classified by animal, vegetable or mineral origin.","page":"A&D p.38"},{"id":58,"topic":"Adhesives","q":"Which synthetic adhesive is a thermoplastic rubber?","options":["Epoxy","Phenol resin","Neoprene","Polyaromatic resin"],"answer":2,"why":"Polychloroprene, or neoprene, is shown under thermoplastic rubbers.","page":"A&D p.38"},{"id":59,"topic":"Adhesives","q":"Cyanoacrylate is commonly called:","options":["Contact cement","Epoxy filler","Silicone sealant","Superglue"],"answer":3,"why":"The manual labels cyanoacrylate as superglue.","page":"A&D p.38"},{"id":60,"topic":"Adhesives","q":"What mainly initiates cyanoacrylate setting on a surface?","options":["Heat from an arc","Surface moisture","A powdered catalyst","An external electric field"],"answer":1,"why":"Cyanoacrylate reacts with small amounts of moisture on surfaces at room temperature.","page":"A&D p.38"},{"id":61,"topic":"Adhesives","q":"Which adhesive generally uses resin and a hardener?","options":["Epoxy","Neoprene","Animal glue","Cellulose adhesive"],"answer":0,"why":"The manual describes epoxy as a two-component resin and curing agent system.","page":"A&D p.39"},{"id":62,"topic":"Adhesives","q":"Which adhesive family cures into a cross-linked network?","options":["Thermoplastic rubber","Natural vegetable adhesive","Thermosetting resin","Hot-melt adhesive"],"answer":2,"why":"Thermosetting adhesives form a chemically cross-linked bond during curing.","page":"A&D pp.38–39"},{"id":63,"topic":"Fire and gas safety","q":"In the manual, what colour identifies a water extinguisher?","options":["Pale cream","Black","French blue","Signal red"],"answer":3,"why":"The training manual uses the historical signal-red code for water extinguishers.","page":"Safety p.15"},{"id":64,"topic":"Fire and gas safety","q":"In the manual, what colour identifies a foam extinguisher?","options":["Pale cream","French blue","Signal red","Black"],"answer":0,"why":"The manual identifies foam by pale cream.","page":"Safety p.15"},{"id":65,"topic":"Fire and gas safety","q":"In the manual, what colour identifies a powder extinguisher?","options":["Black","Signal red","French blue","Maroon"],"answer":2,"why":"The training manual lists French blue for powder extinguishers.","page":"Safety p.15"},{"id":66,"topic":"Fire and gas safety","q":"In the manual, what colour identifies a CO₂ extinguisher?","options":["French grey","Black","Pale cream","Peacock blue"],"answer":1,"why":"The manual lists black for carbon dioxide extinguishers.","page":"Safety p.15"},{"id":67,"topic":"Fire and gas safety","q":"In the manual, what is the cylinder colour for acetylene?","options":["Signal red","French grey","Black","Maroon"],"answer":3,"why":"The gas-cylinder table identifies acetylene cylinders as maroon.","page":"Safety p.15"},{"id":68,"topic":"Fire and gas safety","q":"In the manual, what gas has a peacock-blue cylinder?","options":["Argon","Oxygen","Carbon dioxide","Hydrogen"],"answer":0,"why":"Argon is shown as peacock blue in the manual.","page":"Safety p.15"},{"id":69,"topic":"Fire and gas safety","q":"In the manual, nitrogen is identified by:","options":["Black","Maroon","French grey with black band","Signal red with white band"],"answer":2,"why":"Nitrogen is labelled French grey with a black band.","page":"Safety p.15"},{"id":70,"topic":"Fire and gas safety","q":"In the manual, which class includes flammable liquids?","options":["Class A","Class B","Class C","Class D"],"answer":1,"why":"The manual describes Class B fires as fires involving flammable liquids.","page":"Safety p.18"}];
const VERSION='attp-aoc-70-20261029-v1';
const TOPICS=[...new Set(BANK.map(q=>q.topic))];
let state=null,landingTopic='all',tick=null;
const $=sel=>document.querySelector(sel), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mix(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function save(){try{localStorage.setItem(VERSION,JSON.stringify(state))}catch(e){}}
function restore(){try{const x=JSON.parse(localStorage.getItem(VERSION)||'null');if(x?.ids?.length&&x?.choices&&x?.mode&&x?.picks)state=x}catch(e){}}
function attempts(){return state&&state.ids?.length>0}
function el(tag,attrs={},text){const x=document.createElement(tag);for(const [k,v] of Object.entries(attrs))x.setAttribute(k,v);if(text!=null)x.textContent=text;return x}
function correct(qid){return BANK[qid-1].answer}
function answered(){return Object.keys(state?.picks||{}).length}
function timeleft(){return Math.max(0,3600000-(Date.now()-state.startedAt))}
function fmt(ms){const sec=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(sec/60),s=sec%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function create(mode,topic='all',missed=null){const pool=missed??BANK.filter(q=>topic==='all'||q.topic===topic).map(q=>q.id);const ids=mix(pool),choices={};for(const id of ids)choices[id]=mix([0,1,2,3]);state={mode,ids,choices,picks:{},idx:0,flags:[],startedAt:Date.now(),finished:false,topic};save();draw();window.scrollTo(0,0)}
function getQuestion(){const id=state.ids[state.idx];return {id,q:BANK[id-1]}}
function finish(timeout=false){if(!state||state.finished)return;const remaining=state.ids.length-answered();if(remaining&&!timeout&&state.mode==='exam'&&!window.confirm(`You have ${remaining} unanswered question${remaining===1?'':'s'}. Submit your exam now?`))return;state.finished=true;state.endedAt=Date.now();state.timeout=timeout;save();draw();window.scrollTo(0,0)}
function showHome(){if(tick)clearInterval(tick);const counts=TOPICS.map(t=>[t,BANK.filter(q=>q.topic===t).length]);$('#app').innerHTML=`<section class="hero"><span class="pill">Instructor area of concentration · AOC</span><h1 style="margin-top:16px">ATTP Mechanical<br>Mock Examination</h1><p>70 short questions drawn from the Assembly &amp; Disassembly and Safety manual, weighted toward the topics your instructor emphasised.</p></section><section class="statgrid"><div class="stat"><b>70</b><span>Multiple-choice</span></div><div class="stat"><b>60 min</b><span>Timed exam</span></div><div class="stat"><b>8</b><span>Topic groups</span></div></section><section class="container"><h2>Choose how to practise</h2><p class="sub">Exam Mode hides solutions until submission; Study Mode explains every answer immediately.</p><div class="btnrow"><button class="btn" id="exam">Start 70-question timed exam</button><button class="btn secondary" id="study">Study all 70 questions</button></div>${attempts()?`<div class="btnrow"><button id="resume" class="btn ghost">${state.finished?'View last results':'Resume previous attempt'}</button></div>`:''}<div style="border-top:1px solid var(--line);margin:23px 0 15px"></div><h3>Practice one topic</h3><p class="sub">Revise any AOC area before the full mock.</p><div class="topicgrid">${counts.map(([t,n])=>`<button class="topicbtn ${landingTopic===t?'active':''}" data-topic="${esc(t)}"><span>${esc(t)}</span><small>${n} Qs</small></button>`).join('')}</div><div class="btnrow"><button class="btn secondary" id="topicPractice" ${landingTopic==='all'?'disabled':''}>Study selected topic</button></div><div class="note"><b>Training-manual colour codes:</b> Extinguisher and gas-cylinder questions follow the historical colours printed in your notes. For real equipment, use its current labels, safety data sheets and site rules.</div></section><div class="foot">All questions are self-contained; no diagram, figure or manual lookup is required. Your progress is saved in this browser.</div>`;
$('#exam').onclick=()=>{if(!attempts()||state.finished||confirm('Replace your current attempt with a new exam?'))create('exam')};
$('#study').onclick=()=>{if(!attempts()||state.finished||confirm('Replace your current attempt with a new study session?'))create('study')};
$('#topicPractice').onclick=()=>{if(landingTopic!=='all')create('study',landingTopic)};
const resume=$('#resume');if(resume)resume.onclick=()=>draw();
document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{landingTopic=b.dataset.topic;showHome()})}
function draw(){if(tick)clearInterval(tick);if(!state)return showHome();if(state.finished)return results();const {id,q}=getQuestion();const n=answered(),nall=state.ids.length,picked=state.picks[id];const done=picked!==undefined;const isStudy=state.mode==='study';const isExam=state.mode==='exam';const isFlag=state.flags.includes(id);
$('#app').innerHTML=`<section class="container"><div class="topbar"><span class="pill">${isExam?'Timed exam':'Study mode'}</span><div class="timer" id="timer" role="timer">${isExam?fmt(timeleft()):'Untimed'}</div></div><div style="display:flex;justify-content:space-between;gap:10px;margin-top:13px" class="meta"><span>Question ${state.idx+1} of ${nall}</span><span>${n} answered · ${nall-n} remaining</span></div><div class="progress-shell"><div class="progress-fill" style="width:${Math.round(100*n/nall)}%"></div></div><div class="meta">${esc(q.topic)}</div><h1 class="question">${esc(q.q)}</h1><div class="choices">${state.choices[id].map((original,show)=>{const active=picked===original,good=isStudy&&done&&original===q.answer,bad=isStudy&&active&&original!==q.answer;let sty=good?'good':bad?'bad':active?'selected':'';return `<button class="option ${sty}" data-original="${original}" ${isStudy&&done?'disabled':''}><span class="letter">${'ABCD'[show]}</span><span class="option-label">${esc(q.options[original])}</span></button>`}).join('')}</div>${isStudy&&done?`<div class="explain ${picked===q.answer?'':'wrong'}"><strong>${picked===q.answer?'Correct answer':'Incorrect · Correct answer: '+esc(q.options[q.answer])}</strong>${esc(q.why)} <span class="meta">(${esc(q.page)})</span></div>`:''}<div class="testcontrols"><button class="btn secondary" id="prev" ${state.idx===0?'disabled':''}>← Previous</button><button class="btn ghost" id="flag">${isFlag?'★ Flagged':'☆ Flag'}</button><button class="btn secondary" id="next" ${state.idx>=nall-1?'disabled':''}>Next →</button></div><div class="testcontrols"><button class="btn ghost" id="exit">Home</button><button class="btn" id="submit">${isExam?'Submit exam':'Finish session'}</button></div><div class="meta" style="margin-top:16px">Question navigator — tap a number to jump</div><div class="navigator">${state.ids.map((qid,i)=>`<button data-nav="${i}" class="navbtn ${state.picks[qid]===undefined?'':'done'} ${state.idx===i?'current':''} ${state.flags.includes(qid)?'flagged':''}" aria-label="Go to question ${i+1}">${i+1}</button>`).join('')}</div><div class="legend"><span><i class="key"></i>Answered</span><span><i class="key todo"></i>Unanswered</span><span><i class="key flag"></i>Flagged</span></div></section><div class="foot">AOC practice · 70 questions / 60 minutes · Based on the uploaded Seplat training manual.</div>`;
document.querySelectorAll('[data-original]').forEach(btn=>btn.onclick=()=>{if(isStudy&&done)return;state.picks[id]=Number(btn.dataset.original);save();draw()});
document.querySelectorAll('[data-nav]').forEach(btn=>btn.onclick=()=>{state.idx=Number(btn.dataset.nav);save();draw();window.scrollTo(0,0)});
$('#prev').onclick=()=>{state.idx--;save();draw();window.scrollTo(0,0)};
$('#next').onclick=()=>{state.idx++;save();draw();window.scrollTo(0,0)};
$('#flag').onclick=()=>{state.flags=isFlag?state.flags.filter(x=>x!==id):[...state.flags,id];save();draw()};
$('#exit').onclick=()=>{save();showHome();window.scrollTo(0,0)};
$('#submit').onclick=()=>finish();
if(isExam){const check=()=>{if(state.finished||!document.getElementById('timer')){clearInterval(tick);return}const left=timeleft();$('#timer').textContent=fmt(left);$('#timer').classList.toggle('urgent',left<300000);if(left<=0)finish(true)};tick=setInterval(check,500);check()}}
function results(){if(tick)clearInterval(tick);const n=state.ids.length,score=state.ids.filter(id=>state.picks[id]===correct(id)).length,missing=state.ids.filter(id=>state.picks[id]!==correct(id)),notDone=state.ids.filter(id=>state.picks[id]===undefined),percent=Math.round(100*score/n),byTopic=TOPICS.map(t=>{const ids=state.ids.filter(id=>BANK[id-1].topic===t);return {topic:t,n:ids.length,score:ids.filter(id=>state.picks[id]===correct(id)).length}}).filter(x=>x.n>0);
$('#app').innerHTML=`<div class="hero"><span class="pill">${state.timeout?'Time expired':'Attempt completed'}</span><h1 style="margin-top:15px">Your Results</h1><p>${state.mode==='exam'?'Timed mock examination':'Study session'} · ${n} questions · ${Object.keys(state.picks).length} answered</p></div><section class="container"><div class="summaryScore">${score}<span style="font-size:2rem;color:var(--muted)"> / ${n}</span></div><div class="summaryTag">${percent}% correct · ${score===n?'Excellent — full marks':percent>=85?'Strong result — review missed topics':percent>=70?'Good start — revisit weak topics':'Review and try again'}</div><div class="progress-shell"><div class="progress-fill" style="width:${percent}%"></div></div><h2 style="margin-top:20px">Performance by topic</h2><div style="margin-top:12px">${byTopic.map(x=>`<div class="topicrow"><div>${esc(x.topic)}<div class="mini"><div style="width:${Math.round(100*x.score/x.n)}%"></div></div></div><strong>${x.score}/${x.n}</strong></div>`).join('')}</div><div class="btnrow"><button class="btn" id="retry">Retake full 70</button><button class="btn secondary" id="missed" ${missing.length?'':'disabled'}>Retry ${missing.length} missed</button><button class="btn ghost" id="home">Home</button></div></section><section class="container" style="margin-top:17px"><h2>Answered review</h2><p class="sub">Each correct answer is explained below. Use this to revise without reopening the module.</p><div class="btnrow"><button class="btn secondary" id="toggle">Show all ${n} answers</button></div><div id="review" class="hidden" style="margin-top:13px">${state.ids.map((id,i)=>{const q=BANK[id-1],pick=state.picks[id],right=q.answer;return `<div class="reviewCard"><div class="meta">Question ${i+1} · ${esc(q.topic)} · ${esc(q.page)}</div><div class="q">${esc(q.q)}</div><div class="${pick===right?'answerGood':'answerBad'}">${pick===right?'✓ Correct':'✗ Your answer: '+(pick===undefined?'Unanswered':esc(q.options[pick]))}</div><div class="answerGood">Answer: ${esc(q.options[right])}</div><p>${esc(q.why)}</p></div>`}).join('')}</div></section><div class="foot">Scoring uses one mark per question. Historical colour codes are for manual-based examination revision, not field identification.</div>`;
$('#home').onclick=()=>{showHome();window.scrollTo(0,0)};$('#retry').onclick=()=>create('exam');$('#missed').onclick=()=>create('study','all',missing);
$('#toggle').onclick=()=>{const v=$('#review');v.classList.toggle('hidden');$('#toggle').textContent=v.classList.contains('hidden')?`Show all ${n} answers`:'Hide answer review'};}
restore();showHome();
</script></body></html>
