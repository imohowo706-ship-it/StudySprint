,"Hydraulic hoist","Conveyor belt","Forklift truck"],"answer":2,"why":"Work travels along a conveyor as individual workers add parts or subassemblies.","page":"Assembly p.5","id":744,"group":"Assembly methods","focus":true,"answerText":"Conveyor belt"},{"topic":"Assembly methods","q":"What distinguishes one-off assembly from batch assembly?","options":["Final fitting may be required","No drawings are used","All parts are interchangeable","Only welding is allowed"],"answer":0,"why":"A one-off fitter may drill, tap or ream holes after positioning parts.","page":"Assembly p.4","id":745,"group":"Assembly methods","focus":true,"answerText":"Final fitting may be required"},{"topic":"Assembly methods","q":"What is removed before a trial assembly is transported?","options":["All fitted parts","Only rivets","Only permanent welds","The completed trial assembly is dismantled"],"answer":3,"why":"After trial fitting and adjustment the structure is dismantled into units suitable for delivery.","page":"Assembly p.4","id":746,"group":"Assembly methods","focus":true,"answerText":"The completed trial assembly is dismantled"},{"topic":"Assembly methods","q":"Why offset dowels in a mechanical assembly?","options":["Increase bolt strength","Enforce one orientation","Reduce thread pitch","Improve paint finish"],"answer":1,"why":"Asymmetrical dowels prevent the wrong orientation of a fitted component.","page":"Assembly p.1","id":747,"group":"Assembly methods","focus":true,"answerText":"Enforce one orientation"},{"topic":"Dismantling & repairs","q":"Why avoid damaging pressure-vessel joint faces?","options":["To protect paint colour","To increase wall thickness","To retain fluid-tight joints","To reduce vessel weight"],"answer":2,"why":"Damaged mating faces may no longer seal correctly at reassembly.","page":"Assembly p.3","id":748,"group":"Dismantling & repair","focus":true,"answerText":"To retain fluid-tight joints"},{"topic":"Dismantling & repairs","q":"Why identify a component before stripping it?","options":["To simplify correct reassembly","To increase torque","To change its clearance","To remove corrosion"],"answer":0,"why":"Identification marks help return components to their original relationship and position.","page":"Assembly p.17","id":749,"group":"Dismantling & repair","focus":true,"answerText":"To simplify correct reassembly"},{"topic":"Dismantling & repairs","q":"What must be removed from equipment before applying a flame cutter?","options":["Only external paint","Screws and bolts","Identification markings","Flammable contents and hazardous residues"],"answer":3,"why":"Safe preparation requires assessing and removing dangerous contents and residues before hot cutting.","page":"Assembly pp.18–20","id":750,"group":"Dismantling & repair","focus":true,"answerText":"Flammable contents and hazardous residues"},{"topic":"Dismantling & repairs","q":"What is a permit-to-work used for?","options":["To set market value","To authorise controlled hazardous work","To record part dimensions","To increase lifting capacity"],"answer":1,"why":"A permit-to-work controls defined jobs and precautions before work begins.","page":"Assembly p.20","id":751,"group":"Dismantling & repair","focus":true,"answerText":"To authorise controlled hazardous work"},{"topic":"Tools & equipment","q":"What does a penetrating fluid mainly do?","options":["Loosen seized threads","Harden fasteners","Form a gasket","Cut a new thread"],"answer":0,"why":"A thin penetrating oil seeps into corroded threaded joints.","page":"Assembly p.17","id":752,"group":"Tools & equipment","focus":true,"answerText":"Loosen seized threads"},{"topic":"Tools & equipment","q":"What should be checked on a hammer before use?","options":["Shaft thread pitch","Battery charge","Fuel ratio","Handle, head fixing and face condition"],"answer":3,"why":"The manual requires a sound handle, secure head and a head free from cracking or chipping.","page":"Assembly p.15","id":753,"group":"Tools & equipment","focus":true,"answerText":"Handle, head fixing and face condition"},{"topic":"Tools & equipment","q":"Why use soft drift material during hammering?","options":["Increase blow speed","Protect a finished surface","Raise the joint temperature","Cut into the component"],"answer":1,"why":"Soft materials between hammer and work reduce damage to finished surfaces.","page":"Assembly p.16","id":754,"group":"Tools & equipment","focus":true,"answerText":"Protect a finished surface"},{"topic":"Tools & equipment","q":"What is an impact spanner intended for?","options":["Measuring bolt length","Setting screw pitch","Releasing tight fasteners by impact","Checking weld penetration"],"answer":2,"why":"The manual shows a purpose-built impact spanner struck with a hammer to free a tight joint.","page":"Assembly p.16","id":755,"group":"Tools & equipment","focus":true,"answerText":"Releasing tight fasteners by impact"},{"topic":"Tools & equipment","q":"What is the principal risk of a suspended load?","options":["Unexpected load movement or fall","Fastener corrosion","Loss of paint finish","Reduced motor output"],"answer":0,"why":"The manual warns against working beneath equipment suspended from lifting gear.","page":"Assembly p.6","id":756,"group":"Tools & equipment","focus":true,"answerText":"Unexpected load movement or fall"},{"topic":"Tools & equipment","q":"What supports larger components during storage?","options":["Hand-held rivet set","Metal file","Torque wrench","Wooden pallets or cradles"],"answer":3,"why":"Special wooden pallets and cradles protect larger components from damage.","page":"Assembly p.2","id":757,"group":"Tools & equipment","focus":true,"answerText":"Wooden pallets or cradles"},{"topic":"Fasteners, threads & washers","q":"What does the solidus of a solder indicate?","options":["The maximum torque","The fully solid temperature boundary","The welding arc current","The minimum rivet diameter"],"answer":1,"why":"Solidus is the temperature below which the solder alloy is fully solid.","page":"Assembly p.32","id":758,"group":"Soft soldering","focus":true,"answerText":"The fully solid temperature boundary"},{"topic":"Fasteners, threads & washers","q":"What is the main duty of a plain washer?","options":["Lock by itself","Seal a pipe joint","Spread clamping load","Set thread pitch"],"answer":2,"why":"A plain washer spreads load and protects a surface, but gives no locking action.","page":"Assembly p.25","id":759,"group":"Fasteners & washers","focus":true,"answerText":"Spread clamping load"},{"topic":"Fasteners, threads & washers","q":"How does a spring tension pin grip a hole?","options":["By elastic compression","By solder fusion","By a lock nut","By adhesive curing"],"answer":0,"why":"Its slotted tubular form compresses when driven into the hole.","page":"Assembly p.26","id":760,"group":"Fasteners & washers","focus":true,"answerText":"By elastic compression"},{"topic":"Locking devices","q":"Which nut has an elliptical deformed upper thread?","options":["Wing nut","Nyloc nut","Slotted nut","Philidas nut"],"answer":3,"why":"A Philidas nut uses a reduced deformed upper section to resist loosening.","page":"Assembly p.28","id":761,"group":"Locking devices","focus":true,"answerText":"Philidas nut"},{"topic":"Locking devices","q":"Why is a split pin usually replaced after removal?","options":["It becomes magnetic","It is deformed during use","It loses its thread pitch","It becomes welded"],"answer":1,"why":"Split pins deform when bent to retain a slotted or castellated nut and are generally not reused.","page":"Assembly p.28","id":762,"group":"Locking devices","focus":true,"answerText":"It is deformed during use"},{"topic":"Riveting","q":"Why is a blind rivet useful?","options":["It carries no shear","It never needs a drilled hole","It can be installed from one side","It can be unscrewed"],"answer":2,"why":"A blind or pop rivet is used when access to the reverse side is limited.","page":"Assembly p.30","id":763,"group":"Riveting","focus":true,"answerText":"It can be installed from one side"},{"topic":"Soft soldering","q":"What is solidus temperature?","options":["Temperature where alloy is completely solid","Temperature of base-metal fusion","Temperature of full vaporisation","Temperature of flux decomposition"],"answer":0,"why":"The solder is fully solid at and below its solidus temperature.","page":"Assembly p.32","id":764,"group":"Soft soldering","focus":true,"answerText":"Temperature where alloy is completely solid"},{"topic":"Soft soldering","q":"For 60/40 tin-lead solder, the manual gives liquidus as:","options":["183°C","200°C","212°C","188°C"],"answer":3,"why":"The page 32 table lists 60% tin / 40% lead at 183°C solidus and 188°C liquidus.","page":"Assembly p.32","id":765,"group":"Soft soldering","focus":true,"answerText":"188°C"},{"topic":"Soft soldering","q":"Which soldering method is suitable for small circuit joints?","options":["An oxy-acetylene torch","A soldering iron","A gas-cutting nozzle","A mechanical press"],"answer":1,"why":"The manual describes soldering irons for small parts and circuit work.","page":"Assembly p.31","id":766,"group":"Soft soldering","focus":true,"answerText":"A soldering iron"},{"topic":"Brazing","q":"Why must surfaces be cleaned before brazing?","options":["To harden the base metal","To lengthen the joint","To promote wetting by filler","To remove threads"],"answer":2,"why":"Brazing requires clean, oxide-free joint surfaces for wetting and capillary filling.","page":"Assembly pp.32–33","id":767,"group":"Brazing","focus":true,"answerText":"To promote wetting by filler"},{"topic":"Brazing","q":"Why are cadmium-bearing brazing alloys hazardous?","options":["They can emit toxic fumes when heated","They produce steam","They cause magnetic fields","They contain liquid oxygen"],"answer":0,"why":"The manual highlights toxic cadmium fumes and the need for effective extraction.","page":"Assembly p.33","id":768,"group":"Brazing","focus":true,"answerText":"They can emit toxic fumes when heated"},{"topic":"Welding","q":"Which welding process uses an inert gas and tungsten?","options":["MMA","MAG","Oxyfuel","TIG"],"answer":3,"why":"TIG uses a non-consumable tungsten electrode and inert shielding gas.","page":"Assembly p.35","id":769,"group":"Welding","focus":true,"answerText":"TIG"},{"topic":"Adhesives","q":"Which adhesive type softens again when reheated?","options":["Thermosetting resin","Brazing alloy","Thermoplastic resin","Epoxy after curing"],"answer":2,"why":"Thermoplastic resin softens with heat and undergoes no permanent chemical cure in bonding.","page":"Assembly p.38","id":770,"group":"Adhesives & bonding","focus":true,"answerText":"Thermoplastic resin"},{"topic":"Adhesives","q":"Which natural adhesive group comes from rock sources?","options":["Mineral","Vegetable","Animal","Thermoset"],"answer":0,"why":"The manual divides natural adhesives into animal, vegetable and mineral origins.","page":"Assembly p.38","id":771,"group":"Adhesives & bonding","focus":true,"answerText":"Mineral"},{"topic":"Adhesives","q":"What can prevent adequate adhesive strength?","options":["Correct surface prep","Approved curing","Compatible materials","Poor surface preparation"],"answer":3,"why":"The manual lists problems with preparing joint surfaces as an adhesive limitation.","page":"Assembly p.37","id":772,"group":"Adhesives & bonding","focus":true,"answerText":"Poor surface preparation"},{"topic":"Fire & extinguishers","q":"In the manual, carbon dioxide extinguisher colour is:","options":["French blue","Black","Pale cream","Signal red"],"answer":1,"why":"The manual’s historical colour table lists CO₂ as black.","page":"Safety p.15","id":773,"group":"Fire & extinguishers","focus":true,"answerText":"Black"},{"topic":"Gas containers","q":"In the manual, acetylene cylinders are:","options":["French grey","Peacock blue","Maroon","Signal red"],"answer":2,"why":"The gas-cylinder table shows acetylene in maroon.","page":"Safety p.15","id":774,"group":"Gas cylinders & codes","focus":true,"answerText":"Maroon"},{"topic":"Other safety","q":"What is the stated first action threshold for noise?","options":["85 dB(A)","65 dB(A)","95 dB(A)","105 dB(A)"],"answer":0,"why":"This is the older 85 dB(A) first action level printed in the training manual, not a current regulatory guide.","page":"Safety p.9","id":775,"group":"Other safety","focus":false,"answerText":"85 dB(A)"},{"topic":"Other safety","q":"What should be avoided when lifting manually?","options":["Checking weight","Planning route","Keeping load close","Jerking the load"],"answer":3,"why":"The manual instructs lifting smoothly without jerking.","page":"Safety p.8","id":776,"group":"Other safety","focus":false,"answerText":"Jerking the load"},{"topic":"Other safety","q":"Under the manual, what colour marks mandatory signs?","options":["Green","Blue","Red","Yellow"],"answer":1,"why":"Blue signs indicate mandatory actions in the colour-code table.","page":"Safety p.14","id":777,"group":"Other safety","focus":false,"answerText":"Blue"}];
const MAP=new Map(BANK.map(q=>[q.id,q]));
const GROUPS=[...new Set(BANK.map(q=>q.group))];
const FOCUS=BANK.filter(q=>q.focus);
const STORAGE='attp-master-aoc-777-v2';
const QUOTAS={'Assembly methods':10,'Dismantling & repair':4,'Tools & equipment':10,'Fasteners & washers':10,'Locking devices':6,'Riveting':5,'Soft soldering':5,'Brazing':5,'Welding':5,'Adhesives & bonding':5,'Fire & extinguishers':3,'Gas cylinders & codes':2};
let S=null,interval=null,view='home';
const $=q=>document.querySelector(q);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[j],a[i]]=[a[i],a[j]]}return a}
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(S))}catch(e){}}
function recover(){try{let saved=JSON.parse(localStorage.getItem(STORAGE)||'null');if(saved?.ids?.length&&saved?.choices&&saved?.picks&&['exam','study'].includes(saved?.mode)&&saved.ids.every(id=>MAP.has(id)))S=saved}catch(e){}}
function selected(){return Object.keys(S?.picks||{}).length}
function left(){return Math.max(0,60*60000-(Date.now()-S.startedAt))}
function mmss(n){let t=Math.ceil(Math.max(0,n)/1000);return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`}
function countGroup(g,focusOnly=false){return BANK.filter(q=>q.group===g&&(!focusOnly||q.focus)).length}
function stopTimer(){if(interval)clearInterval(interval);interval=null}
function start(type,ids,label){stopTimer();ids=shuffle(ids);const choices={};for(const id of ids)choices[id]=shuffle([0,1,2,3]);S={mode:type,ids,choices,picks:{},idx:0,flags:[],startedAt:Date.now(),finished:false,label,endedAt:null};persist();draw();window.scrollTo(0,0)}
function poolFor(scope){if(scope==='focus')return FOCUS;if(scope==='all')return BANK;return BANK.filter(q=>q.group===scope)}
function mock(){let ids=[],used=new Set();for(const [g,n] of Object.entries(QUOTAS)){let pool=shuffle(BANK.filter(q=>q.group===g&&q.focus&&!used.has(q.id)));for(const q of pool.slice(0,n)){ids.push(q.id);used.add(q.id)}}if(ids.length<70){for(const q of shuffle(FOCUS)){if(ids.length>=70)break;if(!used.has(q.id)){ids.push(q.id);used.add(q.id)}}}if(ids.length!==70){alert('Exam selection error');return}start('exam',ids,'AOC Mock · 70 questions / 60 minutes')}
function practice(){const scope=$('#scope').value,size=$('#count').value,pool=shuffle(poolFor(scope)).map(x=>x.id);const n=size==='all'?pool.length:Math.min(pool.length,Number(size));start('study',pool.slice(0,n),scope==='focus'?'AOC Master Revision':scope==='all'?'Full Module Revision':scope)}
function home(){view='home';stopTimer();const count=GROUPS.filter(g=>countGroup(g)>0).length;$('#app').innerHTML=`<section class="hero"><span class="pill">Seplat training manual · Full AOC question bank</span><h1 style="margin-top:15px">Mechanical AOC<br>Master CBT</h1><p>The 70-question exam is just one random mock. Study a comprehensive bank from the 42-page Assembly &amp; Disassembly manual and the 22-page Safety section.</p></section><div class="statgrid"><div class="stat"><b>${BANK.length}</b><span>Total MCQs</span></div><div class="stat"><b>${FOCUS.length}</b><span>AOC focus MCQs</span></div><div class="stat"><b>70 / 60</b><span>Mock questions / minutes</span></div></div><section class="container"><h2>Take the real-exam simulation</h2><p class="sub">70 different questions per attempt, selected across your instructor's AOC topics. Safety questions are limited to five, matching the handwritten emphasis.</p><div class="btnrow"><button class="btn" id="mock">Start 70-question timed mock</button>${S?`<button class="btn secondary" id="resume">${S.finished?'View last results':'Resume saved session'}</button>`:''}</div><div style="border-top:1px solid var(--line);margin:23px 0 18px"></div><h2>Study the complete bank</h2><p class="sub">Select all AOC topics, the entire manual, or one topic. Every answer gets an immediate explanation and page reference.</p><div class="setting"><div><label for="scope">Question pool</label><select id="scope"><option value="focus">AOC priority · ${FOCUS.length} Qs</option><option value="all">Whole manual · ${BANK.length} Qs</option>${GROUPS.map(g=>`<option value="${esc(g)}">${esc(g)} · ${countGroup(g)} Qs</option>`).join('')}</select></div><div><label for="count">Question batch</label><select id="count"><option value="25">25 questions</option><option value="50">50 questions</option><option value="100">100 questions</option><option value="all">All available</option></select></div><div style="display:flex;align-items:end"><button class="btn secondary full" id="begin">Start Study Mode</button></div></div><h3 style="margin-top:17px">Coverage by topic</h3><div class="topicgrid">${GROUPS.map(g=>`<button class="topicbtn" data-t="${esc(g)}"><span>${esc(g)}</span><small>${countGroup(g)} Qs</small></button>`).join('')}</div><div class="note"><b>Source note:</b> The answers follow the supplied training manual. Some extinguisher, gas-cylinder and safety-law details are historical; for practical work, use current labels, standards and site procedures.</div></section><p class="foot">All MCQs are self-contained. No questions ask you to reopen a page or inspect a diagram. Progress stays on your own device.</p>`;
$('#mock').onclick=()=>{if(S&&!S.finished&&!confirm('Replace your saved attempt with a new mock?'))return;mock()};$('#begin').onclick=()=>{if(S&&!S.finished&&!confirm('Replace your saved attempt with this study session?'))return;practice()};const resume=$('#resume');if(resume)resume.onclick=()=>draw();document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{$('#scope').value=b.dataset.t;$('#scope').scrollIntoView({behavior:'smooth',block:'center'})});}
function finish(timed=false){if(!S||S.finished)return;const blank=S.ids.length-selected();if(S.mode==='exam'&&!timed&&blank&&!(confirm(`${blank} unanswered questions. Submit the exam?`)))return;S.finished=true;S.endedAt=Date.now();S.timed=timed;persist();draw();window.scrollTo(0,0)}
function draw(){stopTimer();if(!S)return home();if(S.finished)return results();view='quiz';const id=S.ids[S.idx],q=MAP.get(id),picked=S.picks[id],done=picked!==undefined,istudy=S.mode==='study',n=S.ids.length,flags=S.flags||[];const display=S.choices[id];
const leftNav=Math.max(0,S.idx-12),rightNav=Math.min(n,leftNav+25),navIds=S.ids.slice(leftNav,rightNav);
$('#app').innerHTML=`<section class="container"><div class="topbar"><span class="pill">${istudy?'Study mode':'Timed mock exam'}</span><span class="timer" id="timer">${istudy?'Untimed':mmss(left())}</span></div><div class="meta" style="display:flex;justify-content:space-between;margin-top:13px"><span>Question ${S.idx+1} / ${n}</span><span>${selected()} answered · ${n-selected()} remaining</span></div><div class="progress-shell"><div class="progress-fill" style="width:${selected()*100/n}%"></div></div><div class="meta">${esc(q.group)} ${istudy?'· '+esc(S.label):''}</div><h1 class="question">${esc(q.q)}</h1><div class="choices">${display.map((original,i)=>{let active=picked===original,good=istudy&&done&&q.answer===original,bad=istudy&&done&&active&&q.answer!==original;return `<button class="option ${good?'good':bad?'bad':active?'selected':''}" data-choice="${original}" ${istudy&&done?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span class="option-label">${esc(q.options[original])}</span></button>`}).join('')}</div>${istudy&&done?`<div class="explain ${picked!==q.answer?'wrong':''}"><strong>${picked===q.answer?'Correct!':'Incorrect — '+esc(q.options[q.answer])}</strong>${esc(q.why)} <span class="meta">(${esc(q.page)})</span></div>`:''}<div class="testcontrols"><button class="btn secondary" id="prev" ${S.idx===0?'disabled':''}>← Previous</button><button class="btn ghost" id="flag">${flags.includes(id)?'★ Flagged':'☆ Flag'}</button><button class="btn secondary" id="next" ${S.idx>=n-1?'disabled':''}>Next →</button></div><div class="testcontrols"><button class="btn ghost" id="home">Home</button><button class="btn" id="submit">${istudy?'Finish study':'Submit exam'}</button></div><div class="meta" style="margin-top:14px">Question navigator ${n>25?'· showing nearby questions':''}</div><div class="navigator">${navIds.map((qid,i)=>{let idx=leftNav+i;return `<button class="navbtn ${S.idx===idx?'current':''} ${S.picks[qid]!==undefined?'done':''} ${flags.includes(qid)?'flagged':''}" data-nav="${idx}">${idx+1}</button>`}).join('')}</div><div class="legend"><span><i class="key"></i> Answered</span><span><i class="key todo"></i> Unanswered</span><span><i class="key flag"></i> Flagged</span></div></section><div class="foot">${esc(S.label)} · Source pages shown only after answering in Study Mode or finishing the exam.</div>`;
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(istudy&&done)return;S.picks[id]=Number(b.dataset.choice);persist();draw()});document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{S.idx=+b.dataset.nav;persist();draw();window.scrollTo(0,0)});$('#prev').onclick=()=>{S.idx--;persist();draw();window.scrollTo(0,0)};$('#next').onclick=()=>{S.idx++;persist();draw();window.scrollTo(0,0)};$('#flag').onclick=()=>{S.flags=flags.includes(id)?flags.filter(z=>z!==id):[...flags,id];persist();draw()};$('#home').onclick=()=>{persist();home();window.scrollTo(0,0)};$('#submit').onclick=()=>finish();
if(!istudy){const refresh=()=>{if(S.finished||!$('#timer'))return stopTimer();$('#timer').textContent=mmss(left());$('#timer').classList.toggle('urgent',left()<5*60000);if(left()<=0)finish(true)};interval=setInterval(refresh,500);refresh()}}
function results(){stopTimer();view='results';let n=S.ids.length,right=S.ids.filter(id=>S.picks[id]===MAP.get(id).answer).length,missed=S.ids.filter(id=>S.picks[id]!==MAP.get(id).answer),percent=Math.round(right/n*100),groups=[...new Set(S.ids.map(id=>MAP.get(id).group))].map(g=>{let ids=S.ids.filter(id=>MAP.get(id).group===g);return {name:g,n:ids.length,score:ids.filter(id=>S.picks[id]===MAP.get(id).answer).length}});
$('#app').innerHTML=`<section class="hero"><span class="pill">${S.timed?'Time expired':'Session completed'}</span><h1 style="margin-top:15px">Your Results</h1><p>${esc(S.label)} · ${selected()} answered</p></section><section class="container"><div class="summaryScore">${right}<span style="font-size:2rem;color:var(--muted)"> / ${n}</span></div><div class="summaryTag">${percent}% correct · ${percent>=90?'Excellent result':percent>=75?'Good result — review missed areas':'Keep practising weak topics'}</div><div class="progress-shell"><div class="progress-fill" style="width:${percent}%"></div></div><h2 style="margin-top:17px">Performance by topic</h2><div style="margin-top:10px">${groups.map(x=>`<div class="topicrow"><div>${esc(x.name)}<div class="mini"><div style="width:${x.score/x.n*100}%"></div></div></div><b>${x.score}/${x.n}</b></div>`).join('')}</div><div class="btnrow"><button class="btn" id="again">${S.mode==='exam'?'New random 70':'Another study set'}</button><button class="btn secondary" id="missed" ${missed.length?'':'disabled'}>Retry ${missed.length} missed</button><button class="btn ghost" id="home">Home</button></div></section><section class="container" style="margin-top:17px"><div class="sectionhead"><h2>Answers and explanations</h2><button class="btn secondary sm" id="toggle">Show answers</button></div><p class="sub">Use this as a revision key. Page references are included, but you don't need the manual to understand the answer.</p><div class="hidden" id="review">${S.ids.map((id,i)=>{let q=MAP.get(id),p=S.picks[id],correct=p===q.answer;return `<div class="reviewCard"><div class="meta">${i+1} · ${esc(q.group)} · ${esc(q.page)}</div><div class="q">${esc(q.q)}</div><div class="${correct?'answerGood':'answerBad'}">${correct?'✓ Correct':'✗ Your answer: '+(p===undefined?'Unanswered':esc(q.options[p]))}</div><div class="answerGood">Answer: ${esc(q.options[q.answer])}</div><p>${esc(q.why)}</p></div>`}).join('')}</div></section><div class="foot">This CBT is for exam preparation from the provided manual, not a substitute for current workplace safety requirements.</div>`;
$('#home').onclick=()=>{home();window.scrollTo(0,0)};$('#again').onclick=()=>S.mode==='exam'?mock():start('study',shuffle(poolFor(S.label==='AOC Master Revision'?'focus':S.label==='Full Module Revision'?'all':S.label)).slice(0,n).map(x=>x.id),S.label);$('#missed').onclick=()=>start('study',missed,'Missed questions revision');$('#toggle').onclick=()=>{let v=$('#review');v.classList.toggle('hidden');$('#toggle').textContent=v.classList.contains('hidden')?'Show answers':'Hide answers'};}
recover();home();
</script></body></html>
