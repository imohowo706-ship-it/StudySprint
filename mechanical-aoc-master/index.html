up":"Riveting","focus":true,"answerText":"Semi-tubular rivet"},{"topic":"Riveting equipment","page":"Assembly p. 29","q":"What advantage has a short-hole tubular rivet?","options":["Longer screw pitch","Lower material hardness always","Greater bolt torque","Lower closing force"],"answer":3,"why":"Its partially hollow shank makes clinching easier.","id":197,"group":"Riveting","focus":true,"answerText":"Lower closing force"},{"topic":"Riveting equipment","page":"Assembly p. 29","q":"What is a blind rivet used for?","options":["High-pressure soldering","Both-sided hammering only","Permanently threaded holes","Access from one side"],"answer":3,"why":"Blind or pop rivets are installed when the back is inaccessible.","id":198,"group":"Riveting","focus":true,"answerText":"Access from one side"},{"topic":"Riveting equipment","page":"Assembly p. 30","q":"What pulls the blind rivet mandrel?","options":["Soft-metal drift","Soldering iron","Spanner","Riveting tool"],"answer":3,"why":"The installation tool pulls the mandrel through the rivet body.","id":199,"group":"Riveting","focus":true,"answerText":"Riveting tool"},{"topic":"Riveting equipment","page":"Assembly p. 30","q":"What forms the blind rivet's second head?","options":["Thread-cutting die","Nut rotation","Mandrel movement","Flux application"],"answer":2,"why":"The mandrel deforms the rivet body on its blind side.","id":200,"group":"Riveting","focus":true,"answerText":"Mandrel movement"},{"topic":"Riveting equipment","page":"Assembly p. 30","q":"What happens to the blind rivet mandrel end?","options":["It breaks off","It is threaded out intact","It becomes a nut","It is soldered onto the plate"],"answer":0,"why":"The mandrel breaks at its designed break point after forming.","id":201,"group":"Riveting","focus":true,"answerText":"It breaks off"},{"topic":"Riveting equipment","page":"Assembly p. 30","q":"What does a self-piercing rivet eliminate?","options":["All joint inspection","Fastening force","Separate pilot drilling","Required material overlap"],"answer":2,"why":"It pierces the sheet material while clinching, so a separate hole may be unnecessary.","id":202,"group":"Riveting","focus":true,"answerText":"Separate pilot drilling"},{"topic":"Riveting equipment","page":"Assembly p. 30","q":"Where are self-piercing rivets cited?","options":["Power-station pipe brazing","Fuel injector plunger matching","Garage-door manufacture","Cylinder gas labelling"],"answer":2,"why":"The manual gives garage doors as a self-piercing rivet application.","id":203,"group":"Riveting","focus":true,"answerText":"Garage-door manufacture"},{"topic":"Riveting equipment","page":"Assembly p. 30","q":"Which rivet expands within a hole during setting?","options":["Cap nut","Bull-nose semi-tubular rivet","Pan-head screw","Split pin"],"answer":1,"why":"The manual describes bull-nose semi-tubular rivets expanding into the hole.","id":204,"group":"Riveting","focus":true,"answerText":"Bull-nose semi-tubular rivet"},{"topic":"Soldering & brazing tools","page":"Assembly p. 30","q":"What joins parts in soft soldering?","options":["Rivet deformation","Low-melting filler metal","Thread friction","Melting both base metals"],"answer":1,"why":"Solder melts to join surfaces without melting the parent metals.","id":205,"group":"Brazing","focus":true,"answerText":"Low-melting filler metal"},{"topic":"Soldering & brazing tools","page":"Assembly p. 31","q":"What does soldering flux remove?","options":["Surface oxide","All alloying elements","Rivet mandrels","Bolt threads"],"answer":0,"why":"Flux cleans oxides and improves solder wetting.","id":206,"group":"Brazing","focus":true,"answerText":"Surface oxide"},{"topic":"Soldering & brazing tools","page":"Assembly p. 31","q":"Which flux may require corrosive residue removal?","options":["Active flux","Resin flux","Uncoated copper wire","Passive resin flux"],"answer":0,"why":"Active fluxes can be corrosive and residues require proper cleaning.","id":207,"group":"Brazing","focus":true,"answerText":"Active flux"},{"topic":"Soldering & brazing tools","page":"Assembly p. 31","q":"Which flux is usually used in electronics?","options":["Molten brass","Acid zinc-chloride flux","Cement paste","Resin-based flux"],"answer":3,"why":"The manual describes passive resin-based fluxes for electrical work.","id":208,"group":"Brazing","focus":true,"answerText":"Resin-based flux"},{"topic":"Soldering & brazing tools","page":"Assembly p. 31","q":"What supplies heat to a small solder joint?","options":["Soldering iron","Rivet tongs","Torque wrench","Nut splitter"],"answer":0,"why":"A soldering iron heats the work sufficiently to melt solder at the joint.","id":209,"group":"Brazing","focus":true,"answerText":"Soldering iron"},{"topic":"Soldering & brazing tools","page":"Assembly p. 31","q":"Why use a heat sink while soldering?","options":["Make the alloy ferrous","Increase thread pitch","Increase rivet force","Protect nearby heat-sensitive parts"],"answer":3,"why":"A heat sink draws away excess heat from vulnerable components.","id":210,"group":"Brazing","focus":true,"answerText":"Protect nearby heat-sensitive parts"},{"topic":"Soldering & brazing tools","page":"Assembly p. 31","q":"What heats larger soldering work?","options":["Easy-out extractor","Tube spanner","Spring pin","Blowlamp or heated bath"],"answer":3,"why":"Large items may use a gas or electric heat source or be dipped into molten solder.","id":211,"group":"Brazing","focus":true,"answerText":"Blowlamp or heated bath"},{"topic":"Soldering & brazing tools","page":"Assembly p. 31","q":"What helps support a soldered electrical wire?","options":["A loose strand only","Wrapped mechanical connection","An oversized rivet","Lubricating graphite"],"answer":1,"why":"The manual recommends bending or wrapping wire around a terminal or hole for strength.","id":212,"group":"Brazing","focus":true,"answerText":"Wrapped mechanical connection"},{"topic":"Soldering & brazing tools","page":"Assembly p. 32","q":"What metals make ordinary soft solder in the manual?","options":["Aluminium and magnesium","Copper and zinc","Iron and carbon","Tin and lead"],"answer":3,"why":"The manual's soft-solder examples use tin-lead alloys.","id":213,"group":"Brazing","focus":true,"answerText":"Tin and lead"},{"topic":"Soldering & brazing tools","page":"Assembly p. 32","q":"What does a solder's solidus indicate?","options":["Completely molten boundary","Minimum gas-cylinder pressure","Fully solid temperature boundary","Maximum welding arc temperature"],"answer":2,"why":"Solidus marks the transition below which the alloy is entirely solid.","id":214,"group":"Brazing","focus":true,"answerText":"Fully solid temperature boundary"},{"topic":"Soldering & brazing tools","page":"Assembly p. 32","q":"What does a solder's liquidus indicate?","options":["Fully solid boundary","Electrical resistance only","Completely liquid boundary","Room-temperature hardness"],"answer":2,"why":"Liquidus marks the temperature above which the alloy is entirely liquid.","id":215,"group":"Brazing","focus":true,"answerText":"Completely liquid boundary"},{"topic":"Soldering & brazing tools","page":"Assembly p. 32","q":"What is brazing filler in the manual's definition?","options":["Melted steel plate","Solid screw thread","Molten metal drawn into the joint","Plastic weld rod"],"answer":2,"why":"Brazing uses melted filler drawn into a small joint gap without melting the parent metals.","id":216,"group":"Brazing","focus":true,"answerText":"Molten metal drawn into the joint"},{"topic":"Soldering & brazing tools","page":"Assembly pp. 32–33","q":"What effect draws brazing filler through the joint?","options":["Centrifugal rotation","Magnetic pull","Gravity alone","Capillary action"],"answer":3,"why":"Capillary action pulls molten filler into a close-fitting joint.","id":217,"group":"Brazing","focus":true,"answerText":"Capillary action"},{"topic":"Soldering & brazing tools","page":"Assembly p. 33","q":"What does brazing flux remove?","options":["Oxide film","Screw head","Machined bore diameter","Rivet shank"],"answer":0,"why":"The flux removes oxide and aids wetting of the joint surfaces.","id":218,"group":"Brazing","focus":true,"answerText":"Oxide film"},{"topic":"Soldering & brazing tools","page":"Assembly p. 33","q":"What flux is mentioned for brazing?","options":["Molten wax","Petroleum jelly","Borax-based flux","Plain water"],"answer":2,"why":"The manual describes borax as commonly used in brazing fluxes.","id":219,"group":"Brazing","focus":true,"answerText":"Borax-based flux"},{"topic":"Soldering & brazing tools","page":"Assembly p. 33","q":"Which brazing alloy is highlighted for aluminium?","options":["Aluminium-silicon alloy","Copper-zinc-free graphite","Tin-lead alloy","Plain carbon steel"],"answer":0,"why":"The manual cites aluminium-silicon fillers for brazing aluminium and its alloys.","id":220,"group":"Brazing","focus":true,"answerText":"Aluminium-silicon alloy"},{"topic":"Soldering & brazing tools","page":"Assembly p. 33","q":"Which brazing filler may produce toxic cadmium fumes?","options":["Cadmium-bearing silver brazing alloy","Lead-free tin solder","Plain flux","Graphite compound"],"answer":0,"why":"The manual warns that cadmium can give off toxic fumes during brazing.","id":221,"group":"Brazing","focus":true,"answerText":"Cadmium-bearing silver brazing alloy"},{"topic":"Soldering & brazing tools","page":"Assembly p. 34","q":"Which gas combination is a heating option?","options":["Helium and CO2","Nitrogen and argon","Oxygen and acetylene","Argon and carbon dioxide"],"answer":2,"why":"The manual lists oxyacetylene among common heating mixtures.","id":222,"group":"Brazing","focus":true,"answerText":"Oxygen and acetylene"},{"topic":"Soldering & brazing tools","page":"Assembly p. 34","q":"What should a brazing flame heat evenly?","options":["The gas regulator body","Joint area","Only the filler tip","Only the glove"],"answer":1,"why":"The manual warns against uneven heating when using a torch.","id":223,"group":"Brazing","focus":true,"answerText":"Joint area"},{"topic":"Soldering & brazing tools","page":"Assembly p. 34","q":"Which joint loading suits brazing best?","options":["Bending alone","Peel loading","Shear loading","Impact tension only"],"answer":2,"why":"The manual recommends designing brazed joints for shear rather than tension when possible.","id":224,"group":"Brazing","focus":true,"answerText":"Shear loading"},{"topic":"Welding equipment","page":"Assembly p. 35","q":"What produces arc-welding heat?","options":["Cold rivet head","Electric arc","Chemical threadlocker","Capillary attraction"],"answer":1,"why":"An arc between electrode and work supplies welding heat.","id":225,"group":"Welding","focus":true,"answerText":"Electric arc"},{"topic":"Welding equipment","page":"Assembly p. 35","q":"What protects a MMA weld pool?","options":["Nylon ring","Flat washer","Electrode flux coating","Threaded insert"],"answer":2,"why":"Flux coating produces gases and slag that protect the molten weld.","id":226,"group":"Welding","focus":true,"answerText":"Electrode flux coating"},{"topic":"Welding equipment","page":"Assembly p. 35","q":"Which part is consumed during MMA welding?","options":["Welding screen","Stick electrode","Ground clamp only","Baseplate"],"answer":1,"why":"The stick electrode melts and supplies weld metal.","id":227,"group":"Welding","focus":true,"answerText":"Stick electrode"},{"topic":"Welding equipment","page":"Assembly p. 35","q":"What electrode does TIG use?","options":["Non-consumable tungsten","Tin-lead wire","Flux-coated stick","Rivet mandrel"],"answer":0,"why":"TIG uses tungsten to sustain the arc without intentionally melting the electrode.","id":228,"group":"Welding","focus":true,"answerText":"Non-consumable tungsten"},{"topic":"Welding equipment","page":"Assembly p. 35","q":"What shields a TIG weld?","options":["Water spray","Graphite paste","Molten wax","Inert gas"],"answer":3,"why":"TIG normally uses inert gas such as argon to shield the arc and weld.","id":229,"group":"Welding","focus":true,"answerText":"Inert gas"},{"topic":"Welding equipment","page":"Assembly p. 35","q":"Which process uses a wire fed continuously?","options":["MIG/MAG welding","Capillary brazing","MMA welding","Riveting"],"answer":0,"why":"A wire-feed gun delivers the consumable electrode in MIG/MAG welding.","id":230,"group":"Welding","focus":true,"answerText":"MIG/MAG welding"},{"topic":"Welding equipment","page":"Assembly pp. 35–36","q":"What is MAG shielding typically based on?","options":["Pure oxygen only","Inert gas only","Water vapour only","Active gas"],"answer":3,"why":"MAG means metal active gas, commonly using CO2-containing shielding mixtures.","id":231,"group":"Welding","focus":true,"answerText":"Active gas"},{"topic":"Welding equipment","page":"Assembly p. 36","q":"Which gas is specifically used in CO2 welding?","options":["Acetylene","Carbon dioxide","Pure helium","Hydrogen"],"answer":1,"why":"The manual describes CO2 as a shielding gas for certain steel welding.","id":232,"group":"Welding","focus":true,"answerText":"Carbon dioxide"},{"topic":"Welding equipment","page":"Assembly p. 36","q":"What gas supports combustion in gas welding?","options":["Helium","Argon","Oxygen","Nitrogen"],"answer":2,"why":"Oxygen is mixed with the fuel gas to obtain a high-temperature flame.","id":233,"group":"Welding","focus":true,"answerText":"Oxygen"},{"topic":"Welding equipment","page":"Assembly p. 36","q":"Which gas is the manual's main gas-welding fuel?","options":["Argon","Carbon dioxide","Nitrogen","Acetylene"],"answer":3,"why":"The manual describes an oxyacetylene flame for gas welding.","id":234,"group":"Welding","focus":true,"answerText":"Acetylene"},{"topic":"Welding equipment","page":"Assembly p. 36","q":"Where is gas welding commonly useful in the manual?","options":["Non-metal wiring","Thin metal sheet","Precision threaded inserts only","Very large cast-in-place concrete"],"answer":1,"why":"The manual cites thin sheet, portability and repair applications.","id":235,"group":"Welding","focus":true,"answerText":"Thin metal sheet"},{"topic":"Welding equipment","page":"Assembly p. 36","q":"What adjusts the welding flame?","options":["Rivet setting tool","Centre punch","Torch gas controls","Stud extractor"],"answer":2,"why":"The oxygen and fuel controls regulate flame characteristics.","id":236,"group":"Welding","focus":true,"answerText":"Torch gas controls"},{"topic":"Welding equipment","page":"Assembly p. 35","q":"What is the work clamp's purpose?","options":["Measure mechanical torque","Complete the welding circuit","Hold brazing powder","Stop gas leakage"],"answer":1,"why":"A secure return connection is required for the arc-welding circuit.","id":237,"group":"Welding","focus":true,"answerText":"Complete the welding circuit"},{"topic":"Welding equipment","page":"Assembly pp. 34–36","q":"What can uncontrolled welding heat cause?","options":["No change to nearby parts","Distortion","Improved plastic strength","Better alignment always"],"answer":1,"why":"High or uneven welding heat can distort and damage adjacent components.","id":238,"group":"Welding","focus":true,"answerText":"Distortion"},{"topic":"Welding equipment","page":"Assembly p. 35","q":"Which process is preferred for fine sheet work in the manual?","options":["Nut splitting","TIG welding","Oxy-fuel cutting","Cold chiselling"],"answer":1,"why":"The manual notes TIG provides fine control and high-quality welds on thin sheet.","id":239,"group":"Welding","focus":true,"answerText":"TIG welding"},{"topic":"Adhesive & electrical tools","page":"Assembly p. 37","q":"Which tool is important before adhesive application?","options":["Impact spanner","Nut splitter","Surface-cleaning equipment","Flame cutter"],"answer":2,"why":"Bonded surfaces must be prepared and free of contaminants.","id":240,"group":"Adhesives & bonding","focus":true,"answerText":"Surface-cleaning equipment"},{"topic":"Adhesive & electrical tools","page":"Assembly p. 37","q":"What is an adhesive's key limitation for maintenance?","options":["Always unlimited temperature","Requires rivet holes","No surface preparation","Difficult dismantling"],"answer":3,"why":"Bonded parts may be difficult to separate for repair or replacement.","id":241,"group":"Adhesives & bonding","focus":true,"answerText":"Difficult dismantling"},{"topic":"Adhesive & electrical tools","page":"Assembly p. 38","q":"What is a cyanoacrylate adhesive known for?","options":["Fast-setting bonds","Arc shielding","Slow molten-metal joining","Rivet clinching"],"answer":0,"why":"The manual describes cyanoacrylates as fast-setting adhesives.","id":242,"group":"Adhesives & bonding","focus":true,"answerText":"Fast-setting bonds"},{"topic":"Adhesive & electrical tools","page":"Assembly p. 38","q":"What is a thermoplastic adhesive's heating response?","options":["Cross-links permanently on every heating","Becomes a metal","Always decomposes at room temperature","Softens on heating"],"answer":3,"why":"Thermoplastic resins soften with heat and do not chemically change when bonding.","id":243,"group":"Adhesives & bonding","focus":true,"answerText":"Softens on heating"},{"topic":"Adhesive & electrical tools","page":"Assembly p. 39","q":"What does a two-part epoxy require?","options":["Rivet mandrel pull","A nut and split pin","Resin and hardener mixing","Oxygen-acetylene flame"],"answer":2,"why":"Epoxy thermosetting adhesives typically use a resin plus curing agent.","id":244,"group":"Adhesives & bonding","focus":true,"answerText":"Resin and hardener mixing"},{"topic":"Adhesive & electrical tools","page":"Assembly p. 39","q":"Which adhesive family cures irreversibly?","options":["Water-based cleaner","Molten synthetic wax","Thermoplastic resins","Thermosetting resins"],"answer":3,"why":"Thermosetting resins form chemical cross-links during cure.","id":245,"group":"Adhesives & bonding","focus":true,"answerText":"Thermosetting resins"},{"topic":"Adhesive & electrical tools","page":"Assembly pp. 39–40","q":"Which adhesive is highlighted for strong structural bonding?","options":["Epoxy","Plain petroleum grease","Graphite","Water"],"answer":0,"why":"Epoxies provide strong durable bonds for many structural applications.","id":246,"group":"Adhesives & bonding","focus":true,"answerText":"Epoxy"},{"topic":"Adhesive & electrical tools","page":"Assembly p. 41","q":"What tool makes a crimped wire connection?","options":["Nut splitter","Pipe wrench","Rivet set","Crimping tool"],"answer":3,"why":"A crimp tool compresses the terminal around the conductor.","id":247,"group":"Adhesives & bonding","focus":true,"answerText":"Crimping tool"},{"topic":"Adhesive & electrical tools","page":"Assembly p. 41","q":"What does a terminal screw provide?","options":["Flux cleaning","Capillary solder flow","Clamping contact pressure","Rivet clinching"],"answer":2,"why":"A correctly tightened terminal screw clamps conductor and contact surfaces.","id":248,"group":"Adhesives & bonding","focus":true,"answerText":"Clamping contact pressure"},{"topic":"Adhesive & electrical tools","page":"Assembly p. 41","q":"Which joint uses solder to connect an electrical wire?","options":["Soldered connection","Wrapped-only connection","Stud-removal connection","Riveted flange"],"answer":0,"why":"A soldered terminal uses solder to establish electrical and mechanical contact.","id":249,"group":"Soft soldering","focus":true,"answerText":"Soldered connection"},{"topic":"Adhesive & electrical tools","page":"Assembly pp. 41–42","q":"What is used for quick detachable vehicle wiring?","options":["Insulated push-in connector","Rivet cutter","Gas-fired hearth","Structural brazing rod"],"answer":0,"why":"The manual mentions bullet and quick connectors in vehicle wiring.","id":250,"group":"Adhesives & bonding","focus":true,"answerText":"Insulated push-in connector"},{"topic":"Adhesive & electrical tools","page":"Assembly p. 41","q":"What should not strain an electrical terminal?","options":["Wire pulling force","Insulation colour","Connector label","Terminal plating"],"answer":0,"why":"Wires should be arranged so mechanical loads do not act directly on the terminals.","id":251,"group":"Adhesives & bonding","focus":true,"answerText":"Wire pulling force"},{"topic":"Safety & protective equipment","page":"Safety pp. 3–5","q":"What is the final defence against hazards?","options":["Proper machine guarding","PPE","Hazard elimination","Energy isolation"],"answer":1,"why":"The manual describes PPE as the last resort after other controls.","id":252,"group":"Other safety","focus":false,"answerText":"PPE"},{"topic":"Safety & protective equipment","page":"Safety p. 5","q":"What protects eyes from flying particles?","options":["Work apron","Safety boots","Ear defenders","Safety goggles"],"answer":3,"why":"Eye protection guards against impact and debris.","id":253,"group":"Other safety","focus":false,"answerText":"Safety goggles"},{"topic":"Safety & protective equipment","page":"Safety pp. 5–6","q":"Which PPE protects against excessive noise?","options":["Face shield","Boot covers","Ear defenders","Welding gauntlets"],"answer":2,"why":"Hearing protection reduces noise exposure to ears.","id":254,"group":"Other safety","focus":false,"answerText":"Ear defenders"},{"topic":"Safety & protective equipment","page":"Safety p. 6","q":"What protects against falling objects?","options":["Coveralls only","Safety helmet","Ear plugs","Cotton gloves"],"answer":1,"why":"Head protection reduces injury from impacts and falling objects.","id":255,"group":"Other safety","focus":false,"answerText":"Safety helmet"},{"topic":"Safety & protective equipment","page":"Safety p. 6","q":"Which footwear protects toes from impact?","options":["Safety boots with toe caps","Ordinary sandals","Safety spectacles","Rubber apron"],"answer":0,"why":"Steel or other approved protective toe caps protect against crushing injury.","id":256,"group":"Other safety","focus":false,"answerText":"Safety boots with toe caps"},{"topic":"Safety & protective equipment","page":"Safety p. 6","q":"Which item protects hands from chemicals?","options":["Suitable protective gloves","Hard hat","Ear defenders","Face shield alone"],"answer":0,"why":"Chemically compatible gloves reduce hand exposure.","id":257,"group":"Other safety","focus":false,"answerText":"Suitable protective gloves"},{"topic":"Safety & protective equipment","page":"Safety p. 6","q":"Which item protects the torso from splashes?","options":["Threaded pin","Stud remover","Eye-bolt","Protective apron"],"answer":3,"why":"Appropriate protective clothing helps prevent contact injuries.","id":258,"group":"Other safety","focus":false,"answerText":"Protective apron"},{"topic":"Safety & protective equipment","page":"Safety p. 4","q":"What device stops machinery in an emergency?","options":["Torque wrench","Emergency stop control","Flange union","Lifting lug"],"answer":1,"why":"Emergency stop devices are intended to rapidly initiate a safe stop.","id":259,"group":"Other safety","focus":false,"answerText":"Emergency stop control"},{"topic":"Safety & protective equipment","page":"Safety p. 4","q":"What protects workers from moving parts?","options":["Unprotected shafts","Machine guards","Loose clothing","Longer spanners"],"answer":1,"why":"Guards separate workers from hazardous moving parts.","id":260,"group":"Other safety","focus":false,"answerText":"Machine guards"},{"topic":"Safety & protective equipment","page":"Safety p. 4","q":"What makes a machine safe for maintenance?","options":["Instruction sticker alone","Start button alone","Painted guard","Energy isolation"],"answer":3,"why":"Equipment must be isolated from hazardous energy sources before repair.","id":261,"group":"Other safety","focus":false,"answerText":"Energy isolation"},{"topic":"Safety & protective equipment","page":"Safety p. 4","q":"Which control warns of machine hazards?","options":["Dowel pin","Rivet nut","Protective wax","Warning sign or alarm"],"answer":3,"why":"Clear signs or alarms communicate hazards and required precautions.","id":262,"group":"Other safety","focus":false,"answerText":"Warning sign or alarm"},{"topic":"Safety & protective equipment","page":"Safety p. 6","q":"What is required for hot-work eye protection?","options":["Correct rated eye/face protection","Clear lenses in every case","No protection when outdoors","Ordinary sunglasses"],"answer":0,"why":"Hot work requires appropriate protection against sparks and radiation.","id":263,"group":"Other safety","focus":false,"answerText":"Correct rated eye/face protection"},{"topic":"Safety & protective equipment","page":"Safety p. 13","q":"Which plug conductor is the earth?","options":["Grey","Brown","Blue","Green/yellow"],"answer":3,"why":"The manual identifies green/yellow as the protective earth conductor.","id":264,"group":"Other safety","focus":false,"answerText":"Green/yellow"},{"topic":"Safety & protective equipment","page":"Safety p. 13","q":"Which plug conductor is live?","options":["Green/yellow","Blue","Brown","Black/yellow"],"answer":2,"why":"The manual lists brown as live in current harmonised plug colours.","id":265,"group":"Other safety","focus":false,"answerText":"Brown"},{"topic":"Safety & protective equipment","page":"Safety p. 13","q":"Which plug conductor is neutral?","options":["Green/yellow","Brown","Blue","Red/black striped"],"answer":2,"why":"The manual identifies blue as the neutral conductor.","id":266,"group":"Other safety","focus":false,"answerText":"Blue"},{"topic":"Safety & protective equipment","page":"Safety p. 14","q":"What colour indicates mandatory safety action?","options":["Red","Green","Blue","Yellow"],"answer":2,"why":"The manual's table indicates blue for mandatory actions.","id":267,"group":"Other safety","focus":false,"answerText":"Blue"},{"topic":"Safety & protective equipment","page":"Safety p. 14","q":"What colour indicates safe conditions?","options":["Green","Blue","Yellow","Red"],"answer":0,"why":"Green marks safe conditions such as exits and first-aid facilities.","id":268,"group":"Other safety","focus":false,"answerText":"Green"},{"topic":"Safety & protective equipment","page":"Safety p. 14","q":"What colour indicates a warning?","options":["Yellow","Green","Blue","White alone"],"answer":0,"why":"Yellow is used for warnings of hazards or dangers.","id":269,"group":"Other safety","focus":false,"answerText":"Yellow"},{"topic":"Safety & protective equipment","page":"Safety p. 14","q":"What colour indicates prohibition?","options":["Yellow","Blue","Red","Green"],"answer":2,"why":"Red commonly indicates prohibited actions and fire equipment.","id":270,"group":"Other safety","focus":false,"answerText":"Red"},{"topic":"Safety & protective equipment","page":"Safety p. 15","q":"What colour is the manual's water extinguisher?","options":["Cream","Signal red","Black","Blue"],"answer":1,"why":"The manual's extinguisher table shows water as signal red.","id":271,"group":"Fire & extinguishers","focus":true,"answerText":"Signal red"},{"topic":"Safety & protective equipment","page":"Safety p. 15","q":"What colour is the manual's foam extinguisher?","options":["Black","Signal red","Pale cream","Blue"],"answer":2,"why":"The manual's historic full-colour table lists foam as pale cream.","id":272,"group":"Fire & extinguishers","focus":true,"answerText":"Pale cream"},{"topic":"Safety & protective equipment","page":"Safety p. 15","q":"What colour is the manual's powder extinguisher?","options":["Cream","Signal red","French blue","Black"],"answer":2,"why":"The manual lists powder as French blue in its historical scheme.","id":273,"group":"Fire & extinguishers","focus":true,"answerText":"French blue"},{"topic":"Safety & protective equipment","page":"Safety p. 15","q":"What colour is the manual's CO2 extinguisher?","options":["Black","Signal red","Cream","French blue"],"answer":0,"why":"The manual lists carbon dioxide extinguishers as black.","id":274,"group":"Fire & extinguishers","focus":true,"answerText":"Black"},{"topic":"Safety & protective equipment","page":"Safety p. 15","q":"What is the manual's oxygen cylinder colour?","options":["Peacock blue","Grey","Black","Maroon"],"answer":2,"why":"The table lists oxygen cylinders as black under its historical convention.","id":275,"group":"Gas cylinders & codes","focus":true,"answerText":"Black"},{"topic":"Safety & protective equipment","page":"Safety p. 15","q":"What is the manual's acetylene cylinder colour?","options":["Signal red","Peacock blue","Black","Maroon"],"answer":3,"why":"The table lists acetylene cylinder colour as maroon.","id":276,"group":"Gas cylinders & codes","focus":true,"answerText":"Maroon"},{"topic":"Safety & protective equipment","page":"Safety p. 15","q":"What is the manual's air cylinder colour?","options":["French grey","Maroon","Peacock blue","Signal red"],"answer":0,"why":"The manual lists air cylinders as French grey.","id":277,"group":"Gas cylinders & codes","focus":true,"answerText":"French grey"},{"topic":"Safety & protective equipment","page":"Safety p. 15","q":"What is the manual's hydrogen cylinder colour?","options":["Signal red","Peacock blue","Maroon","Black"],"answer":0,"why":"The manual lists hydrogen as signal red.","id":278,"group":"Gas cylinders & codes","focus":true,"answerText":"Signal red"},{"topic":"Safety & protective equipment","page":"Safety p. 15","q":"What is the manual's nitrogen cylinder colour?","options":["Black","Maroon","Peacock blue","French grey with black band"],"answer":3,"why":"The manual lists nitrogen as French grey with a black band.","id":279,"group":"Gas cylinders & codes","focus":true,"answerText":"French grey with black band"},{"topic":"Safety & protective equipment","page":"Safety p. 15","q":"What is the manual's propane cylinder colour?","options":["Signal red","Maroon","French grey","Black"],"answer":0,"why":"The manual lists propane as signal red.","id":280,"group":"Gas cylinders & codes","focus":true,"answerText":"Signal red"},{"topic":"Safety & protective equipment","page":"Safety p. 15","q":"What is the manual's CO2 cylinder colour?","options":["Black","Peacock blue","Cream","Grey"],"answer":0,"why":"The table lists carbon dioxide cylinders as black.","id":281,"group":"Gas cylinders & codes","focus":true,"answerText":"Black"},{"topic":"Safety & protective equipment","page":"Safety p. 18","q":"What extinguishing effect removes heat from fire?","options":["Smothering","Oxidation","Starvation","Cooling"],"answer":3,"why":"Water mainly works by cooling burning materials.","id":282,"group":"Other safety","focus":false,"answerText":"Cooling"},{"topic":"Safety & protective equipment","page":"Safety p. 18","q":"What extinguishing effect excludes oxygen?","options":["Increase of draught","Addition of fuel","Smothering","Cooling"],"answer":2,"why":"Smothering suppresses oxygen supply to the fire.","id":283,"group":"Other safety","focus":false,"answerText":"Smothering"},{"topic":"Safety & protective equipment","page":"Safety p. 18","q":"What extinguishing effect removes fuel?","options":["Oxidation","Condensation","Preheating","Starvation"],"answer":3,"why":"Starvation removes or isolates the combustible fuel.","id":284,"group":"Other safety","focus":false,"answerText":"Starvation"},{"topic":"Safety & protective equipment","page":"Safety p. 18","q":"What medium is generally suited to Class A fire?","options":["Petrol","Water","Oxygen gas","Acetylene"],"answer":1,"why":"Class A involves ordinary combustibles such as wood and paper.","id":285,"group":"Fire & extinguishers","focus":true,"answerText":"Water"},{"topic":"Safety & protective equipment","page":"Safety p. 18","q":"What medium is suited to flammable-liquid fires?","options":["Oxygen supply","Combustible solvent","Appropriate foam","Water jet in every case"],"answer":2,"why":"Foam can cover flammable liquids and suppress vapours.","id":286,"group":"Other safety","focus":false,"answerText":"Appropriate foam"},{"topic":"Safety & protective equipment","page":"Safety p. 18","q":"What extinguisher is suitable for electrical hazards?","options":["CO2 type","Foam-only hose","Water-only hose","Compressed oxygen"],"answer":0,"why":"CO2 leaves no conductive water residue; isolate electrical power where possible.","id":287,"group":"Fire & extinguishers","focus":true,"answerText":"CO2 type"},{"topic":"Safety & protective equipment","page":"Safety p. 18","q":"Which apparatus is used for electrical isolation?","options":["Rivet set","Spring pin","Lockout device","Soft-face hammer"],"answer":2,"why":"A suitable isolation and lockout arrangement prevents unintended energisation.","id":288,"group":"Other safety","focus":false,"answerText":"Lockout device"},{"topic":"Safety & protective equipment","page":"Safety p. 15","q":"What colour is an argon cylinder in the manual?","options":["Peacock blue","Maroon","French grey with black band","Black"],"answer":0,"why":"The gas-cylinder table identifies argon as peacock blue.","id":289,"group":"Gas cylinders & codes","focus":true,"answerText":"Peacock blue"},{"topic":"Safety & protective equipment","page":"Safety p. 18","q":"What fuel defines a Class A fire?","options":["Petrol and solvents","Live electrical cables","Propane and butane","Wood and paper"],"answer":3,"why":"Class A in the manual covers solid combustibles such as paper, wood and fabric.","id":290,"group":"Fire & extinguishers","focus":true,"answerText":"Wood and paper"},{"topic":"Safety & protective equipment","page":"Safety p. 18","q":"What fuel defines a Class B fire?","options":["Metal swarf only","Ordinary paper","Flammable liquids","Flammable gases"],"answer":2,"why":"The manual assigns oils, spirits and other flammable liquids to Class B.","id":291,"group":"Fire & extinguishers","focus":true,"answerText":"Flammable liquids"},{"topic":"Safety & protective equipment","page":"Safety p. 18","q":"What fuel defines a Class C fire?","options":["Petrol and oil","Ordinary cloth","Paper and timber","Flammable gases"],"answer":3,"why":"The manual's Class C refers to flammable gases such as propane and butane.","id":292,"group":"Fire & extinguishers","focus":true,"answerText":"Flammable gases"},{"topic":"Safety & protective equipment","page":"Safety p. 19","q":"Which extinguisher is noted as withdrawn?","options":["Foam","Water","CO2","Halon"],"answer":3,"why":"The manual notes halon was withdrawn because of ozone-depletion concerns.","id":293,"group":"Fire & extinguishers","focus":true,"answerText":"Halon"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 23","q":"Which head projects slightly above a countersink?","options":["Cheese head","Plain countersunk","Pan head","Raised countersunk"],"answer":3,"why":"A raised countersunk head has a low domed crown above its countersunk seating.","id":294,"group":"Fasteners & washers","focus":true,"answerText":"Raised countersunk"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 23","q":"What screw diameter limit is generally stated?","options":["36 mm","150 mm","10 mm","50 mm"],"answer":2,"why":"The manual gives machine screw diameters generally up to 10 mm.","id":295,"group":"Fasteners & washers","focus":true,"answerText":"10 mm"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 25","q":"What bolt diameter is generally stated as an upper value?","options":["6 mm","36 mm","10 mm","150 mm"],"answer":1,"why":"The manual says bolt thread diameters generally up to 36 mm.","id":296,"group":"Fasteners & washers","focus":true,"answerText":"36 mm"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly pp. 24–25","q":"What operation can a drill-point tapping screw eliminate?","options":["Driving the screw","Selecting screw length","Forming a threaded joint","Separate pilot-hole drilling"],"answer":3,"why":"The integral drill point makes the hole before forming its thread.","id":297,"group":"Fasteners & washers","focus":true,"answerText":"Separate pilot-hole drilling"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 25","q":"What thin-sheet limit is cited for self-drilling screws?","options":["8 SWG","18 SWG","4 SWG","28 SWG"],"answer":1,"why":"The manual cites sheet metal up to about 18 SWG, roughly 1.2 mm, for the example.","id":298,"group":"Fasteners & washers","focus":true,"answerText":"18 SWG"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 24","q":"What carries chips away from a cutting tap screw?","options":["Nylon inserts","Locking tabs","Cutting flutes","Spring washers"],"answer":2,"why":"Flutes or grooves in cutting-type self-tappers create room for chips.","id":299,"group":"Fasteners & washers","focus":true,"answerText":"Cutting flutes"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 25","q":"What prevents a thread-end from projecting beyond a dome nut?","options":["Closed nut top","Split-pin hole","Spring steel arm","External serration"],"answer":0,"why":"A dome or cap nut covers the protruding bolt end.","id":300,"group":"Fasteners & washers","focus":true,"answerText":"Closed nut top"},{"topic":"Assembly & fitting tools","page":"Assembly p. 15","q":"Which hammer is shown besides ball-pein?","options":["Claw only","Cross-pein","Sledge only","Rubber mallet only"],"answer":1,"why":"The manual identifies ball-pein, cross-pein and straight-pein hammers.","id":301,"group":"Tools & equipment","focus":true,"answerText":"Cross-pein"},{"topic":"Assembly & fitting tools","page":"Assembly p. 15","q":"Which other pein hammer does the manual show?","options":["Straight-pein","Claw hammer","Dead-blow mallet","Sledgehammer"],"answer":0,"why":"The manual depicts straight-pein as well as cross-pein and ball-pein hammers.","id":302,"group":"Tools & equipment","focus":true,"answerText":"Straight-pein"},{"topic":"Assembly & fitting tools","page":"Assembly pp. 15–16","q":"Why avoid direct blows to machined surfaces?","options":["Increases solder wetting","Risk of surface bruising","Changes thread pitch","Eliminates spring load"],"answer":1,"why":"The manual warns that direct hammer blows can bruise or damage machined surfaces.","id":303,"group":"Tools & equipment","focus":true,"answerText":"Risk of surface bruising"},{"topic":"Soldering & brazing tools","page":"Assembly p. 42","q":"Which joining process stays below 300°C in the manual's table?","options":["Soldering","Welding","Brazing","Flame cutting"],"answer":0,"why":"The relative-merits table lists soldering as needing less than 300 degrees Celsius.","id":304,"group":"Brazing","focus":true,"answerText":"Soldering"},{"topic":"Soldering & brazing tools","page":"Assembly p. 42","q":"Which process uses heat above 450°C in the table?","options":["Brazing","Cold riveting","Soft soldering","Adhesive bonding"],"answer":0,"why":"The manual's comparison table specifies brazing above 450 degrees Celsius.","id":305,"group":"Brazing","focus":true,"answerText":"Brazing"},{"topic":"Adhesive & electrical tools","page":"Assembly p. 38","q":"How are adhesives broadly grouped?","options":["Hot and cold only","Ferrous and nonferrous","Acid and alkali only","Natural and synthetic"],"answer":3,"why":"The adhesive classification separates natural from synthetic materials.","id":306,"group":"Adhesives & bonding","focus":true,"answerText":"Natural and synthetic"},{"topic":"Adhesive & electrical tools","page":"Assembly p. 39","q":"What solvent group is linked to neoprene adhesives?","options":["Metal filler rods","Two-part epoxies","Solvent-based rubber adhesives","Solder fluxes"],"answer":2,"why":"The manual describes polychloroprene or neoprene adhesives as solvent-based.","id":307,"group":"Adhesives & bonding","focus":true,"answerText":"Solvent-based rubber adhesives"},{"topic":"Adhesive & electrical tools","page":"Assembly pp. 38–39","q":"What adhesive class softens on reheating?","options":["Thermoplastic","Thermosetting","Chemical threadlocker only","Fully cured epoxy"],"answer":0,"why":"Thermoplastic adhesives can soften again when heated, unlike cured thermosets.","id":308,"group":"Adhesives & bonding","focus":true,"answerText":"Thermoplastic"},{"topic":"Welding equipment","page":"Assembly p. 35","q":"What does MMA stand for?","options":["Metal mandrel assembly","Manual metal arc","Manual material alignment","Mechanical molten alloy"],"answer":1,"why":"The manual names manual metal arc as the stick-electrode welding process.","id":309,"group":"Welding","focus":true,"answerText":"Manual metal arc"},{"topic":"Welding equipment","page":"Assembly p. 35","q":"Which gas is often used in TIG shielding?","options":["Argon","Pure oxygen","Hydrogen","Acetylene"],"answer":0,"why":"TIG commonly employs argon or another inert gas for shielding.","id":310,"group":"Welding","focus":true,"answerText":"Argon"},{"topic":"Welding equipment","page":"Assembly p. 36","q":"Which gas-welding setup can reach about 3250°C?","options":["Oxyacetylene","Argon alone","CO2 shielding","Nitrogen purge"],"answer":0,"why":"The manual gives about 3250°C for an oxyacetylene welding flame.","id":311,"group":"Welding","focus":true,"answerText":"Oxyacetylene"},{"topic":"Riveting equipment","page":"Assembly p. 29","q":"Why are tubular rivets easier to clinch?","options":["Larger bolt threads","Hollow shank","Flux-coated head","Nylon insert"],"answer":1,"why":"Less deformation force is needed around their hollow end.","id":312,"group":"Riveting","focus":true,"answerText":"Hollow shank"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 17","q":"What protects hands during paraffin cleaning?","options":["Ordinary paper","Leather welding sleeves alone","Plastic or rubber gloves","Bare hands"],"answer":2,"why":"The manual calls for plastic or rubber gloves because paraffin can irritate skin.","id":313,"group":"Tools & equipment","focus":true,"answerText":"Plastic or rubber gloves"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"What must be planned carefully at the design stage to achieve a successful assembly?","options":["Only the factory shift roster","Only the packaging design","Only the paint colour","The assembly sequence and component accessibility"],"answer":3,"why":"The manual says successful assembly depends on careful design-stage planning.","id":314,"group":"Assembly methods","focus":true,"answerText":"The assembly sequence and component accessibility"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"Why should the fastening of a component remain accessible during assembly?","options":["So all bolts can be welded permanently","So later components can be installed and fastening tools used","To eliminate the need for drawings","So the assembly becomes heavier"],"answer":1,"why":"A component must not block the position or fastening of the next component.","id":315,"group":"Assembly methods","focus":true,"answerText":"So later components can be installed and fastening tools used"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"Why are bolts and dowels sometimes placed asymmetrically?","options":["To replace lubrication","To prevent parts being assembled in the wrong orientation","To increase the weight of the joint","To make every part interchangeable in any direction"],"answer":1,"why":"Offset locating features make incorrect assembly orientation difficult or impossible.","id":316,"group":"Assembly methods","focus":true,"answerText":"To prevent parts being assembled in the wrong orientation"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"What document shows component positions and their relationships to adjacent parts?","options":["Purchase invoice","General arrangement drawing","Material safety data sheet","Time sheet"],"answer":1,"why":"General arrangement drawings identify where parts are located and how they relate.","id":317,"group":"Assembly methods","focus":true,"answerText":"General arrangement drawing"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"Which assembly method is especially suitable when modifying an existing machine on site with a replacement motor of a different size?","options":["Adhesive-only assembly","Batch production of identical chucks","Mass-production line assembly","On-site assembly without prefabrication"],"answer":3,"why":"The manual describes fitting new mounting arrangements to a more compact replacement motor on site.","id":318,"group":"Assembly methods","focus":true,"answerText":"On-site assembly without prefabrication"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"A fitter aligns the centre of a replacement motor shaft with existing equipment. What is the main reason?","options":["To achieve proper shaft alignment for the drive","To remove all fasteners","To change the motor's electrical frequency","To increase motor mass"],"answer":0,"why":"A replacement motor's shaft centre must align with the driven equipment.","id":319,"group":"Assembly methods","focus":true,"answerText":"To achieve proper shaft alignment for the drive"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"Which operation commonly uses prefabricated pieces combined with on-site fitting?","options":["Manufacturing every valve on a conveyor","Grinding all bearings together","Recycling only scrap steel","Ventilating duct installation"],"answer":3,"why":"Ventilation sections may be fabricated from sheet metal in a workshop then erected on site.","id":320,"group":"Assembly methods","focus":true,"answerText":"Ventilating duct installation"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"In the manual, what is the key feature of large-structure assembly?","options":["Only one worker is allowed at all times","Many teams and lifting equipment must be coordinated in sequence","No cranes are needed","Every component must be welded on the first day"],"answer":1,"why":"Large projects need coordinated sequencing of teams and heavy components.","id":321,"group":"Assembly methods","focus":true,"answerText":"Many teams and lifting equipment must be coordinated in sequence"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"Why is trial assembly performed before transporting a large structure?","options":["To check fit and correct faults before delivery","To ensure parts are never dismantled","To avoid making any drawings","To replace the customer's site"],"answer":0,"why":"Trial assembly exposes snags before shipment; then parts are dismantled for transport.","id":322,"group":"Assembly methods","focus":true,"answerText":"To check fit and correct faults before delivery"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"How does one-off assembly differ from batch assembly?","options":["One-off work may need skilled fitting of partly finished parts","One-off assembly never uses drawings","One-off assembly always requires robots","Batch assembly always involves one custom prototype"],"answer":0,"why":"In one-off assembly, fitters may drill, tap, and ream holes after positioning components.","id":323,"group":"Assembly methods","focus":true,"answerText":"One-off work may need skilled fitting of partly finished parts"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"In one-off assembly, which operations may the fitter perform after positioning parts?","options":["Casting the complete refinery","Electroplating all components automatically","Replacing the design with a conveyor","Drilling, tapping and reaming holes"],"answer":3,"why":"The manual specifically mentions drilling and tapping screw holes and reaming dowel holes.","id":324,"group":"Assembly methods","focus":true,"answerText":"Drilling, tapping and reaming holes"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"Which item is the manual's example of batch assembly?","options":["Self-centring lathe chucks","A complete oil refinery","A custom-installed ventilation duct","A large highway bridge"],"answer":0,"why":"Batch assembly concerns small or medium quantities of the same device, such as lathe chucks.","id":325,"group":"Assembly methods","focus":true,"answerText":"Self-centring lathe chucks"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"Which production method uses workers or machines adding parts sequentially along a conveyor?","options":["Trial erection","Line assembly","On-site workshop repair","One-off assembly"],"answer":1,"why":"Line assembly produces very large quantities, often with interchangeable finished components.","id":326,"group":"Assembly methods","focus":true,"answerText":"Line assembly"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"What is required of components in line assembly to minimise adjustment?","options":["Random dimensions","Different threads on identical parts","Individual scraping of every mating face","High accuracy and interchangeability"],"answer":3,"why":"Line assembly depends on components fitting without skilled hand adjustment.","id":327,"group":"Assembly methods","focus":true,"answerText":"High accuracy and interchangeability"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"A hydraulic machine joint is repaired where the machine is installed; the system is drained, refilled, bled and pressure-tested. Which method is this?","options":["Factory-only line assembly","On-site replacement followed by workshop overhaul only","Trial assembly","On-site dismantling and repair"],"answer":3,"why":"The manual describes this precise hydraulic-joint repair as an on-site job.","id":328,"group":"Assembly methods","focus":true,"answerText":"On-site dismantling and repair"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"Why is air bled from a hydraulic system after repair and refill?","options":["To increase corrosion rate","To remove trapped air before testing and operation","To avoid checking leaks","To replace hydraulic fluid permanently"],"answer":1,"why":"The manual says air is bled off before the repaired system is pressure-tested.","id":329,"group":"Assembly methods","focus":true,"answerText":"To remove trapped air before testing and operation"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"When a machine's defective motor is transported to the manufacturer's workshop for repair, this is:","options":["One-off fabrication","On-site dismantling followed by workshop repair","Line assembly","Scrap-only dismantling"],"answer":1,"why":"The motor is removed on site and repaired elsewhere.","id":330,"group":"Assembly methods","focus":true,"answerText":"On-site dismantling followed by workshop repair"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"What is the advantage of fitting a reconditioned motor while the original is being repaired?","options":["It eliminates the need for maintenance","It prevents all future failures","The machine can continue operating with less downtime","It makes alignment unnecessary"],"answer":2,"why":"Interchangeable spare equipment reduces production interruption.","id":331,"group":"Assembly methods","focus":true,"answerText":"The machine can continue operating with less downtime"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"What does selective assembly involve?","options":["Matching combinations of parts to meet a specified tolerance","Always joining only with adhesives","Tightening every bolt to the same torque","Using any component without measuring dimensions"],"answer":0,"why":"Selective assembly is used for precise fits such as a fuel pump plunger and barrel.","id":332,"group":"Assembly methods","focus":true,"answerText":"Matching combinations of parts to meet a specified tolerance"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"What distinguishes non-selective assembly from selective assembly?","options":["It requires every joint to be hand scraped","Parts are made within tolerances to fit without individual matching or hand-fitting","It does not require dimensional tolerance","It is only used for obsolete motors"],"answer":1,"why":"Non-selective assembly enables volume production with interchangeable components.","id":333,"group":"Assembly methods","focus":true,"answerText":"Parts are made within tolerances to fit without individual matching or hand-fitting"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"Why might joint faces be hand-scraped during precision assembly?","options":["To change the chemical composition","To remove high spots and obtain the specified fit","To make all surfaces rough deliberately","To replace the machine drawing"],"answer":1,"why":"The manual mentions fitting allowance and scraping at assembly.","id":334,"group":"Assembly methods","focus":true,"answerText":"To remove high spots and obtain the specified fit"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"What does FIFO mean for stored body panels?","options":["First inspected, final output","Finished inventory, final overhaul","First in, first out","Fitting inspection for operation"],"answer":2,"why":"Stored parts are issued in the order they were received.","id":335,"group":"Assembly methods","focus":true,"answerText":"First in, first out"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"How does the manual suggest protecting precision milling cutters in storage?","options":["Immersing all tools in water","Leaving cutting edges uncovered","Using welding heat to harden them in storage","Dipping small components in protective synthetic wax"],"answer":3,"why":"Tough synthetic wax limits mechanical damage to sharp edges.","id":336,"group":"Assembly methods","focus":true,"answerText":"Dipping small components in protective synthetic wax"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"What are plastic plugs and caps used to protect during storage?","options":["Welding electrodes","Only moving belts","Only paint labels","Bores and external screw threads"],"answer":3,"why":"The manual recommends plugs for bores and caps for external threads.","id":337,"group":"Assembly methods","focus":true,"answerText":"Bores and external screw threads"},{"topic":"Assembly fundamentals & methods","page":"Assembly pp. 1–9","q":"What protects precision-ground surfaces when lifting heavy subassemblies?","options":["Designed lifting lugs and eye-bolts","Suspending equipment from a bearing shaft","Wrapping unprotected chains around precision surfaces","Using any available bolt as a lifting point"],"answer":0,"why":"Lifting attachments reduce contact damage when used with correct rigging.","id":338,"group":"Assembly methods","focus":true,"answerText":"Designed lifting lugs and eye-bolts"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"Why can dismantling a large component be more dangerous than stripping a small bench assembly?","options":["It may require special lifting, support and handling equipment","Large equipment is always lighter","It cannot contain any residual energy","Its mass removes all loading forces"],"answer":0,"why":"The manual distinguishes bench work from larger components needing special handling.","id":339,"group":"Dismantling & repair","focus":true,"answerText":"It may require special lifting, support and handling equipment"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"What is the rule about working beneath a load suspended by a crane?","options":["Never work beneath a suspended load","Support it with a hand-held spanner","Work beneath it if the slings appear strong","Only avoid it when working alone"],"answer":0,"why":"Loads must be lowered onto suitable supports before work beneath them.","id":340,"group":"Tools & equipment","focus":true,"answerText":"Never work beneath a suspended load"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"What are static assemblies in the manual's classification?","options":["All pump assemblies with rotating shafts","Only electronic circuits","Only hydraulic cylinders","Assemblies or structures with no moving parts"],"answer":3,"why":"Examples include cranes, structures and storage tanks; other assemblies have moving parts.","id":341,"group":"Tools & equipment","focus":true,"answerText":"Assemblies or structures with no moving parts"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"Why should dismantled structural steel components be marked or numbered?","options":["To replace lifting procedures","To permit correct reassembly in the original positions","To conceal assembly identity","To increase corrosion"],"answer":1,"why":"Identification assists correct order, orientation and reassembly.","id":342,"group":"Dismantling & repair","focus":true,"answerText":"To permit correct reassembly in the original positions"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"Why should threads be cleaned before unscrewing a seized fastener?","options":["To make the threads softer with paint","To weld nut and bolt together","To reduce the fastener's diameter","To remove deposits that obstruct removal and damage threads"],"answer":3,"why":"Cleaning and penetrating fluid can help free corroded fasteners.","id":343,"group":"Dismantling & repair","focus":true,"answerText":"To remove deposits that obstruct removal and damage threads"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"What is the main purpose of a penetrating oil on a seized nut?","options":["To enter narrow thread clearances and aid loosening","To cut the nut in half","To permanently bond the nut","To remove all mechanical loads"],"answer":0,"why":"The manual notes capillary action draws thin penetrating fluid into threads.","id":344,"group":"Dismantling & repair","focus":true,"answerText":"To enter narrow thread clearances and aid loosening"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"When a fastening cannot be undone, what does a nut splitter do?","options":["Polishes a flange gasket","Measures a bolt's torque","Breaks the nut so it can be removed","Cuts a new screw thread on the bolt"],"answer":2,"why":"A nut splitter is a destructive nut-removal tool used to protect neighbouring parts when suitable.","id":345,"group":"Dismantling & repair","focus":true,"answerText":"Breaks the nut so it can be removed"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"What is the purpose of a stud remover?","options":["To measure airflow","To set a rivet head","To make a gasket","To grip and turn a stud for removal"],"answer":3,"why":"The manual describes removing studs with locked nuts or a dedicated roller-grip tool.","id":346,"group":"Dismantling & repair","focus":true,"answerText":"To grip and turn a stud for removal"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"What does an 'easy-out' remove?","options":["A fully functioning bearing","A broken screw or stud after a suitable pilot hole is drilled","A complete gearbox with no dismantling","Molten solder from a tank"],"answer":1,"why":"An easy-out is a reverse-thread extractor used on some broken fasteners.","id":347,"group":"Dismantling & repair","focus":true,"answerText":"A broken screw or stud after a suitable pilot hole is drilled"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"What is the main disadvantage of chiselling a rivet head off?","options":["It automatically forms a new head","It avoids any risk of damage","It makes the rivet reusable","The rivet must be destroyed and nearby material can be damaged"],"answer":3,"why":"Destructive rivet removal requires care to protect assembled components.","id":348,"group":"Tools & equipment","focus":true,"answerText":"The rivet must be destroyed and nearby material can be damaged"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"What is flame cutting used for during dismantling?","options":["Measuring shaft concentricity","Cutting large metal sections such as structures and pipework","Joining two electronic wires","Adjusting the fit of a bearing"],"answer":1,"why":"The manual presents oxy-fuel cutting for large dismantling work.","id":349,"group":"Dismantling & repair","focus":true,"answerText":"Cutting large metal sections such as structures and pipework"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"What is the fundamental precaution before dismantling a plant system?","options":["Open vessels before identifying contents","Assess hazards and make the system safe under the required authorisation","Assume it has no pressure","Leave electrical power connected"],"answer":1,"why":"The manual requires safety checks, isolation and permit-to-work arrangements.","id":350,"group":"Dismantling & repair","focus":true,"answerText":"Assess hazards and make the system safe under the required authorisation"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"Why must a vessel be checked before opening even after its liquid has been drained?","options":["An empty tank cannot burn","Flammable or hazardous vapours may still remain","Residual vapours make insulation unnecessary","A vessel is automatically inert after draining"],"answer":1,"why":"Draining liquid does not ensure the absence of dangerous vapours.","id":351,"group":"Tools & equipment","focus":true,"answerText":"Flammable or hazardous vapours may still remain"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"Before working on electrical equipment, the supply should be:","options":["Short-circuited with a metal tool","Isolated by a qualified authorised person and secured against reconnection","Left on to show the work area","Isolated only by removing an unrelated fuse"],"answer":1,"why":"The manual stresses isolation, fuses or locks, and authorised work.","id":352,"group":"Tools & equipment","focus":true,"answerText":"Isolated by a qualified authorised person and secured against reconnection"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"Why should a lifting spreader be used with a wide unstable vessel or load when required?","options":["To increase uncontrolled swinging","To eliminate the load's weight","To replace rated slings","To distribute lifting forces and maintain suitable lifting geometry"],"answer":3,"why":"Lifting arrangements must match load geometry and stability.","id":353,"group":"Tools & equipment","focus":true,"answerText":"To distribute lifting forces and maintain suitable lifting geometry"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"For a tight screw fastening, why is a correctly fitting spanner essential?","options":["It prevents all corrosion","It transmits torque without rounding nut or bolt corners","It reduces the need for torque control","It makes every nut self-locking"],"answer":1,"why":"Incorrect jaw size can damage fastener corners and cause slipping.","id":354,"group":"Tools & equipment","focus":true,"answerText":"It transmits torque without rounding nut or bolt corners"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"What is the danger of extending a spanner using a long pipe?","options":["It eliminates the risk of slipping","It guarantees correct preload","It always reduces torque","Excessive leverage may damage the spanner or fastening and cause injury"],"answer":3,"why":"The manual warns that improvised extensions can overload tools and fasteners.","id":355,"group":"Tools & equipment","focus":true,"answerText":"Excessive leverage may damage the spanner or fastening and cause injury"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"How should a fitter generally position a spanner when loosening or tightening?","options":["Use a hammer on every standard spanner","Push it toward obstacles with an open hand","Pull toward the body where practicable, keeping hands clear","Apply the tool at an angle to the nut"],"answer":2,"why":"The manual recommends pulling where practicable and avoiding slipping injuries.","id":356,"group":"Tools & equipment","focus":true,"answerText":"Pull toward the body where practicable, keeping hands clear"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"What tool is specified when tightening torque must be accurately controlled?","options":["Torque wrench","Soldering iron","Cold chisel","Centre punch"],"answer":0,"why":"A torque wrench is used to apply the specified tightening torque.","id":357,"group":"Tools & equipment","focus":true,"answerText":"Torque wrench"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"Which set consists entirely of torque-wrench types described in the module?","options":["Screwdriver, tap, die and punch","Only pneumatic and hydraulic","Beam, click, dial and digital","Only riveting and brazing"],"answer":2,"why":"The manual illustrates four common torque-wrench styles.","id":358,"group":"Tools & equipment","focus":true,"answerText":"Beam, click, dial and digital"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"Why must a screwdriver blade fit the screw recess correctly?","options":["Poor fit can damage the recess and slip during use","It makes correct torque irrelevant","The screw should always crack","All screwdrivers are interchangeable"],"answer":0,"why":"Correct selection prevents slipping and damage.","id":359,"group":"Tools & equipment","focus":true,"answerText":"Poor fit can damage the recess and slip during use"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"When is an adjustable spanner or pipe wrench preferable according to the manual?","options":["To make all bolts self-locking","For every precision nut","As a last resort when suitable fixed tools are unavailable","Whenever maximum leverage is needed"],"answer":2,"why":"The manual cautions against unnecessary use due to potential corner damage.","id":360,"group":"Tools & equipment","focus":true,"answerText":"As a last resort when suitable fixed tools are unavailable"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"How can a large hammer damage a workpiece?","options":["A large hammer improves every precision fit","Impact cannot damage metal","Excessive impact can deform the part and reduce control","Hammer size never affects the result"],"answer":2,"why":"Use the correct size and type of hammer for the work.","id":361,"group":"Tools & equipment","focus":true,"answerText":"Excessive impact can deform the part and reduce control"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"Which defects make a hammer unsafe to use?","options":["A correctly chosen hammer face","A sound, properly fitted head","A clean and secure handle","A split handle, insecure head or cracked/chipped head"],"answer":3,"why":"The manual lists those three hammer-condition checks.","id":362,"group":"Tools & equipment","focus":true,"answerText":"A split handle, insecure head or cracked/chipped head"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"Why is a soft-metal drift sometimes used between a hammer and workpiece?","options":["To protect finished surfaces from direct hard-hammer impact","To increase thread stripping","To provide electrical insulation at any voltage","To weld the hammer to the component"],"answer":0,"why":"A suitable drift can reduce marking of vulnerable surfaces.","id":363,"group":"Tools & equipment","focus":true,"answerText":"To protect finished surfaces from direct hard-hammer impact"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"Why is a force reaction important when loosening a tight joint?","options":["The fastening receives no opposite force","The applied force may move, twist or destabilise adjacent equipment","Only the tool experiences load","Hydraulic pressure automatically disappears"],"answer":1,"why":"The manual emphasises reaction forces on equipment and its supports.","id":364,"group":"Tools & equipment","focus":true,"answerText":"The applied force may move, twist or destabilise adjacent equipment"},{"topic":"Assembly selection, tools & dismantling","page":"Assembly pp. 6–22","q":"What is one reason for marking mating parts before dismantling?","options":["To increase surface corrosion","To preserve their relative positions during reassembly","To remove the need for gasket checks","To make all parts scrap"],"answer":1,"why":"Matching marks help reconstruct correct alignments and orientations.","id":365,"group":"Dismantling & repair","focus":true,"answerText":"To preserve their relative positions during reassembly"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"Which five joining families are listed by the manual?","options":["Only bolts, rivets, screws, nuts and pins","Only welding, milling, turning, casting and forging","Bolting, painting, heating, machining and cleaning","Mechanical fasteners, soldering, brazing, welding and adhesive bonding"],"answer":3,"why":"Those are the five principal joining methods in the manual.","id":366,"group":"Fasteners & washers","focus":true,"answerText":"Mechanical fasteners, soldering, brazing, welding and adhesive bonding"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"What is a key feature of mechanical fasteners compared with welded connections?","options":["They always need melting metal","They cannot carry mechanical loads","Every mechanical fastening is adhesive","Many can be dismantled for repair or replacement"],"answer":3,"why":"Mechanical fasteners such as bolts and screws allow relatively easy disassembly.","id":367,"group":"Fasteners & washers","focus":true,"answerText":"Many can be dismantled for repair or replacement"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"What type of hole is normally required for a machine screw?","options":["An unthreaded hole of any diameter","A hot molten-metal cavity","A drilled hole in wood only","A previously tapped threaded hole"],"answer":3,"why":"Machine screws engage threads previously cut or formed in the component.","id":368,"group":"Fasteners & washers","focus":true,"answerText":"A previously tapped threaded hole"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"Which machine screw head generally sits flush in a correctly countersunk recess?","options":["Hexagon head","Raised round head","Countersunk head","Pan head"],"answer":2,"why":"Countersunk heads are shaped to seat in a conical recess.","id":369,"group":"Fasteners & washers","focus":true,"answerText":"Countersunk head"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"What does a socket-head cap screw typically use for tightening?","options":["An internal hexagon key","Only a riveting hammer","A flat file","A wide-bladed wood chisel"],"answer":0,"why":"Socket screws commonly use a hexagonal internal drive.","id":370,"group":"Fasteners & washers","focus":true,"answerText":"An internal hexagon key"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"What is a grub screw generally used for?","options":["Joining materials by melting solder","Permanently welding two frames","Securing a knob, collar or similar component onto a shaft","Measuring shaft diameter"],"answer":2,"why":"The manual gives securing a knob or collar on a shaft as a screw application.","id":371,"group":"Fasteners & washers","focus":true,"answerText":"Securing a knob, collar or similar component onto a shaft"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"Why might a dog-point grub screw be selected?","options":["It has no projecting point","It melts when tightened","It can locate in a suitable hole and avoid unwanted surface damage","It always needs a gasket"],"answer":2,"why":"The manual discusses dog-point designs for tightening without damage to the work.","id":372,"group":"Fasteners & washers","focus":true,"answerText":"It can locate in a suitable hole and avoid unwanted surface damage"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"How does a thread-forming self-tapping screw create its mating thread?","options":["By injecting molten filler metal","By requiring a separate welded nut","By displacing relatively soft work material","By drilling away every section of its body"],"answer":2,"why":"Thread-forming screws deform the softer material to create a mating thread.","id":373,"group":"Fasteners & washers","focus":true,"answerText":"By displacing relatively soft work material"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"How does a thread-cutting self-tapping screw create its mating thread?","options":["By folding an external clamp","By using adhesive only","By melting the hole by friction","By cutting material with grooves or flutes"],"answer":3,"why":"Thread-cutting screws have cutting features that remove material.","id":374,"group":"Fasteners & washers","focus":true,"answerText":"By cutting material with grooves or flutes"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"What is a combined self-drilling and self-tapping screw designed to do?","options":["Remove all need to control material thickness","Always require a separate milling operation","Create its own pilot hole and thread during insertion in suitable thin material","Join only pre-threaded thick castings"],"answer":2,"why":"The manual notes drill-point and twin-start thread combinations in thin sheet materials.","id":375,"group":"Fasteners & washers","focus":true,"answerText":"Create its own pilot hole and thread during insertion in suitable thin material"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"What is the main distinction between a bolt and a machine screw in the manual?","options":["A bolt can never be removed","A bolt is used with a nut and often has an unthreaded shank length","A machine screw always has a larger diameter","Bolts must be glued permanently"],"answer":1,"why":"The manual describes bolts used with nuts and often made with a longer unthreaded portion.","id":376,"group":"Fasteners & washers","focus":true,"answerText":"A bolt is used with a nut and often has an unthreaded shank length"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"When disassembly is frequent and hand tightening is sufficient, which nut is often appropriate?","options":["Plain rivet","Wing nut","Grub screw","Solid dowel"],"answer":1,"why":"The manual specifically mentions wing nuts for easy removal and assembly.","id":377,"group":"Fasteners & washers","focus":true,"answerText":"Wing nut"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"When decorative appearance and protection of exposed threads are wanted, which nut is useful?","options":["Dome or cap nut","Slotted rivet","Thread-cutting tap","Wing nut only"],"answer":0,"why":"Dome nuts provide a finished appearance and can cover exposed threads.","id":378,"group":"Fasteners & washers","focus":true,"answerText":"Dome or cap nut"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"What is the function of a plain flat washer?","options":["Replace a nut","Provide a guaranteed locking mechanism","Cut a new thread automatically","Spread tightening load and protect contact surfaces"],"answer":3,"why":"The manual says flat washers distribute load but do not provide locking action.","id":379,"group":"Fasteners & washers","focus":true,"answerText":"Spread tightening load and protect contact surfaces"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"What is the main function of a washer under a fastener head?","options":["Act as a welding electrode","Distribute contact load over a wider area","Make the bolt magnetic","Change the bolt's chemical composition"],"answer":1,"why":"Washers can reduce local surface damage by spreading load.","id":380,"group":"Fasteners & washers","focus":true,"answerText":"Distribute contact load over a wider area"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"What is a spring-tension pin made from in the manual?","options":["A solid copper cylinder only","Cast concrete","Spring-steel strip wrapped into a notched tube","A rubber hose"],"answer":2,"why":"The spring-steel pin compresses on insertion and grips the hole.","id":381,"group":"Fasteners & washers","focus":true,"answerText":"Spring-steel strip wrapped into a notched tube"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"How does a spring-tension pin remain seated in its hole?","options":["Adhesive applied by the factory in every case","Welding of its exterior surface","Elastic radial pressure against the hole walls","A separate large nut"],"answer":2,"why":"The compressed pin exerts outward spring pressure in the hole.","id":382,"group":"Fasteners & washers","focus":true,"answerText":"Elastic radial pressure against the hole walls"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"What is the included flank angle of an ISO metric thread profile?","options":["60 degrees","90 degrees","30 degrees","55 degrees"],"answer":0,"why":"ISO metric threads use a 60-degree triangular profile.","id":383,"group":"Fasteners & washers","focus":true,"answerText":"60 degrees"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"In M16 × 2.0, what does 2.0 indicate?","options":["Maximum torque of 2.0 N m","Head diameter of 2.0 cm","Thread pitch of 2.0 mm","Bolt length of 2.0 m"],"answer":2,"why":"The designation uses nominal diameter and pitch in millimetres.","id":384,"group":"Fasteners & washers","focus":true,"answerText":"Thread pitch of 2.0 mm"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"In the designation M16 without a stated pitch, what is commonly implied?","options":["A completely unthreaded rod","A left-hand 16 mm pitch","An unspecified tool size only","The standard coarse pitch for that diameter"],"answer":3,"why":"The manual explains that omitting pitch indicates a coarse thread.","id":385,"group":"Fasteners & washers","focus":true,"answerText":"The standard coarse pitch for that diameter"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"What is the basic thread angle for Unified threads?","options":["80 degrees","45 degrees","60 degrees","55 degrees"],"answer":2,"why":"Unified coarse and fine threads use a 60-degree profile.","id":386,"group":"Fasteners & washers","focus":true,"answerText":"60 degrees"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"Which British thread families use a 55-degree Whitworth profile?","options":["Only pipe compression fittings","Only metric fine threads","BSW and BSF","ISO metric and Unified"],"answer":2,"why":"BSW and BSF are based on the Whitworth 55-degree thread form.","id":387,"group":"Fasteners & washers","focus":true,"answerText":"BSW and BSF"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"What do UNC and UNF indicate?","options":["Universal Nut Clearance and Universal Nut Fit","Unsealed Nut Coupling and Unsealed Nut Flange","Upper Nominal Cut and Upper Nominal Form","Unified National Coarse and Unified National Fine"],"answer":3,"why":"Unified thread designations distinguish coarse from fine pitch
