<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>ATTP Mechanical AOC — 777 Question Master CBT</title><meta name="description" content="777-question ATTP Mechanical AOC master question bank with random 70-question timed mock examination and instant marking."><style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#131e30;--panel2:#1b2b41;--line:#324259;--muted:#a9bdd0;--text:#f0f5ff;--accent:#55dbba;--blue:#91b9ff;--red:#ff9ba1;--warn:#f7cb84;--r:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at top right,#18334b 0%,transparent 36%),var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);line-height:1.5}main{max-width:1030px;margin:auto;padding:20px 16px 60px}h1,h2,h3,p{margin:0}h1{font-size:clamp(1.8rem,4.6vw,3.15rem);line-height:1.15;letter-spacing:-.045em}h2{font-size:1.3rem;letter-spacing:-.025em}h3{font-size:1.03rem}p{color:var(--muted)}button,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}.btn{background:var(--accent);color:#09241d;border:1px solid transparent;border-radius:13px;padding:13px 17px;font-weight:750;transition:transform .08s,border-color .15s}.btn:hover:not(:disabled){transform:translateY(-1px)}.btn.secondary{background:var(--panel2);color:var(--text);border-color:var(--line)}.btn.ghost{background:transparent;border-color:var(--line);color:var(--text)}.btn.sm{padding:8px 12px;border-radius:10px;font-size:.9rem}.full{width:100%}.pill{display:inline-block;font-size:.76rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:7px 11px;background:#143a39;border:1px solid #24635c;border-radius:999px}.container{border:1px solid var(--line);background:linear-gradient(150deg,rgba(26,42,61,.9),rgba(15,25,41,.97));border-radius:var(--r);box-shadow:0 18px 50px #0003;padding:23px}.hero{padding:29px 0 25px}.hero p{max-width:700px;margin-top:12px;line-height:1.6}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.stat{border:1px solid var(--line);border-radius:14px;background:#1a2b41;padding:16px}.stat b{display:block;font-size:2rem;letter-spacing:-.04em}.stat span{color:var(--muted);font-size:.83rem}.btnrow{display:flex;gap:11px;flex-wrap:wrap;margin-top:20px}.btnrow .btn{flex:1;min-width:170px}.note{border-left:3px solid var(--warn);background:rgba(247,203,132,.07);color:#e6d9bb;padding:12px 14px;border-radius:0 10px 10px 0;font-size:.88rem;margin-top:20px}.topicgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.topicbtn{border:1px solid var(--line);background:rgba(30,47,69,.8);border-radius:13px;min-height:70px;text-align:left;color:var(--text);padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.topicbtn.active,.topicbtn:hover{border-color:var(--accent);background:#20433f}.topicbtn span{font-weight:650}.topicbtn small{border-radius:8px;background:#273c51;color:var(--muted);padding:4px 8px;white-space:nowrap}.sub{margin-top:5px;font-size:.9rem}.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.progress-shell{height:8px;background:#304056;border-radius:99px;overflow:hidden;margin:15px 0}.progress-fill{height:100%;background:linear-gradient(90deg,#4bd4b2,#96c7ff);transition:width .2s}.timer{font-variant-numeric:tabular-nums;border:1px solid var(--line);background:#172638;border-radius:11px;padding:8px 12px;font-weight:750;white-space:nowrap}.timer.urgent{color:var(--red);border-color:var(--red)}.meta{font-size:.86rem;color:var(--muted)}.question{font-size:clamp(1.3rem,2.8vw,1.7rem);line-height:1.42;letter-spacing:-.025em;margin:20px 0 21px}.choices{display:grid;gap:11px}.option{display:flex;align-items:flex-start;gap:14px;text-align:left;width:100%;padding:14px;border-radius:13px;background:#18283d;color:var(--text);border:1px solid var(--line)}.option:hover:not(:disabled){background:#223650;border-color:#6385a8}.option.selected{border-color:var(--blue);background:#23415d}.option.good{border-color:#49bf9b;background:#153c36}.option.bad{border-color:#e47e85;background:#492e3b}.letter{display:inline-grid;place-items:center;border-radius:10px;border:1px solid #52647d;min-width:31px;height:31px;font-weight:800;background:#29394e;flex-shrink:0}.option-label{padding-top:2px}.explain{padding:14px 15px;border-radius:12px;background:#162f38;border:1px solid #2d665b;margin-top:15px;color:#d8f8ec}.explain strong{display:block;color:var(--accent);margin-bottom:4px}.explain.wrong{background:#3a2734;border-color:#905665;color:#f6d7df}.explain.wrong strong{color:#ffb9c0}.testcontrols{display:flex;flex-wrap:wrap;gap:9px;justify-content:space-between;margin:24px 0 10px}.testcontrols .btn{flex:1;min-width:105px}.navigator{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:17px}.navbtn{border:1px solid #33485f;background:#19283c;color:#d9e8f6;border-radius:9px;min-height:38px;font-weight:650;font-size:.86rem}.navbtn.current{outline:2px solid var(--blue);outline-offset:1px}.navbtn.done{background:#20473d;border-color:#2a805f}.navbtn.flagged:after{content:'•';color:var(--warn);padding-left:1px}.legend{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:.8rem;margin-top:12px}.key{display:inline-block;border-radius:4px;background:#20473d;width:10px;height:10px;margin-right:5px}.key.todo{background:#19283c;border:1px solid #52637a}.key.flag{background:var(--warn)}.smallhint{font-size:.86rem;color:var(--muted);margin-top:9px}.summaryScore{text-align:center;font-size:4rem;font-weight:850;letter-spacing:-.075em;margin:9px 0 0}.summaryTag{text-align:center;color:var(--muted);margin-bottom:18px}.topicrow{display:grid;grid-template-columns:minmax(140px,1fr) auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0;font-size:.91rem}.topicrow:last-child{border-bottom:0}.mini{height:5px;background:#293d51;border-radius:99px;margin-top:7px}.mini div{height:5px;background:#4bd4b2;border-radius:99px}.reviewCard{border:1px solid var(--line);background:#172538;padding:15px;border-radius:13px;margin-top:10px}.reviewCard .q{font-size:1.03rem;font-weight:700;margin:4px 0 8px}.reviewCard p{font-size:.9rem;margin-top:5px}.answerBad{color:#ffb5bd;font-weight:650}.answerGood{color:#75e5bf;font-weight:700}.foot{margin-top:24px;color:#8ba6bd;font-size:.78rem}.hidden{display:none!important}select{background:#1d2e43;border:1px solid #51667e;color:var(--text);border-radius:10px;padding:11px;max-width:100%}a{color:#9fcbff}@media(max-width:640px){main{padding:14px 11px 38px}.container{padding:15px}.hero{padding:19px 0 13px}.statgrid{gap:7px}.stat{padding:10px}.stat b{font-size:1.65rem}.stat span{font-size:.7rem}.topicgrid{grid-template-columns:1fr}.navigator{grid-template-columns:repeat(7,1fr)}.btnrow .btn{min-width:100%}.testcontrols .btn{font-size:.86rem;padding:11px 6px}.option{padding:12px}.question{margin:15px 0}.meta{font-size:.76rem}.topicrow{grid-template-columns:1fr auto}}

.setting{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.setting label{font-size:.88rem;font-weight:700;color:#cbdff2}.setting select{width:100%;margin-top:6px}.setting>div{min-width:0}.sectionhead{display:flex;justify-content:space-between;gap:9px;align-items:center;margin-bottom:10px}.muted{color:var(--muted)}.questionnum{font-size:.86rem;color:var(--muted)}.footer-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.footer-actions button{flex:1;min-width:120px}.tip{font-size:.8rem;opacity:.8}.stat b{font-variant-numeric:tabular-nums}@media(max-width:640px){.setting{grid-template-columns:1fr}}
</style></head><body><main id="app" aria-live="polite"></main><script>"use strict";
const BANK=[{"topic":"Assembly methods","page":"A&D p.1","q":"When should assembly be carefully planned?","options":["During installation","At the design stage","During commissioning","During final inspection"],"answer":1,"why":"The manual says successful assembly depends on planning at the design stage.","id":1,"group":"Assembly methods","focus":true,"answerText":"At the design stage"},{"topic":"Assembly methods","page":"A&D p.1","q":"What must an assembly sequence preserve?","options":["Specified tightening torque","Parts availability","Fastener accessibility","Surface finish"],"answer":2,"why":"Previously fitted parts must not block subsequent components or fastenings.","id":2,"group":"Assembly methods","focus":true,"answerText":"Fastener accessibility"},{"topic":"Assembly methods","page":"A&D p.2","q":"Which assembly method matches precision plungers to barrels?","options":["Line assembly","Trial assembly","Batch assembly","Selective assembly"],"answer":3,"why":"Selective assembly matches component combinations to obtain fine tolerances.","id":3,"group":"Assembly methods","focus":true,"answerText":"Selective assembly"},{"topic":"Assembly methods","page":"A&D p.2","q":"Which assembly method suits high-volume production without hand-fitting?","options":["Non-selective assembly","Selective assembly","One-off assembly","Trial assembly"],"answer":0,"why":"Non-selective assembly relies on interchangeable components made to the required tolerances.","id":4,"group":"Assembly methods","focus":true,"answerText":"Non-selective assembly"},{"topic":"Assembly methods","page":"A&D p.4","q":"Replacing an obsolete motor using new on-site mountings is an example of:","options":["Batch assembly","Line assembly","On-site assembly without prefabrication","Workshop repair"],"answer":2,"why":"The fitter adapts mountings and shaft alignment on site when no prefabricated kit is available.","id":5,"group":"Assembly methods","focus":true,"answerText":"On-site assembly without prefabrication"},{"topic":"Assembly methods","page":"A&D p.4","q":"Workshop-made ductwork fitted at the installation site is:","options":["One-off assembly","Partial prefabrication","Line assembly","Selective assembly"],"answer":1,"why":"Ventilation sections can be made in a workshop then erected on site.","id":6,"group":"Assembly methods","focus":true,"answerText":"Partial prefabrication"},{"topic":"Assembly methods","page":"A&D p.4","q":"Why must large-structure assembly be carefully sequenced?","options":["To avoid team interference","To simplify alignment checks","To reduce crane capacity","To avoid site fabrication"],"answer":0,"why":"Many teams and lifting operations must progress without obstructing one another.","id":7,"group":"Assembly methods","focus":true,"answerText":"To avoid team interference"},{"topic":"Assembly methods","page":"A&D pp.3–4","q":"Why perform a trial assembly before delivery?","options":["To estimate labour hours","To confirm transport sequence","To select coating materials","To check fit and correct snags"],"answer":3,"why":"Trial assembly checks and tests components before dismantling them for transport.","id":8,"group":"Assembly methods","focus":true,"answerText":"To check fit and correct snags"},{"topic":"Assembly methods","page":"A&D p.4","q":"Which assembly may require the fitter to drill and tap final holes?","options":["Line assembly","Batch assembly","One-off assembly","Automatic assembly"],"answer":2,"why":"In one-off assembly, partly finished pieces may need final drilling, tapping or reaming.","id":9,"group":"Assembly methods","focus":true,"answerText":"One-off assembly"},{"topic":"Assembly methods","page":"A&D p.5","q":"A small number of identical lathe chucks is assembled by:","options":["Batch assembly","Line assembly","On-site dismantling","Selective assembly"],"answer":0,"why":"Batch assembly concerns a small or medium number of devices of the same type.","id":10,"group":"Assembly methods","focus":true,"answerText":"Batch assembly"},{"topic":"Assembly methods","page":"A&D p.5","q":"Which assembly uses a conveyor and many operators?","options":["One-off assembly","Trial assembly","Selective assembly","Line assembly"],"answer":3,"why":"Line assembly passes work along a conveyor, each station adding parts or subassemblies.","id":11,"group":"Assembly methods","focus":true,"answerText":"Line assembly"},{"topic":"Assembly methods","page":"A&D p.5","q":"After repairing an on-site hydraulic leak, what is done before pressure-testing?","options":["Check bearing alignment","Bleed trapped air","Inspect pipe threads","Replace inlet fittings"],"answer":1,"why":"The manual describes refilling, bleeding off air, then pressure testing.","id":12,"group":"Assembly methods","focus":true,"answerText":"Bleed trapped air"},{"topic":"Assembly methods","page":"A&D p.5","q":"A failed motor is sent away to the manufacturer for repair. This is:","options":["Trial assembly","On-site repair","Workshop repair","Batch assembly"],"answer":2,"why":"Workshop repair removes the defective equipment for service elsewhere.","id":13,"group":"Assembly methods","focus":true,"answerText":"Workshop repair"},{"topic":"Assembly methods","page":"A&D p.5","q":"Why fit a reconditioned motor while the old one is repaired?","options":["To maintain production","To alter motor rating","To simplify lubrication","To avoid alignment checks"],"answer":0,"why":"A replacement unit prevents the machine remaining idle during workshop repair.","id":14,"group":"Assembly methods","focus":true,"answerText":"To maintain production"},{"topic":"Tools and dismantling","page":"A&D p.13","q":"Which tool tightens bolts to a specified torque?","options":["Ratchet wrench","Torque wrench","Ring spanner","Adjustable spanner"],"answer":1,"why":"Torque wrenches are used when the specified tightening torque must be achieved.","id":15,"group":"Tools & equipment","focus":true,"answerText":"Torque wrench"},{"topic":"Tools and dismantling","page":"A&D p.13","q":"Which torque wrench signals a preset value by a click?","options":["Beam type","Dial type","Click type","Digital display type"],"answer":2,"why":"A click-type wrench signals that the preset torque has been reached.","id":16,"group":"Tools & equipment","focus":true,"answerText":"Click type"},{"topic":"Tools and dismantling","page":"A&D pp.12–13","q":"Why should a pipe not extend a spanner handle?","options":["It lowers torque accuracy","It changes thread pitch","It changes bolt grade","It may overload the fastener or tool"],"answer":3,"why":"Extra leverage can overstress the fastener and damage the spanner jaws.","id":17,"group":"Tools & equipment","focus":true,"answerText":"It may overload the fastener or tool"},{"topic":"Tools and dismantling","page":"A&D p.13","q":"For better control, how should a spanner usually be pulled?","options":["Toward the body","Away from the body","With short jerks","At an angle to the nut"],"answer":0,"why":"The manual advises pulling toward the body where possible to reduce loss-of-control risk.","id":18,"group":"Tools & equipment","focus":true,"answerText":"Toward the body"},{"topic":"Tools and dismantling","page":"A&D p.14","q":"A screwdriver should be selected to match the screw’s:","options":["Thread pitch","Metal grade","Head recess","Overall length"],"answer":2,"why":"A properly fitting tip reduces damage to the screw head and tool.","id":19,"group":"Tools & equipment","focus":true,"answerText":"Head recess"},{"topic":"Tools and dismantling","page":"A&D p.14","q":"Pliers are generally unsuitable for tightening:","options":["Split pins","Hexagon nuts","Electrical wire","Small sheet metal"],"answer":1,"why":"Pliers can damage the corners of hexagon nuts and bolts.","id":20,"group":"Tools & equipment","focus":true,"answerText":"Hexagon nuts"},{"topic":"Tools and dismantling","page":"A&D p.11","q":"Which tool supports a rivet head while the other end is formed?","options":["Rivet set","Drawing-up tool","Nut splitter","Dolly"],"answer":3,"why":"The dolly or hold-up supports the existing rivet head.","id":21,"group":"Tools & equipment","focus":true,"answerText":"Dolly"},{"topic":"Tools and dismantling","page":"A&D p.11","q":"Which tool brings riveted plates into close contact?","options":["Drawing-up tool","Rivet set","Dolly","Rivet snap"],"answer":0,"why":"The drawing-up tool pulls the parts tightly together before the rivet head is finished.","id":22,"group":"Tools & equipment","focus":true,"answerText":"Drawing-up tool"},{"topic":"Tools and dismantling","page":"A&D p.11","q":"Which tool finishes forming a rivet head?","options":["Dolly","Rivet set","Drawing-up tool","Ball-pein hammer"],"answer":1,"why":"The rivet set finishes the rivet to its proper shape.","id":23,"group":"Tools & equipment","focus":true,"answerText":"Rivet set"},{"topic":"Tools and dismantling","page":"A&D p.17","q":"Which tool removes a seized nut by splitting it?","options":["Easy-out","Impact spanner","Nut splitter","Stud extractor"],"answer":2,"why":"A nut splitter fractures the nut to free it from a stud or bolt.","id":24,"group":"Dismantling & repair","focus":true,"answerText":"Nut splitter"},{"topic":"Tools and dismantling","page":"A&D p.18","q":"Which tool uses a left-handed thread to remove broken studs?","options":["Stud remover","Impact spanner","Nut splitter","Easy-out"],"answer":3,"why":"The easy-out bites into a drilled pilot hole in the broken stud or screw.","id":25,"group":"Dismantling & repair","focus":true,"answerText":"Easy-out"},{"topic":"Tools and dismantling","page":"A&D pp.17–18","q":"Which tool uses gripping rollers to remove a stud?","options":["Stud remover","Torque multiplier","Rivet set","Feeler gauge"],"answer":0,"why":"A stud remover grips the exposed stud, often by a roller mechanism.","id":26,"group":"Dismantling & repair","focus":true,"answerText":"Stud remover"},{"topic":"Tools and dismantling","page":"A&D pp.9,17","q":"What is used to ease a rusted threaded joint before removal?","options":["Flux paste","Penetrating oil","Soft solder","Marking blue"],"answer":1,"why":"Penetrating oil seeps into threads and helps loosen corrosion or deposits.","id":27,"group":"Tools & equipment","focus":true,"answerText":"Penetrating oil"},{"topic":"Fasteners and washers","page":"A&D p.23","q":"A screw driven into a previously tapped hole is a:","options":["Machine screw","Socket screw","Self-tapping screw","Cap screw"],"answer":0,"why":"Machine screws are designed to fasten into previously tapped holes.","id":28,"group":"Fasteners & washers","focus":true,"answerText":"Machine screw"},{"topic":"Fasteners and washers","page":"A&D p.23","q":"Which screw head is intended to sit flush with the surface?","options":["Pan head","Cheese head","Raised round head","Countersunk head"],"answer":3,"why":"A countersunk head fits into a matching countersink.","id":29,"group":"Fasteners & washers","focus":true,"answerText":"Countersunk head"},{"topic":"Fasteners and washers","page":"A&D p.24","q":"Which screw is commonly tightened with a hexagon key?","options":["Slotted machine screw","Socket-head screw","Raised countersunk screw","Phillips screw"],"answer":1,"why":"Socket screws contain a hexagon recess for an Allen key.","id":30,"group":"Fasteners & washers","focus":true,"answerText":"Socket-head screw"},{"topic":"Fasteners and washers","page":"A&D p.24","q":"Which socket screw can lock a collar onto a shaft?","options":["Cap screw","Countersunk screw","Grub screw","Socket-button screw"],"answer":2,"why":"Grub screws can secure knobs and collars on shafts.","id":31,"group":"Fasteners & washers","focus":true,"answerText":"Grub screw"},{"topic":"Fasteners and washers","page":"A&D p.24","q":"A thread-forming self-tapping screw makes its thread by:","options":["Displacing the material","Shaving the material","Heating the material","Pre-tapping the hole"],"answer":0,"why":"The thread-forming type displaces softer work material to produce the mating thread.","id":32,"group":"Fasteners & washers","focus":true,"answerText":"Displacing the material"},{"topic":"Fasteners and washers","page":"A&D p.24","q":"What feature helps a thread-cutting self-tapping screw cut metal?","options":["Nylon ring","Castellations","Spring washer","Cutting flutes"],"answer":3,"why":"The manual describes grooves or flutes that provide cutting action.","id":33,"group":"Fasteners & washers","focus":true,"answerText":"Cutting flutes"},{"topic":"Fasteners and washers","page":"A&D p.25","q":"What usually distinguishes a bolt from a machine screw?","options":["A bolt forms its own thread","A bolt is used with a nut","A bolt is always socket-headed","A bolt has a tapered thread"],"answer":1,"why":"The manual describes bolts as intended for fastening with a nut.","id":34,"group":"Fasteners & washers","focus":true,"answerText":"A bolt is used with a nut"},{"topic":"Fasteners and washers","page":"A&D p.25","q":"What is the main function of a plain washer?","options":["Maintain pipe alignment","Seal mating joint faces","Spread tightening load","Set bolt thread pitch"],"answer":2,"why":"Plain washers distribute load and protect surfaces without providing locking action.","id":35,"group":"Fasteners & washers","focus":true,"answerText":"Spread tightening load"},{"topic":"Fasteners and washers","page":"A&D p.26","q":"In M16 × 2, what does the number 2 indicate?","options":["Thread pitch in millimetres","Nominal diameter in millimetres","Thread engagement length","Thread depth in millimetres"],"answer":0,"why":"M16 × 2 identifies a 16 mm nominal diameter and 2 mm thread pitch.","id":36,"group":"Fasteners & washers","focus":true,"answerText":"Thread pitch in millimetres"},{"topic":"Locking devices","page":"A&D p.28","q":"Which nut is secured by a split pin through a drilled bolt?","options":["Nyloc nut","Wing nut","Castellated nut","Cap nut"],"answer":2,"why":"Castellated or slotted nuts can be locked with a split pin through the bolt.","id":37,"group":"Locking devices","focus":true,"answerText":"Castellated nut"},{"topic":"Locking devices","page":"A&D p.28","q":"A Nyloc nut resists loosening using a:","options":["Lead insert","Nylon insert","Copper washer","Rivet head"],"answer":1,"why":"The nylon collar grips the bolt thread and provides prevailing torque.","id":38,"group":"Locking devices","focus":true,"answerText":"Nylon insert"},{"topic":"Locking devices","page":"A&D p.28","q":"Which nut has deformed arms that spring back against the screw?","options":["Aerotight nut","Wing nut","Flanged nut","Plain nut"],"answer":0,"why":"Aerotight nuts have deformed arms that resist working loose.","id":39,"group":"Locking devices","focus":true,"answerText":"Aerotight nut"},{"topic":"Locking devices","page":"A&D p.28","q":"What locks a tab washer after tightening?","options":["Heating the washer","Using thread adhesive","Compressing a nylon insert","Bending a tab against the nut"],"answer":3,"why":"A tab is bent against the fastener to resist rotation.","id":40,"group":"Locking devices","focus":true,"answerText":"Bending a tab against the nut"},{"topic":"Locking devices","page":"A&D p.28","q":"Which washer is flattened during tightening to resist loosening?","options":["Plain washer","Fibre washer","Helical spring washer","Large-area washer"],"answer":2,"why":"A split/helical spring washer exerts a spring effect when compressed.","id":41,"group":"Locking devices","focus":true,"answerText":"Helical spring washer"},{"topic":"Riveting, soldering and brazing","page":"A&D pp.23,29","q":"Why is riveting regarded as a permanent joint?","options":["The joint is always pressure-tight","Removal usually destroys the rivet","Rivets require brazing","The head cannot be formed again"],"answer":1,"why":"Rivets are removed by damaging or destroying the rivet itself.","id":42,"group":"Brazing","focus":true,"answerText":"Removal usually destroys the rivet"},{"topic":"Riveting, soldering and brazing","page":"A&D p.30","q":"A blind rivet is useful when access is available from:","options":["One side only","Both sides with a dolly","The internal cavity","Two parallel faces only"],"answer":0,"why":"Blind or pop rivets are fitted where only one side of an assembly can be reached.","id":43,"group":"Brazing","focus":true,"answerText":"One side only"},{"topic":"Riveting, soldering and brazing","page":"A&D p.30","q":"Which soldering process melts the filler, not the base metal?","options":["Arc welding","Gas welding","Resistance welding","Soft soldering"],"answer":3,"why":"In soft soldering, the solder melts while the parent metals remain solid.","id":44,"group":"Brazing","focus":true,"answerText":"Soft soldering"},{"topic":"Riveting, soldering and brazing","page":"A&D p.31","q":"A flux is mainly used in soldering to:","options":["Increase joint clearance","Raise the solder solidus","Remove or prevent surface oxides","Prevent dissimilar-metal contact"],"answer":2,"why":"Flux helps remove oxides and prevent oxide formation during joining.","id":45,"group":"Brazing","focus":true,"answerText":"Remove or prevent surface oxides"},{"topic":"Riveting, soldering and brazing","page":"A&D p.31","q":"Which flux type generally requires residue removal because it is corrosive?","options":["Passive resin flux","Active acid flux","Inert gas","Dry nitrogen"],"answer":1,"why":"Active acid flux is corrosive, so residue must be cleaned away.","id":46,"group":"Brazing","focus":true,"answerText":"Active acid flux"},{"topic":"Riveting, soldering and brazing","page":"A&D p.31","q":"What is a heat sink used for during soldering?","options":["Protecting heat-sensitive components","Increasing joint clearance","Spreading solder evenly","Increasing tip temperature"],"answer":0,"why":"A heat sink absorbs heat and limits damage to nearby sensitive parts.","id":47,"group":"Brazing","focus":true,"answerText":"Protecting heat-sensitive components"},{"topic":"Riveting, soldering and brazing","page":"A&D pp.32–34","q":"Which joining method uses filler above about 450°C without melting the base metal?","options":["Soft soldering","Spot welding","Adhesive bonding","Brazing"],"answer":3,"why":"Brazing uses a higher-melting filler than soft soldering, but the parent metal does not melt.","id":48,"group":"Brazing","focus":true,"answerText":"Brazing"},{"topic":"Riveting, soldering and brazing","page":"A&D p.32","q":"What draws molten brazing alloy into a close-fitting joint?","options":["Flux pressure","Gravity feed","Capillary action","Surface compression"],"answer":2,"why":"Brazing depends on capillary action drawing filler into suitable clearances.","id":49,"group":"Brazing","focus":true,"answerText":"Capillary action"},{"topic":"Welding","page":"A&D p.35","q":"Which process uses a flux-coated consumable electrode?","options":["MMA welding","MAG welding","TIG welding","Oxy-acetylene welding"],"answer":0,"why":"Manual metal arc welding uses a consumable flux-coated electrode.","id":50,"group":"Welding","focus":true,"answerText":"MMA welding"},{"topic":"Welding","page":"A&D p.35","q":"Which welding process uses a non-consumable tungsten electrode?","options":["MMA","MAG","Oxy-fuel","TIG"],"answer":3,"why":"Tungsten inert-gas welding uses a non-consumable tungsten electrode.","id":51,"group":"Welding","focus":true,"answerText":"TIG"},{"topic":"Welding","page":"A&D p.35","q":"Which gases commonly shield TIG welding?","options":["Oxygen or nitrogen","Argon or helium","Carbon dioxide or oxygen","Acetylene or hydrogen"],"answer":1,"why":"TIG uses inert shielding gases such as argon or helium.","id":52,"group":"Welding","focus":true,"answerText":"Argon or helium"},{"topic":"Welding","page":"A&D p.36","q":"Which process feeds a continuous consumable wire electrode?","options":["TIG welding","MMA welding","MAG welding","Gas welding"],"answer":2,"why":"MAG welding feeds a continuous consumable wire electrode through a gun.","id":53,"group":"Welding","focus":true,"answerText":"MAG welding"},{"topic":"Welding","page":"A&D p.36","q":"Using carbon dioxide shielding for steel welding is commonly called:","options":["CO₂/MAG welding","TIG welding","MMA welding","Oxy-fuel welding"],"answer":0,"why":"The manual describes carbon-dioxide-shielded MAG welding of plain-carbon and low-alloy steels.","id":54,"group":"Welding","focus":true,"answerText":"CO₂/MAG welding"},{"topic":"Welding","page":"A&D p.36","q":"What gas combination produces a typical oxy-acetylene welding flame?","options":["Argon and nitrogen","Oxygen and hydrogen","Air and carbon dioxide","Oxygen and acetylene"],"answer":3,"why":"Oxy-acetylene welding burns acetylene with oxygen to provide a high-temperature flame.","id":55,"group":"Welding","focus":true,"answerText":"Oxygen and acetylene"},{"topic":"Adhesives","page":"A&D p.38","q":"Adhesives are broadly classified as:","options":["Metallic and ceramic","Natural and synthetic","Ferrous and non-ferrous","Dry and wet"],"answer":1,"why":"The classification on page 38 has the two main groups: natural and synthetic.","id":56,"group":"Adhesives & bonding","focus":true,"answerText":"Natural and synthetic"},{"topic":"Adhesives","page":"A&D p.38","q":"Which is a natural adhesive origin?","options":["Animal","Epoxy","Cyanoacrylate","Polyamide"],"answer":0,"why":"Natural adhesives are classified by animal, vegetable or mineral origin.","id":57,"group":"Adhesives & bonding","focus":true,"answerText":"Animal"},{"topic":"Adhesives","page":"A&D p.38","q":"Which synthetic adhesive is a thermoplastic rubber?","options":["Epoxy","Phenol resin","Neoprene","Polyaromatic resin"],"answer":2,"why":"Polychloroprene, or neoprene, is shown under thermoplastic rubbers.","id":58,"group":"Adhesives & bonding","focus":true,"answerText":"Neoprene"},{"topic":"Adhesives","page":"A&D p.38","q":"Cyanoacrylate is commonly called:","options":["Contact cement","Epoxy filler","Silicone sealant","Superglue"],"answer":3,"why":"The manual labels cyanoacrylate as superglue.","id":59,"group":"Adhesives & bonding","focus":true,"answerText":"Superglue"},{"topic":"Adhesives","page":"A&D p.38","q":"What mainly initiates cyanoacrylate setting on a surface?","options":["Heat from an arc","Surface moisture","A powdered catalyst","An external electric field"],"answer":1,"why":"Cyanoacrylate reacts with small amounts of moisture on surfaces at room temperature.","id":60,"group":"Adhesives & bonding","focus":true,"answerText":"Surface moisture"},{"topic":"Adhesives","page":"A&D p.39","q":"Which adhesive generally uses resin and a hardener?","options":["Epoxy","Neoprene","Animal glue","Cellulose adhesive"],"answer":0,"why":"The manual describes epoxy as a two-component resin and curing agent system.","id":61,"group":"Adhesives & bonding","focus":true,"answerText":"Epoxy"},{"topic":"Adhesives","page":"A&D pp.38–39","q":"Which adhesive family cures into a cross-linked network?","options":["Thermoplastic rubber","Natural vegetable adhesive","Thermosetting resin","Hot-melt adhesive"],"answer":2,"why":"Thermosetting adhesives form a chemically cross-linked bond during curing.","id":62,"group":"Adhesives & bonding","focus":true,"answerText":"Thermosetting resin"},{"topic":"Fire and gas safety","page":"Safety p.15","q":"In the manual, what colour identifies a water extinguisher?","options":["Pale cream","Black","French blue","Signal red"],"answer":3,"why":"The training manual uses the historical signal-red code for water extinguishers.","id":63,"group":"Fire & extinguishers","focus":true,"answerText":"Signal red"},{"topic":"Fire and gas safety","page":"Safety p.15","q":"In the manual, what colour identifies a foam extinguisher?","options":["Pale cream","French blue","Signal red","Black"],"answer":0,"why":"The manual identifies foam by pale cream.","id":64,"group":"Fire & extinguishers","focus":true,"answerText":"Pale cream"},{"topic":"Fire and gas safety","page":"Safety p.15","q":"In the manual, what colour identifies a powder extinguisher?","options":["Black","Signal red","French blue","Maroon"],"answer":2,"why":"The training manual lists French blue for powder extinguishers.","id":65,"group":"Fire & extinguishers","focus":true,"answerText":"French blue"},{"topic":"Fire and gas safety","page":"Safety p.15","q":"In the manual, what colour identifies a CO₂ extinguisher?","options":["French grey","Black","Pale cream","Peacock blue"],"answer":1,"why":"The manual lists black for carbon dioxide extinguishers.","id":66,"group":"Fire & extinguishers","focus":true,"answerText":"Black"},{"topic":"Fire and gas safety","page":"Safety p.15","q":"In the manual, what is the cylinder colour for acetylene?","options":["Signal red","French grey","Black","Maroon"],"answer":3,"why":"The gas-cylinder table identifies acetylene cylinders as maroon.","id":67,"group":"Gas cylinders & codes","focus":true,"answerText":"Maroon"},{"topic":"Fire and gas safety","page":"Safety p.15","q":"In the manual, what gas has a peacock-blue cylinder?","options":["Argon","Oxygen","Carbon dioxide","Hydrogen"],"answer":0,"why":"Argon is shown as peacock blue in the manual.","id":68,"group":"Fire & extinguishers","focus":true,"answerText":"Argon"},{"topic":"Fire and gas safety","page":"Safety p.15","q":"In the manual, nitrogen is identified by:","options":["Black","Maroon","French grey with black band","Signal red with white band"],"answer":2,"why":"Nitrogen is labelled French grey with a black band.","id":69,"group":"Fire & extinguishers","focus":true,"answerText":"French grey with black band"},{"topic":"Fire and gas safety","page":"Safety p.18","q":"In the manual, which class includes flammable liquids?","options":["Class A","Class B","Class C","Class D"],"answer":1,"why":"The manual describes Class B fires as fires involving flammable liquids.","id":70,"group":"Fire & extinguishers","focus":true,"answerText":"Class B"},{"topic":"Assembly & fitting tools","page":"Assembly p. 11","q":"What supports a rivet head during closing?","options":["Dolly","Rivet set","Drawing-up tool","Rivet cutter"],"answer":0,"why":"The dolly or hold-up supports the original head while the opposite end is formed.","id":71,"group":"Tools & equipment","focus":true,"answerText":"Dolly"},{"topic":"Assembly & fitting tools","page":"Assembly p. 11","q":"Which tool seats plates before riveting?","options":["Ball-pein hammer","Centre punch","Rivet set","Drawing-up tool"],"answer":3,"why":"The drawing-up tool brings the plates tightly together before closing the rivet.","id":72,"group":"Tools & equipment","focus":true,"answerText":"Drawing-up tool"},{"topic":"Assembly & fitting tools","page":"Assembly p. 11","q":"Which tool forms the final rivet head?","options":["Dolly","Drawing-up tool","Nut splitter","Rivet set"],"answer":3,"why":"The rivet set finishes the closing operation to form the specified head.","id":73,"group":"Tools & equipment","focus":true,"answerText":"Rivet set"},{"topic":"Assembly & fitting tools","page":"Assembly p. 11","q":"Which hammer starts closing a rivet?","options":["Club hammer","Sledgehammer","Soft-faced mallet","Ball-pein hammer"],"answer":3,"why":"The manual uses a ball-pein hammer to begin forming the rivet head.","id":74,"group":"Tools & equipment","focus":true,"answerText":"Ball-pein hammer"},{"topic":"Assembly & fitting tools","page":"Assembly p. 11","q":"What heats rivets for hot riveting?","options":["Solid-fuel or gas hearth","Portable grinder","Electric drill","Heat sink"],"answer":0,"why":"A solid-fuel or gas-fired hearth heats rivets before hot installation.","id":75,"group":"Tools & equipment","focus":true,"answerText":"Solid-fuel or gas hearth"},{"topic":"Assembly & fitting tools","page":"Assembly p. 11","q":"What holds a red-hot rivet?","options":["Tongs","Drift","Pliers","Dolly"],"answer":0,"why":"Tongs allow safe handling of heated rivets.","id":76,"group":"Tools & equipment","focus":true,"answerText":"Tongs"},{"topic":"Assembly & fitting tools","page":"Assembly pp. 11–12","q":"What reduces fatigue in repeated riveting?","options":["Rivet punch","Pipe wrench","Pneumatic riveting gun","Hand file"],"answer":2,"why":"Compressed-air riveting equipment reduces effort and improves uniformity.","id":77,"group":"Tools & equipment","focus":true,"answerText":"Pneumatic riveting gun"},{"topic":"Assembly & fitting tools","page":"Assembly p. 12","q":"What drives a pneumatic riveting gun?","options":["Hydraulic oil","Electric arc","Compressed air","Natural gas"],"answer":2,"why":"Pneumatic equipment is powered by compressed air.","id":78,"group":"Tools & equipment","focus":true,"answerText":"Compressed air"},{"topic":"Assembly & fitting tools","page":"Assembly p. 11","q":"Which four rivet details matter?","options":["Colour, paint, weight, finish","Material, treatment, diameter, length","Brand, coating, noise, speed","Pressure, flow, voltage, current"],"answer":1,"why":"The manual specifies material, heat treatment, diameter and length.","id":79,"group":"Tools & equipment","focus":true,"answerText":"Material, treatment, diameter, length"},{"topic":"Assembly & fitting tools","page":"Assembly p. 11","q":"Why prefer standard assembly tools?","options":["Elimination of fitting","Maximum handle length","Greater tool weight","Availability and suitability"],"answer":3,"why":"The manual recommends standard tools whenever possible.","id":80,"group":"Tools & equipment","focus":true,"answerText":"Availability and suitability"},{"topic":"Assembly & fitting tools","page":"Assembly p. 11","q":"When are special-purpose tools needed?","options":["Freshly painted parts","Restricted access","Low room temperature","New fasteners only"],"answer":1,"why":"The manual mentions lack of space as a reason for special tools.","id":81,"group":"Tools & equipment","focus":true,"answerText":"Restricted access"},{"topic":"Assembly & fitting tools","page":"Assembly p. 12","q":"Why select the correct spanner size?","options":["To increase bolt diameter","To alter thread pitch","To avoid using washers","To fit the fastening closely"],"answer":3,"why":"Correct fit helps prevent rounding and damage.","id":82,"group":"Tools & equipment","focus":true,"answerText":"To fit the fastening closely"},{"topic":"Assembly & fitting tools","page":"Assembly p. 12","q":"Why avoid extending a spanner with a pipe?","options":["It changes the thread direction","It converts tension to shear","It hardens the nut","It may weaken or damage the tool"],"answer":3,"why":"The manual warns that pipe extensions overload the spanner and damage its jaws.","id":83,"group":"Tools & equipment","focus":true,"answerText":"It may weaken or damage the tool"},{"topic":"Assembly & fitting tools","page":"Assembly p. 12","q":"What may happen to overloaded spanner jaws?","options":["They become magnetic","They spread and slip","They shrink uniformly","They regain accuracy"],"answer":1,"why":"Excess force can distort jaws, giving a poor fit and possible injury.","id":84,"group":"Tools & equipment","focus":true,"answerText":"They spread and slip"},{"topic":"Assembly & fitting tools","page":"Assembly p. 13","q":"Which tool controls specified bolt torque?","options":["Nut splitter","Circlip pliers","Pipe wrench","Torque wrench"],"answer":3,"why":"Use a torque wrench when a defined tightening torque is specified.","id":85,"group":"Tools & equipment","focus":true,"answerText":"Torque wrench"},{"topic":"Assembly & fitting tools","page":"Assembly p. 13","q":"Which torque wrench shows pointer deflection?","options":["Click type","Beam type","Digital type","Slip-clutch type"],"answer":1,"why":"A beam torque wrench indicates torque by deflection.","id":86,"group":"Tools & equipment","focus":true,"answerText":"Beam type"},{"topic":"Assembly & fitting tools","page":"Assembly p. 13","q":"Which torque wrench gives a preset click?","options":["Click type","Pipe wrench","Beam type","Plain ring spanner"],"answer":0,"why":"The click mechanism indicates reaching the preset torque.","id":87,"group":"Tools & equipment","focus":true,"answerText":"Click type"},{"topic":"Assembly & fitting tools","page":"Assembly p. 13","q":"Which torque wrench displays an electronic value?","options":["Digital type","Slotted socket","Beam type","Box spanner"],"answer":0,"why":"Digital torque wrenches provide an electronic torque indication.","id":88,"group":"Tools & equipment","focus":true,"answerText":"Digital type"},{"topic":"Assembly & fitting tools","page":"Assembly p. 13","q":"What happens at a slipping-clutch wrench setting?","options":["The head locks permanently","The bolt expands freely","The socket detaches automatically","The drive slips"],"answer":3,"why":"The clutch limits further transmitted torque at its preset point.","id":89,"group":"Tools & equipment","focus":true,"answerText":"The drive slips"},{"topic":"Assembly & fitting tools","page":"Assembly p. 13","q":"What does spanner leverage depend on?","options":["Only bolt diameter","Applied force and lever arm","Paint and finish","Thread colour and shape"],"answer":1,"why":"Turning moment is force multiplied by perpendicular lever distance.","id":90,"group":"Tools & equipment","focus":true,"answerText":"Applied force and lever arm"},{"topic":"Assembly & fitting tools","page":"Assembly p. 13","q":"How should a spanner usually be pulled?","options":["By hammering its handle","Away at full extension","Toward the body","With a cheater pipe"],"answer":2,"why":"The manual advises pulling toward yourself when practicable for control.","id":91,"group":"Tools & equipment","focus":true,"answerText":"Toward the body"},{"topic":"Assembly & fitting tools","page":"Assembly p. 13","q":"What must fit snugly on a nut?","options":["Hammer face","Nut splitter cutter","Wire stripper","Spanner jaws"],"answer":3,"why":"Loose jaws can slip off and damage the nut corners.","id":92,"group":"Tools & equipment","focus":true,"answerText":"Spanner jaws"},{"topic":"Assembly & fitting tools","page":"Assembly p. 14","q":"What is an adjustable spanner mainly for?","options":["Cutting internal threads","Forming rivet heads","Variable nut sizes","Extracting broken studs"],"answer":2,"why":"An adjustable jaw can accommodate different nut sizes but may slip if poorly fitted.","id":93,"group":"Tools & equipment","focus":true,"answerText":"Variable nut sizes"},{"topic":"Assembly & fitting tools","page":"Assembly p. 14","q":"What does a pipe wrench grip?","options":["Round pipework","Flat screw slots","Small circlips","Internal keyways"],"answer":0,"why":"Pipe wrenches grip cylindrical pipe and fittings.","id":94,"group":"Tools & equipment","focus":true,"answerText":"Round pipework"},{"topic":"Assembly & fitting tools","page":"Assembly p. 14","q":"When does the manual favour adjustable or pipe wrenches?","options":["For tightening all torque-critical bolts","For every precision bolted joint","When proper fixed spanners are unavailable","For replacing torque wrenches"],"answer":2,"why":"The manual treats them as last-resort tools in many fitting tasks.","id":95,"group":"Tools & equipment","focus":true,"answerText":"When proper fixed spanners are unavailable"},{"topic":"Assembly & fitting tools","page":"Assembly p. 14","q":"What may worn adjustable jaws damage?","options":["Drilled hole centres","Pipe flow rate","Hexagon corners","Machine speed"],"answer":2,"why":"Poor jaw fit rounds off nuts and bolt heads.","id":96,"group":"Tools & equipment","focus":true,"answerText":"Hexagon corners"},{"topic":"Assembly & fitting tools","page":"Assembly p. 14","q":"How should screwdriver tips be selected?","options":["Choose by handle colour","Use the widest available","Match the screw recess","Use the thinnest available"],"answer":2,"why":"Correct tip fit prevents damage to the screw head.","id":97,"group":"Tools & equipment","focus":true,"answerText":"Match the screw recess"},{"topic":"Assembly & fitting tools","page":"Assembly p. 14","q":"What is a cross-head screwdriver for?","options":["Hexagonal bolts","Cross-head screws","External circlips","Blind rivets"],"answer":1,"why":"Use the proper screwdriver tip for the screw recess.","id":98,"group":"Tools & equipment","focus":true,"answerText":"Cross-head screws"},{"topic":"Assembly & fitting tools","page":"Assembly p. 14","q":"What risk comes from a mismatched screwdriver?","options":["Damaged screw head","Increased torque accuracy","Stronger rivet joint","Improved thread pitch"],"answer":0,"why":"A poorly fitting tip can slip or damage the recess.","id":99,"group":"Tools & equipment","focus":true,"answerText":"Damaged screw head"},{"topic":"Assembly & fitting tools","page":"Assembly p. 14","q":"When should pliers tighten hex nuts?","options":["For all high-torque joints","Whenever a socket is available","Before trying a ring spanner","Only when suitable spanners cannot be used"],"answer":3,"why":"The manual warns plier jaws can damage hexagonal corners.","id":100,"group":"Tools & equipment","focus":true,"answerText":"Only when suitable spanners cannot be used"},{"topic":"Assembly & fitting tools","page":"Assembly p. 15","q":"What do side-cutting pliers do?","options":["Cut wire","Form rivets","Remove bearings","Measure torque"],"answer":0,"why":"Side cutters are designed for cutting wires and small leads.","id":101,"group":"Tools & equipment","focus":true,"answerText":"Cut wire"},{"topic":"Assembly & fitting tools","page":"Assembly p. 15","q":"What do wire strippers remove?","options":["Wire insulation","Rivet heads","Bolt threads","Pipe scale"],"answer":0,"why":"Strippers remove insulation without intentionally cutting the conductor.","id":102,"group":"Tools & equipment","focus":true,"answerText":"Wire insulation"},{"topic":"Assembly & fitting tools","page":"Assembly p. 15","q":"Which tool handles circlips?","options":["Combination spanner","Pipe wrench","Ball-pein hammer","Circlip pliers"],"answer":3,"why":"Circlip pliers expand or compress retaining rings, according to type.","id":103,"group":"Tools & equipment","focus":true,"answerText":"Circlip pliers"},{"topic":"Assembly & fitting tools","page":"Assembly p. 15","q":"Which pliers are useful for gripping small parts?","options":["Flat-nose pliers","Rivet gun","Torque wrench","Bolt cutters"],"answer":0,"why":"Flat-nose jaws grip and position small components.","id":104,"group":"Tools & equipment","focus":true,"answerText":"Flat-nose pliers"},{"topic":"Assembly & fitting tools","page":"Assembly p. 15","q":"What does a combination plier combine?","options":["Heating and soldering","Drilling and tapping","Torque and angle measurement","Gripping and cutting functions"],"answer":3,"why":"Combination pliers serve general holding and cutting work.","id":105,"group":"Tools & equipment","focus":true,"answerText":"Gripping and cutting functions"},{"topic":"Assembly & fitting tools","page":"Assembly p. 15","q":"What should a hammer handle be free from?","options":["Splits","Polish","Grain","Labels"],"answer":0,"why":"The manual requires the hammer handle not to be split.","id":106,"group":"Tools & equipment","focus":true,"answerText":"Splits"},{"topic":"Assembly & fitting tools","page":"Assembly p. 15","q":"What must be secure on a hammer?","options":["Manufacturer label","Head","Weight marking","Paint"],"answer":1,"why":"The head must be firmly fixed to avoid becoming detached.","id":107,"group":"Tools & equipment","focus":true,"answerText":"Head"},{"topic":"Assembly & fitting tools","page":"Assembly p. 15","q":"Which hammer-head defects are unacceptable?","options":["Normal steel colour","Cracks or chips","A clear maker's mark","Smooth striking faces"],"answer":1,"why":"The head should not be cracked or chipped.","id":108,"group":"Tools & equipment","focus":true,"answerText":"Cracks or chips"},{"topic":"Assembly & fitting tools","page":"Assembly p. 15","q":"Why choose the correct hammer weight?","options":["To avoid supporting work","For greater noise","For faster corrosion","For proper control and force"],"answer":3,"why":"Too large a hammer makes accurate, safe striking difficult.","id":109,"group":"Tools & equipment","focus":true,"answerText":"For proper control and force"},{"topic":"Assembly & fitting tools","page":"Assembly p. 16","q":"What protects a machined face during hammering?","options":["Pipe wrench","Cold chisel","Steel punch point","Soft-metal drift"],"answer":3,"why":"A soft-metal drift is interposed to avoid direct damage to delicate work.","id":110,"group":"Tools & equipment","focus":true,"answerText":"Soft-metal drift"},{"topic":"Assembly & fitting tools","page":"Assembly p. 16","q":"What is an impact spanner used for?","options":["Measuring bearing clearance","Cutting electrical cable","Checking surface finish","Shock-loosening tight fasteners"],"answer":3,"why":"A hammer blow on an impact spanner helps loosen tight joints.","id":111,"group":"Tools & equipment","focus":true,"answerText":"Shock-loosening tight fasteners"},{"topic":"Assembly & fitting tools","page":"Assembly p. 16","q":"Which equipment positions heavy plant accurately?","options":["Soldering iron","Rivet tongs","Nut splitter","Measuring and levelling equipment"],"answer":3,"why":"Ranging and levelling are important for positioning plant during installation.","id":112,"group":"Tools & equipment","focus":true,"answerText":"Measuring and levelling equipment"},{"topic":"Assembly & fitting tools","page":"Assembly p. 16","q":"What holds installed plant on its foundation?","options":["Holding-down bolts","Solder fillets","Wire strippers","Split pins"],"answer":0,"why":"Holding-down bolts secure plant to a base or foundation.","id":113,"group":"Tools & equipment","focus":true,"answerText":"Holding-down bolts"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 6","q":"What handles large heavy machine parts?","options":["Soft solder","Only a hand spanner","Suitable lifting equipment","Small clamps only"],"answer":2,"why":"Large components require appropriate support and lifting equipment.","id":114,"group":"Tools & equipment","focus":true,"answerText":"Suitable lifting equipment"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 6","q":"What must support a load before work beneath it?","options":["Chain sling alone","Suitable fixed supports","Crane hook alone","Worker's hands"],"answer":1,"why":"Do not work under a suspended load; lower it onto secure supports.","id":115,"group":"Tools & equipment","focus":true,"answerText":"Suitable fixed supports"},{"topic":"Dismantling & lifting tools","page":"Assembly pp. 6–7","q":"What must a lifting plan consider?","options":["Load mass and centre of gravity","Only paint condition","Only ambient noise","Only the brand of crane"],"answer":0,"why":"Safe movement depends on load weight, balance and suitable lifting gear.","id":116,"group":"Tools & equipment","focus":true,"answerText":"Load mass and centre of gravity"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 7","q":"What protects precision machine surfaces in handling?","options":["Dragging along concrete","Correctly selected lifting points","An unprotected chain","Gripping the bearing journal"],"answer":1,"why":"Lifting points avoid damage to precision-ground surfaces.","id":117,"group":"Tools & equipment","focus":true,"answerText":"Correctly selected lifting points"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 7","q":"Why label dismantled structural members?","options":["Faster rust formation","Increased component weight","Correct reassembly","Less lifting capacity"],"answer":2,"why":"Marks identify original positions and orientation.","id":118,"group":"Dismantling & repair","focus":true,"answerText":"Correct reassembly"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 8","q":"What keeps dismantled parts in order?","options":["Clean marked storage arrangement","Loose mixed piles","Unrecorded movement","Random bins"],"answer":0,"why":"Marked and organised parts simplify correct reassembly.","id":119,"group":"Dismantling & repair","focus":true,"answerText":"Clean marked storage arrangement"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 8","q":"What should be marked before separating matched parts?","options":["Their resale price","Their relative positions","Their hardness only","Their paint colour only"],"answer":1,"why":"Marks help restore original alignment and orientation.","id":120,"group":"Tools & equipment","focus":true,"answerText":"Their relative positions"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 9","q":"What is applied to stubborn threads first?","options":["Adhesive resin","Molten solder","Concrete primer","Penetrating oil"],"answer":3,"why":"Penetrating fluid helps free seized nuts and screws.","id":121,"group":"Tools & equipment","focus":true,"answerText":"Penetrating oil"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 9","q":"What removes obstructing thread deposits?","options":["Painting","Further tightening only","Glue application","Cleaning and wire brushing"],"answer":3,"why":"Cleaning prevents dirt and corrosion obstructing removal.","id":122,"group":"Dismantling & repair","focus":true,"answerText":"Cleaning and wire brushing"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 9","q":"What may loosen a seized nut by shock?","options":["Covering it with wax","Soldering the nut","Controlled axial tapping","Polishing the flange"],"answer":2,"why":"The manual discusses tapping the nut to help break a corrosion bond.","id":123,"group":"Dismantling & repair","focus":true,"answerText":"Controlled axial tapping"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 9","q":"How may rivets be removed by drilling?","options":["Drill the main frame first","Weld the mandrel","Drill through the heads","Apply adhesive"],"answer":2,"why":"Careful centred drilling removes heads while protecting the surrounding metal.","id":124,"group":"Dismantling & repair","focus":true,"answerText":"Drill through the heads"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 16","q":"Why use cleaning agents before dismantling?","options":["Harden all threads","Increase rust adhesion","Replace component marking","Remove deposits and reveal defects"],"answer":3,"why":"Cleaning makes dismantling easier and faults more visible.","id":125,"group":"Dismantling & repair","focus":true,"answerText":"Remove deposits and reveal defects"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 17","q":"Which fluid is given as a penetrating-oil example?","options":["Engine coolant","Brake fluid","WD-40","Epoxy hardener"],"answer":2,"why":"The manual mentions WD-40 as a penetrating fluid.","id":126,"group":"Tools & equipment","focus":true,"answerText":"WD-40"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 17","q":"What draws penetrating oil into fine threads?","options":["Electrolysis","Centrifugal force","Magnetism","Capillary action"],"answer":3,"why":"The oil seeps into narrow gaps by capillary action.","id":127,"group":"Dismantling & repair","focus":true,"answerText":"Capillary action"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 17","q":"Which lubricant is mentioned with penetrating oils?","options":["Silica sand","Galvanising zinc","Epoxy resin","Graphite"],"answer":3,"why":"The manual notes a small amount of lubricant such as graphite.","id":128,"group":"Dismantling & repair","focus":true,"answerText":"Graphite"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 17","q":"What does a nut splitter do?","options":["Break a seized nut","Measure clamping force","Remove a pin intact","Re-cut threads"],"answer":0,"why":"A nut splitter fractures a nut when conventional removal fails.","id":129,"group":"Dismantling & repair","focus":true,"answerText":"Break a seized nut"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 17","q":"Which tool removes a threaded stud?","options":["Drift","Soldering iron","Stud remover","Rivet set"],"answer":2,"why":"Stud removers grip the exposed stud so it can be turned out.","id":130,"group":"Dismantling & repair","focus":true,"answerText":"Stud remover"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 17","q":"How can two nuts remove a stud?","options":["Lock them against each other","Weld them to the stud","Cut both in half","Remove their threads"],"answer":0,"why":"Locking two nuts together allows a spanner to turn the stud.","id":131,"group":"Dismantling & repair","focus":true,"answerText":"Lock them against each other"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 17","q":"What mechanism is used in some stud removers?","options":["A soldering electrode","Hardened knurled rollers","A flame nozzle","A spring washer alone"],"answer":1,"why":"A roller-type tool grips the stud as the spanner turns.","id":132,"group":"Dismantling & repair","focus":true,"answerText":"Hardened knurled rollers"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 18","q":"What extracts a broken screw or stud?","options":["Rivet set","Beam wrench","Easy-out","Tab washer"],"answer":2,"why":"An easy-out is a tapered reverse-thread extractor used after drilling a suitable pilot hole.","id":133,"group":"Dismantling & repair","focus":true,"answerText":"Easy-out"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 18","q":"What must be made before using an easy-out?","options":["Flange recess","Central pilot hole","Weld bevel","Rivet head"],"answer":1,"why":"The extractor is screwed into a hole drilled in the broken fastener.","id":134,"group":"Dismantling & repair","focus":true,"answerText":"Central pilot hole"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 18","q":"Which direction is the typical easy-out turned?","options":["Anticlockwise","Alternately regardless of thread","Clockwise only","Axially without rotation"],"answer":0,"why":"Its left-handed thread engages as it turns anticlockwise for a normal right-hand fastener.","id":135,"group":"Dismantling & repair","focus":true,"answerText":"Anticlockwise"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 18","q":"What tool may cut a rivet head destructively?","options":["Wire stripper","Circlip pliers","Beam wrench","Cold chisel"],"answer":3,"why":"Chiselling destroys the head, allowing the rivet to be removed.","id":136,"group":"Tools & equipment","focus":true,"answerText":"Cold chisel"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 18","q":"What is the danger of chiselling rivets?","options":["Reducing metal thickness everywhere","Improving rivet reuse","Increasing thread strength","Damaging the joined plates"],"answer":3,"why":"The chisel must not damage the surrounding joint metal.","id":137,"group":"Tools & equipment","focus":true,"answerText":"Damaging the joined plates"},{"topic":"Dismantling & lifting tools","page":"Assembly pp. 18–19","q":"What commonly cuts steel structures in dismantling?","options":["Adhesive bonding","Oxy-fuel flame cutting","Hand scraping","Soft soldering"],"answer":1,"why":"The manual describes flame cutting for large steel assemblies and pipework.","id":138,"group":"Dismantling & repair","focus":true,"answerText":"Oxy-fuel flame cutting"},{"topic":"Dismantling & lifting tools","page":"Assembly pp. 18–19","q":"Which gas stream oxidises steel during flame cutting?","options":["Carbon-dioxide shield","Oxygen jet","Nitrogen purge","Argon shield"],"answer":1,"why":"After preheating, high-purity oxygen reacts with hot steel to cut it.","id":139,"group":"Dismantling & repair","focus":true,"answerText":"Oxygen jet"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 19","q":"What controls a top-heavy load during lifting?","options":["Pipe union","Hammer drift","Flat washer","Spreader"],"answer":3,"why":"Spreader beams can help maintain controlled lifting geometry and load balance.","id":140,"group":"Tools & equipment","focus":true,"answerText":"Spreader"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 20","q":"What authorises work on isolated plant?","options":["Delivery invoice","Purchase order","Calibration label","Permit to work"],"answer":3,"why":"The manual requires appropriate permit-to-work arrangements.","id":141,"group":"Tools & equipment","focus":true,"answerText":"Permit to work"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 20","q":"What helps prevent accidental valve operation?","options":["Using only verbal warnings","Locking or securing valves","Painting handwheels","Removing all tags"],"answer":1,"why":"Isolation valves should be secured against inadvertent operation.","id":142,"group":"Tools & equipment","focus":true,"answerText":"Locking or securing valves"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 20","q":"What may remain after draining a process vessel?","options":["Flammable vapours","Only fresh air","No pressure ever","Zero hazards"],"answer":0,"why":"Draining liquid may leave harmful or combustible vapours.","id":143,"group":"Tools & equipment","focus":true,"answerText":"Flammable vapours"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 20","q":"Who should isolate electrical supplies?","options":["The cleaner only","Any passing operator","Untrained visitors","Authorised qualified personnel"],"answer":3,"why":"The manual places electrical isolation with qualified authorised staff.","id":144,"group":"Tools & equipment","focus":true,"answerText":"Authorised qualified personnel"},{"topic":"Dismantling & lifting tools","page":"Assembly p. 20","q":"What protects from high-temperature equipment?","options":["Only plastic plugs","No preparation","Bare-hand testing","Suitable thermal PPE and isolation"],"answer":3,"why":"Hot pipes and equipment may cause burns and require proper protection.","id":145,"group":"Tools & equipment","focus":true,"answerText":"Suitable thermal PPE and isolation"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 23","q":"Which holes receive machine screws?","options":["Counterbored pins only","Plain oversized bores","Welded seams","Previously tapped holes"],"answer":3,"why":"Machine screws normally engage internal threads in prepared tapped holes.","id":146,"group":"Fasteners & washers","focus":true,"answerText":"Previously tapped holes"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 23","q":"Which screw head sits flush in a recess?","options":["Round","Cheese","Pan","Countersunk"],"answer":3,"why":"A countersunk head sits flush when the proper countersink is provided.","id":147,"group":"Fasteners & washers","focus":true,"answerText":"Countersunk"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 23","q":"Which head has a cylindrical straight-sided shape?","options":["Raised countersunk head","Hexagon grub point","Countersunk head","Cheese head"],"answer":3,"why":"Cheese-head screws have a generally cylindrical head.","id":148,"group":"Fasteners & washers","focus":true,"answerText":"Cheese head"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 23","q":"Which screw often secures a collar on a shaft?","options":["Blind rivet","Stud bolt","Coach bolt","Grub screw"],"answer":3,"why":"The manual gives collars and knobs on shafts as grub-screw applications.","id":149,"group":"Fasteners & washers","focus":true,"answerText":"Grub screw"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 24","q":"What drives a socket-head cap screw?","options":["Hexagon key","Flat screwdriver","Pipe wrench","Ball-pein hammer"],"answer":0,"why":"Socket-head cap screws use an internal hexagon key.","id":150,"group":"Fasteners & washers","focus":true,"answerText":"Hexagon key"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 24","q":"Which material is common for socket screws?","options":["High-grade alloy steel","Soft solder only","Wood","Pure lead"],"answer":0,"why":"The manual describes these screws as manufactured in high-grade alloy steel.","id":151,"group":"Fasteners & washers","focus":true,"answerText":"High-grade alloy steel"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 24","q":"What does a dog-point set screw help prevent?","options":["Thermal distortion","Damage to the work","Corrosion of all metals","Loose rivet heads"],"answer":1,"why":"The dog point gives a less damaging contact form in appropriate applications.","id":152,"group":"Fasteners & washers","focus":true,"answerText":"Damage to the work"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 24","q":"What does a cup-point screw have?","options":["Flat cutting edge","Rounded external head","Hollow cup-shaped point","Internal split pin"],"answer":2,"why":"A cup point has a recessed rim intended to grip the receiving part.","id":153,"group":"Fasteners & washers","focus":true,"answerText":"Hollow cup-shaped point"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 24","q":"What does a thread-forming screw do?","options":["Heats the work to fusion","Cuts a bolt head","Removes chips in flutes","Displaces material"],"answer":3,"why":"Thread-forming screws create a mating thread by deforming the material.","id":154,"group":"Fasteners & washers","focus":true,"answerText":"Displaces material"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 24","q":"What does a thread-cutting screw do?","options":["Compresses only","Pulls a mandrel","Removes material","Melts the material"],"answer":2,"why":"Thread-cutting screws form threads by cutting material away.","id":155,"group":"Fasteners & washers","focus":true,"answerText":"Removes material"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 24","q":"Which screw combines drilling and tapping?","options":["Cheese-head machine screw","Socket-head cap screw","Self-drilling self-tapping screw","Plain grub screw"],"answer":2,"why":"A drill-point screw creates a pilot hole and its own thread in one operation.","id":156,"group":"Fasteners & washers","focus":true,"answerText":"Self-drilling self-tapping screw"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 25","q":"What normally distinguishes a bolt from a screw in the manual?","options":["Used with a nut","Always has a flat point","Always smaller than 10 mm","Never has external threads"],"answer":0,"why":"The manual describes bolts used with nuts, unlike screws driven into tapped holes.","id":157,"group":"Fasteners & washers","focus":true,"answerText":"Used with a nut"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 25","q":"What is a wing nut suited for?","options":["Precision rivet setting","Permanent welding","Frequent hand removal","Internal thread tapping"],"answer":2,"why":"Wing nuts can be tightened or removed by hand where loads permit.","id":158,"group":"Fasteners & washers","focus":true,"answerText":"Frequent hand removal"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 25","q":"What is a dome nut used for?","options":["Holding a rivet head","Covering exposed threads","Cutting a new thread","Sealing a cylinder bore"],"answer":1,"why":"Dome or cap nuts cover exposed threaded ends and improve appearance.","id":159,"group":"Fasteners & washers","focus":true,"answerText":"Covering exposed threads"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 25","q":"Why use a flat washer?","options":["Act as a rivet mandrel","Remove seized studs","Measure torque","Spread clamping load"],"answer":3,"why":"Flat washers spread load over a larger bearing surface.","id":160,"group":"Fasteners & washers","focus":true,"answerText":"Spread clamping load"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 25","q":"Do plain flat washers lock against vibration?","options":["Always","Only with paint","Only after heat treatment","No"],"answer":3,"why":"The manual states plain washers spread load but provide no locking action.","id":161,"group":"Fasteners & washers","focus":true,"answerText":"No"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 25","q":"What may a spring-steel washer resist?","options":["Loosening","Thread cutting","Rivet drilling","Solder melting"],"answer":0,"why":"Locking washers are intended to resist loosening during service.","id":162,"group":"Fasteners & washers","focus":true,"answerText":"Loosening"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 26","q":"What material forms spring-tension pins?","options":["Soft lead","Plastic resin","Rolled spring steel","Tin solder"],"answer":2,"why":"The manual describes spring steel rolled into a tube.","id":163,"group":"Fasteners & washers","focus":true,"answerText":"Rolled spring steel"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 26","q":"Why does a spring-tension pin grip its hole?","options":["Magnetic attraction","Welding fusion","Adhesive curing","Elastic outward pressure"],"answer":3,"why":"Its oversized slotted shape compresses and springs against the bore.","id":164,"group":"Fasteners & washers","focus":true,"answerText":"Elastic outward pressure"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 26","q":"What tool typically installs a spring-tension pin?","options":["Hammer with a suitable punch","Flux brush","Torque meter","Flame torch"],"answer":0,"why":"The manual says these pins can be driven into holes with a hammer.","id":165,"group":"Fasteners & washers","focus":true,"answerText":"Hammer with a suitable punch"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 26","q":"What is the ISO metric thread angle?","options":["30 degrees","55 degrees","45 degrees","60 degrees"],"answer":3,"why":"ISO metric threads use a nominal 60-degree triangular form.","id":166,"group":"Fasteners & washers","focus":true,"answerText":"60 degrees"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 26","q":"What is the Unified thread angle?","options":["75 degrees","60 degrees","55 degrees","90 degrees"],"answer":1,"why":"UNC and UNF use a 60-degree thread form.","id":167,"group":"Fasteners & washers","focus":true,"answerText":"60 degrees"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 27","q":"What is the Whitworth thread angle?","options":["55 degrees","60 degrees","30 degrees","45 degrees"],"answer":0,"why":"BSW and BSF use the 55-degree Whitworth thread form.","id":168,"group":"Fasteners & washers","focus":true,"answerText":"55 degrees"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 26","q":"What does M16 × 2 indicate as pitch?","options":["2 mm","1 mm","2 inches","16 mm"],"answer":0,"why":"The number after × gives thread pitch in millimetres.","id":169,"group":"Fasteners & washers","focus":true,"answerText":"2 mm"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 26","q":"What does M16 identify?","options":["Thread length only","Fastener strength grade","Nominal diameter","Spanner jaw width"],"answer":2,"why":"M16 indicates a nominal 16 mm metric thread diameter.","id":170,"group":"Fasteners & washers","focus":true,"answerText":"Nominal diameter"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 26","q":"What does UNC indicate?","options":["Unified close fit","Universal nut clamp","Uncut non-circular thread","Unified coarse thread"],"answer":3,"why":"UNC is the Unified National Coarse series.","id":171,"group":"Fasteners & washers","focus":true,"answerText":"Unified coarse thread"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 26","q":"What does UNF indicate?","options":["Unfinished nut form","Unified fine thread","Universal nut fitting","Unified flange"],"answer":1,"why":"UNF is the Unified National Fine series.","id":172,"group":"Fasteners & washers","focus":true,"answerText":"Unified fine thread"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 27","q":"Which British thread is common on pipes?","options":["BA","UNC","BSF","BSP"],"answer":3,"why":"BSP stands for British Standard Pipe thread.","id":173,"group":"Fasteners & washers","focus":true,"answerText":"BSP"},{"topic":"Screws, bolts, nuts & pins","page":"Assembly p. 27","q":"Which thread suits small instruments in this manual?","options":["BA","BSW","BSP","UNC"],"answer":0,"why":"British Association threads were used for small-diameter instrument fasteners.","id":174,"group":"Fasteners & washers","focus":true,"answerText":"BA"},{"topic":"Locking devices","page":"Assembly p. 27","q":"What is the purpose of a thread lock?","options":["Resist loosening in service","Increase nominal thread size","Cut external threads","Improve surface finish"],"answer":0,"why":"Locking devices reduce unintended fastener loosening.","id":175,"group":"Locking devices","focus":true,"answerText":"Resist loosening in service"},{"topic":"Locking devices","page":"Assembly p. 27","q":"What gives a Nyloc nut resistance?","options":["Welded metal strips","Castellated slots only","Spring washers only","Nylon insert friction"],"answer":3,"why":"The nylon insert creates prevailing friction on the male thread.","id":176,"group":"Locking devices","focus":true,"answerText":"Nylon insert friction"},{"topic":"Locking devices","page":"Assembly p. 27","q":"What does liquid threadlocker do?","options":["Cures in engaged threads","Removes stripped threads","Paints the shaft","Expands a rivet head"],"answer":0,"why":"Anaerobic adhesive can lock threaded fasteners after assembly.","id":177,"group":"Locking devices","focus":true,"answerText":"Cures in engaged threads"},{"topic":"Locking devices","page":"Assembly p. 27","q":"What does micro-encapsulation hold?","options":["Thread-locking compound","Molten brass","Copper primer","Hydraulic oil only"],"answer":0,"why":"Some locking screws carry encapsulated adhesive on their threads.","id":178,"group":"Locking devices","focus":true,"answerText":"Thread-locking compound"},{"topic":"Locking devices","page":"Assembly p. 28","q":"What secures a castellated nut?","options":["Centre punch only","Solder fillet","Flat washer alone","Split pin"],"answer":3,"why":"A split pin passes through the aligned nut slots and shaft or bolt hole.","id":179,"group":"Locking devices","focus":true,"answerText":"Split pin"},{"topic":"Locking devices","page":"Assembly p. 28","q":"What distinguishes a slotted nut?","options":["An unthreaded bore","Slots across the top","A conical base","A nylon insert"],"answer":1,"why":"A slotted nut has openings for a split pin.","id":180,"group":"Locking devices","focus":true,"answerText":"Slots across the top"},{"topic":"Locking devices","page":"Assembly p. 28","q":"What tool bends split-pin ends?","options":["Torque beam","Soldering iron","Drift punch only","Pliers"],"answer":3,"why":"Split-pin legs are bent to secure the assembly after insertion.","id":181,"group":"Locking devices","focus":true,"answerText":"Pliers"},{"topic":"Locking devices","page":"Assembly p. 28","q":"How does an Aerotight nut lock?","options":["Molten solder","Liquid flux","Rivet clinching","Spring-steel arm resistance"],"answer":3,"why":"Spring-steel arms resist free rotation after being forced aside during fitting.","id":182,"group":"Locking devices","focus":true,"answerText":"Spring-steel arm resistance"},{"topic":"Locking devices","page":"Assembly p. 28","q":"How does a Philidas nut lock?","options":["Deformed upper thread","A tab washer only","A liquid gasket","A weld around its base"],"answer":0,"why":"The upper portion is deformed to produce prevailing resistance.","id":183,"group":"Locking devices","focus":true,"answerText":"Deformed upper thread"},{"topic":"Locking devices","page":"Assembly p. 28","q":"What characterises a torque-lock nut?","options":["A plain smooth bore","Wide flat washer","External rivet pin","Deformed elliptical thread region"],"answer":3,"why":"The elliptical thread form produces interference and locking friction.","id":184,"group":"Locking devices","focus":true,"answerText":"Deformed elliptical thread region"},{"topic":"Locking devices","page":"Assembly p. 28","q":"What does a tab washer do?","options":["Bends to stop fastener rotation","Removes a bearing","Supports a rivet","Cuts the thread"],"answer":0,"why":"Tabs are bent against a nut or component to mechanically resist movement.","id":185,"group":"Locking devices","focus":true,"answerText":"Bends to stop fastener rotation"},{"topic":"Locking devices","page":"Assembly p. 28","q":"Where is a lock washer fitted?","options":["Inside a soldering iron","Between oxygen cylinders","Across the rivet mandrel","Under a fastener head or nut"],"answer":3,"why":"Lock washers are installed at the fastening interface.","id":186,"group":"Locking devices","focus":true,"answerText":"Under a fastener head or nut"},{"topic":"Locking devices","page":"Assembly p. 28","q":"How do star washers resist rotation?","options":["They melt into the nut","Their threads strip","Teeth bite into surfaces","They rely on a rivet head"],"answer":2,"why":"Sharp teeth embed in contacting surfaces to oppose loosening.","id":187,"group":"Locking devices","focus":true,"answerText":"Teeth bite into surfaces"},{"topic":"Locking devices","page":"Assembly p. 28","q":"What is another name for a star washer?","options":["Plain washer","Shakeproof washer","Fibre washer","Spacer washer"],"answer":1,"why":"The manual uses shakeproof for toothed locking washers.","id":188,"group":"Locking devices","focus":true,"answerText":"Shakeproof washer"},{"topic":"Locking devices","page":"Assembly p. 28","q":"What does a helical lock washer resemble?","options":["Split spring ring","Solid flat disc","Castellated nut","Dowel pin"],"answer":0,"why":"A helical spring washer is split and offset to exert spring pressure.","id":189,"group":"Locking devices","focus":true,"answerText":"Split spring ring"},{"topic":"Locking devices","page":"Assembly p. 29","q":"What is a shakeproof washer's thread-size range?","options":["Only 1 mm","Up to 100 mm","Only 50 mm","Up to 16 mm"],"answer":3,"why":"The manual states shakeproof washers are used for thread sizes up to 16 mm.","id":190,"group":"Locking devices","focus":true,"answerText":"Up to 16 mm"},{"topic":"Locking devices","page":"Assembly p. 29","q":"Where are serrated shakeproof washers useful?","options":["Only in pressure vessels","Where access is limited","Only in solder baths","Only in molten metal"],"answer":1,"why":"The manual describes versions that can be fitted or removed with limited adjustment.","id":191,"group":"Locking devices","focus":true,"answerText":"Where access is limited"},{"topic":"Locking devices","page":"Assembly p. 29","q":"What is a locking washer's main difference from a flat washer?","options":["Spreads heat only","Cuts new holes","Resists loosening","Protects welded seams"],"answer":2,"why":"Flat washers distribute load; locking designs aim to prevent unwanted rotation.","id":192,"group":"Locking devices","focus":true,"answerText":"Resists loosening"},{"topic":"Riveting equipment","page":"Assembly p. 29","q":"What is the purpose of riveting?","options":["Electrical insulation only","Quick unscrewing","Melting base metals","Permanent mechanical fastening"],"answer":3,"why":"Riveting forms a permanent mechanical joint.","id":193,"group":"Riveting","focus":true,"answerText":"Permanent mechanical fastening"},{"topic":"Riveting equipment","page":"Assembly p. 29","q":"What separates solid and tubular rivets?","options":["Whether the shank is hollow","Whether steel is magnetic","The rivet's paint colour","Its head diameter alone"],"answer":0,"why":"Tubular rivets have a hollow portion, unlike solid rivets.","id":194,"group":"Riveting","focus":true,"answerText":"Whether the shank is hollow"},{"topic":"Riveting equipment","page":"Assembly p. 29","q":"What shape does a countersunk rivet head provide?","options":["Flush surface","Split-pin passage","Tall domed surface","Hexagonal recess"],"answer":0,"why":"A countersunk rivet is designed to sit flush in a prepared recess.","id":195,"group":"Riveting","focus":true,"answerText":"Flush surface"},{"topic":"Riveting equipment","page":"Assembly p. 29","q":"Which rivet suits brittle materials?","options":["High-tensile bolt","Stud bolt","Semi-tubular rivet","Large solid rivet only"],"answer":2,"why":"Semi-tubular designs require less setting force and suit brittle materials.","id":196,"gro
