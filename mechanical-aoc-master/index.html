 and argon","Acetylene and oxygen","Hydrogen and propane"],"answer":3,"why":"Hydrogen and propane are both listed as signal red.","id":555,"group":"Gas cylinders & codes","focus":true,"answerText":"Hydrogen and propane"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"What is the correct distinction between extinguisher colours and cylinder colours?","options":["Every black cylinder is a CO2 extinguisher","The codes can replace reading identification labels","They are separate identification systems for different equipment","They must always use the same code for the same gas"],"answer":2,"why":"The manual gives separate charts for extinguisher media and industrial-gas cylinders.","id":556,"group":"Gas cylinders & codes","focus":true,"answerText":"They are separate identification systems for different equipment"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"Why should a cylinder user consult the gas label and safety data sheet rather than rely only on colour?","options":["Colours alone may be ambiguous or differ between standards and dates","Cylinder contents cannot be hazardous","Labels have no meaning","All cylinders contain air"],"answer":0,"why":"The manual calls for knowing gas properties and proper handling; modern practice requires checking labels.","id":557,"group":"Gas cylinders & codes","focus":true,"answerText":"Colours alone may be ambiguous or differ between standards and dates"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"According to the manual, which fire class involves wood, paper and fabrics?","options":["Electrical class E in the manual","Class B","Class A","Class C"],"answer":2,"why":"Safety p.18 identifies Class A as ordinary combustible solids.","id":558,"group":"Fire & extinguishers","focus":true,"answerText":"Class A"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"According to the manual, which fire class includes petrol, oils and other flammable liquids?","options":["A special gas-only class","Class B","Class C","Class A"],"answer":1,"why":"Class B refers to flammable liquids in the manual.","id":559,"group":"Fire & extinguishers","focus":true,"answerText":"Class B"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"According to the manual, which fire class includes propane and butane?","options":["Class A","Class B","Class C","A class for water only"],"answer":2,"why":"Class C is flammable gases in the manual's system.","id":560,"group":"Fire & extinguishers","focus":true,"answerText":"Class C"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"Which extinguisher medium does the manual associate primarily with Class A solid combustibles?","options":["Liquid nitrogen","Pure oxygen","Water","Carbon dioxide only"],"answer":2,"why":"Water cools many ordinary solid-fuel fires; suitability depends on specific hazard.","id":561,"group":"Fire & extinguishers","focus":true,"answerText":"Water"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"Which agent in the manual may be used for both Class A and Class B in suitable conditions?","options":["Petrol","Pure oxygen","Acetylene","Spray foam"],"answer":3,"why":"The manual describes foam as useful for solid materials and flammable-liquid fires.","id":562,"group":"Other safety","focus":false,"answerText":"Spray foam"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"Which medium does the manual describe as effective for Class B and C and electrical hazards?","options":["Compressed air","Liquid propane","Water only","CO2"],"answer":3,"why":"The manual discusses carbon dioxide for flammable-liquid/gas contexts and electrical hazards; select extinguishers by current ratings and training.","id":563,"group":"Other safety","focus":false,"answerText":"CO2"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"Which agent does the manual describe as a broad-purpose extinguisher for Class A, B and C?","options":["Pure oxygen","Water only","Lubricating oil","Dry powder"],"answer":3,"why":"Dry powder is listed against A, B and C in the manual's chart.","id":564,"group":"Fire & extinguishers","focus":true,"answerText":"Dry powder"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"Why is water generally unsuitable for a live electrical equipment fire?","options":["It turns water into dry powder","It removes the need to isolate power","It prevents electric shock automatically","Water may conduct electricity and create shock risk"],"answer":3,"why":"The manual contrasts media for electrical hazards. Only rated appropriate extinguishers should be used.","id":565,"group":"Other safety","focus":false,"answerText":"Water may conduct electricity and create shock risk"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"What does AFFF stand for in the foam-extinguisher section?","options":["Air Force Fire Filter","Abrasive Fire-Fighting Flux","Automatic Flame Feeding Fluid","Aqueous Film-Forming Foam"],"answer":3,"why":"The manual uses AFFF for a foam-forming agent for suitable liquid fires.","id":566,"group":"Fire & extinguishers","focus":true,"answerText":"Aqueous Film-Forming Foam"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"What does CO2 primarily achieve during extinguishing?","options":["Adds oxygen to fuel","Raises the gas pressure indefinitely","Acts as a metal fastener","Reduces the oxygen concentration around the fire"],"answer":3,"why":"The manual presents carbon dioxide as displacing oxygen around the burning material.","id":567,"group":"Other safety","focus":false,"answerText":"Reduces the oxygen concentration around the fire"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"Why are Halon extinguishers noted as withdrawn in the manual?","options":["Because they have no firefighting effect","Because every cylinder is silver","Because of ozone-depletion concerns","Because halon is simply water"],"answer":2,"why":"The manual mentions withdrawal owing to environmental effects.","id":568,"group":"Fire & extinguishers","focus":true,"answerText":"Because of ozone-depletion concerns"},{"topic":"Fire, accidents & general safety practice","page":"Safety pp. 16–22","q":"What three elements form the fire triangle?","options":["Nitrogen, argon and steel","Heat, fuel and oxygen","Sound, light and vibration","Water, iron and oil"],"answer":1,"why":"A fire requires heat, fuel and oxygen; remove one to interrupt burning.","id":569,"group":"Fire & extinguishers","focus":true,"answerText":"Heat, fuel and oxygen"},{"topic":"Fire, accidents & general safety practice","page":"Safety pp. 16–22","q":"What is meant by 'smothering' a fire?","options":["Reducing access of oxygen to the burning material","Adding more combustible material","Heating the fire above its flash point","Increasing ventilation toward flames"],"answer":0,"why":"Smothering cuts off oxygen supply to a fire.","id":570,"group":"Fire & extinguishers","focus":true,"answerText":"Reducing access of oxygen to the burning material"},{"topic":"Fire, accidents & general safety practice","page":"Safety pp. 16–22","q":"What is the primary extinguishing action of water on suitable Class A fires?","options":["Adding extra oxygen","Cooling the burning material","Increasing fuel vapour","Making dry powder"],"answer":1,"why":"Water absorbs heat and cools many ordinary combustible fires.","id":571,"group":"Fire & extinguishers","focus":true,"answerText":"Cooling the burning material"},{"topic":"Fire, accidents & general safety practice","page":"Safety pp. 16–22","q":"What is the most effective general objective of fire prevention?","options":["Block escape routes","Prevent ignition by controlling fuel, ignition sources and hazards","Ignore leaks of flammable gas","Keep combustible waste in passageways"],"answer":1,"why":"Prevention reduces the conditions required for a fire.","id":572,"group":"Fire & extinguishers","focus":true,"answerText":"Prevent ignition by controlling fuel, ignition sources and hazards"},{"topic":"Fire, accidents & general safety practice","page":"Safety pp. 16–22","q":"Which is a common electrical ignition source in the manual?","options":["Clean storage pallets only","Adequate ventilation","Properly isolated circuits","Overloaded circuits or damaged wiring"],"answer":3,"why":"Electrical faults can generate heat and sparks.","id":573,"group":"Fire & extinguishers","focus":true,"answerText":"Overloaded circuits or damaged wiring"},{"topic":"Fire, accidents & general safety practice","page":"Safety pp. 16–22","q":"Why should combustible waste be removed from work areas?","options":["It lowers oxygen everywhere","It prevents static charge automatically","It adds fuel and can help fires spread","It neutralises all ignition sources"],"answer":2,"why":"Good housekeeping removes unnecessary fuel.","id":574,"group":"Fire & extinguishers","focus":true,"answerText":"It adds fuel and can help fires spread"},{"topic":"Fire, accidents & general safety practice","page":"Safety pp. 16–22","q":"Why should welding near flammable materials require special precautions?","options":["Sparks and hot metal can ignite surrounding materials","Welding never produces sparks","Protective measures are only cosmetic","Hot work eliminates vapours"],"answer":0,"why":"Control or remove combustibles and use required hot-work procedures.","id":575,"group":"Fire & extinguishers","focus":true,"answerText":"Sparks and hot metal can ignite surrounding materials"},{"topic":"Fire, accidents & general safety practice","page":"Safety pp. 16–22","q":"What is a fire drill intended to practise?","options":["Replacing worn mechanical bearings","Reading thread charts only","Machine production speed","Correct emergency response and evacuation"],"answer":3,"why":"Drills familiarise personnel with emergency action.","id":576,"group":"Fire & extinguishers","focus":true,"answerText":"Correct emergency response and evacuation"},{"topic":"Fire, accidents & general safety practice","page":"Safety pp. 16–22","q":"What should never be done with a fire-resisting door?","options":["Ensure it closes properly","Keep its access unobstructed","Wedge it open contrary to fire safety arrangements","Inspect it when required"],"answer":2,"why":"Fire doors must perform their protective function when required.","id":577,"group":"Fire & extinguishers","focus":true,"answerText":"Wedge it open contrary to fire safety arrangements"},{"topic":"Fire, accidents & general safety practice","page":"Safety pp. 16–22","q":"Why is storage of flammable material near hot machinery dangerous?","options":["It improves cooling","It replaces insulation","It provides guaranteed protection","Heat may ignite or accelerate combustion"],"answer":3,"why":"Control combustible storage and ignition sources.","id":578,"group":"Fire & extinguishers","focus":true,"answerText":"Heat may ignite or accelerate combustion"},{"topic":"Fire, accidents & general safety practice","page":"Safety pp. 16–22","q":"What is one hazard of an obstructed fire exit?","options":["It raises production efficiency","It guarantees safe escape","It delays evacuation","It reduces fire spread automatically"],"answer":2,"why":"Escape routes must remain clear.","id":579,"group":"Fire & extinguishers","focus":true,"answerText":"It delays evacuation"},{"topic":"Fire, accidents & general safety practice","page":"Safety pp. 16–22","q":"What is the purpose of a fire extinguisher identification label?","options":["Measure room humidity","Replace all operator training","Make every extinguisher suitable for every fire","Identify medium, rating and operating information"],"answer":3,"why":"Users need verified identification and proper training.","id":580,"group":"Fire & extinguishers","focus":true,"answerText":"Identify medium, rating and operating information"},{"topic":"Fire, accidents & general safety practice","page":"Safety pp. 16–22","q":"How can poor housekeeping cause a workplace accident?","options":["It eliminates all ignition risks","Spills, obstacles and clutter create slip and trip hazards","It secures loose ladders","It automatically increases tool reliability"],"answer":1,"why":"The manual highlights slippery floors and obstacles.","id":581,"group":"Fire & extinguishers","focus":true,"answerText":"Spills, obstacles and clutter create slip and trip hazards"},{"topic":"Fire, accidents & general safety practice","page":"Safety pp. 16–22","q":"Why should machinery guards remain in place during operation?","options":["They increase the chance of entanglement","They reduce contact with dangerous moving parts","They make lubrication impossible","They replace risk assessments"],"answer":1,"why":"Guards help prevent entry into dangerous machine zones.","id":582,"group":"Fire & extinguishers","focus":true,"answerText":"They reduce contact with dangerous moving parts"},{"topic":"Fire, accidents & general safety practice","page":"Safety pp. 16–22","q":"What is the preferred action when machinery becomes unsafe or malfunctions?","options":["Remove guarding to observe the fault","Reach into moving parts","Continue using it until catastrophic failure","Stop and isolate it in accordance with procedure before intervention"],"answer":3,"why":"The manual emphasises safe operation, stopping and isolation.","id":583,"group":"Fire & extinguishers","focus":true,"answerText":"Stop and isolate it in accordance with procedure before intervention"},{"topic":"Fire, accidents & general safety practice","page":"Safety pp. 16–22","q":"Why must loose clothing and jewellery be controlled around moving machinery?","options":["They block static electricity completely","They make bearings stronger","They can catch and pull a person into rotating parts","They automatically stop the motor"],"answer":2,"why":"Entanglement hazards exist around rotating equipment.","id":584,"group":"Fire & extinguishers","focus":true,"answerText":"They can catch and pull a person into rotating parts"},{"topic":"Fire, accidents & general safety practice","page":"Safety pp. 16–22","q":"Which precaution applies when using a ladder?","options":["Set it securely and avoid overreaching","Rest it on moving equipment","Use any damaged ladder if the job is brief","Stand on the top rung with no support"],"answer":0,"why":"The manual emphasises stable ladders, inspection and correct positioning.","id":585,"group":"Fire & extinguishers","focus":true,"answerText":"Set it securely and avoid overreaching"},{"topic":"Fire, accidents & general safety practice","page":"Safety pp. 16–22","q":"Why must operators avoid cleaning a machine while it is running?","options":["Lubrication is forbidden","The machine becomes electrically double insulated","Moving parts may catch tools or hands","Cleaning always increases pressure"],"answer":2,"why":"Stop and make machinery safe before cleaning where intervention exposes moving hazards.","id":586,"group":"Fire & extinguishers","focus":true,"answerText":"Moving parts may catch tools or hands"},{"topic":"Fire, accidents & general safety practice","page":"Safety pp. 16–22","q":"Why should compressed air not be directed toward a person's skin or clothing?","options":["It cannot move particles","It only cleans without force","It is always as safe as water","It can cause serious injury from injected air or flying debris"],"answer":3,"why":"The manual warns against using compressed air on people.","id":587,"group":"Fire & extinguishers","focus":true,"answerText":"It can cause serious injury from injected air or flying debris"},{"topic":"Fire, accidents & general safety practice","page":"Safety pp. 16–22","q":"What should a worker do if harmful substances contaminate clothing?","options":["Use compressed air to force chemicals through fabric","Assume all substances evaporate safely","Continue working indefinitely","Follow the site's decontamination and reporting procedures promptly"],"answer":3,"why":"The manual urges precautions and prompt action after contamination.","id":588,"group":"Fire & extinguishers","focus":true,"answerText":"Follow the site's decontamination and reporting procedures promptly"},{"topic":"Fire, accidents & general safety practice","page":"Safety pp. 16–22","q":"What is a basic first-aid responsibility at work?","options":["Hide incidents to preserve production","Ignore small injuries completely","Treat every chemical incident with the same home remedy","Know how to obtain prompt help and report injuries"],"answer":3,"why":"The manual says report every injury and know local first-aid arrangements.","id":589,"group":"Fire & extinguishers","focus":true,"answerText":"Know how to obtain prompt help and report injuries"},{"topic":"Fire, accidents & general safety practice","page":"Safety pp. 16–22","q":"Why must a safe system of work also consider people nearby?","options":["Only the operator can be injured","They may be harmed by the operation even if not performing it","Nearby personnel are always protected by ordinary clothing","Equipment cannot eject objects"],"answer":1,"why":"Work activities can expose bystanders to hazards.","id":590,"group":"Fire & extinguishers","focus":true,"answerText":"They may be harmed by the operation even if not performing it"},{"topic":"Safety duties & committees","page":"Safety p. 1","q":"What does HSW stand for?","options":["Health and Safety at Work","Health Standards Workshop","Hazardous Site Warning","Hazardous Substance Welfare"],"answer":0,"why":"The manual refers to the Health and Safety at Work Act.","id":591,"group":"Other safety","focus":false,"answerText":"Health and Safety at Work"},{"topic":"Safety duties & committees","page":"Safety p. 1","q":"Which responsibility includes safe systems of work?","options":["Provision and maintenance of safe plant","Employee disciplinary policy","Preparation of wages and allowances","Customer equipment certification"],"answer":0,"why":"The employer must provide safe machinery, plant and systems of work.","id":592,"group":"Other safety","focus":false,"answerText":"Provision and maintenance of safe plant"},{"topic":"Safety duties & committees","page":"Safety p. 1","q":"What is required when hazardous substances are used?","options":["Replacement of every substance with water","Removal of all protective equipment","Only a warning label on the door","Safe arrangements for their use and handling"],"answer":3,"why":"The employer must ensure safety in the use, handling, storage and transport of substances.","id":593,"group":"Other safety","focus":false,"answerText":"Safe arrangements for their use and handling"},{"topic":"Safety duties & committees","page":"Safety p. 1","q":"What must employees receive to work safely?","options":["Information, instruction, training and supervision","Monthly attendance sheets only","A set of keys and an identity card","Only practical experience without supervision"],"answer":0,"why":"Employers must provide safety information, instruction, training and supervision.","id":594,"group":"Other safety","focus":false,"answerText":"Information, instruction, training and supervision"},{"topic":"Safety duties & committees","page":"Safety p. 1","q":"Which item is classified as welfare at work?","options":["A metal-working lathe","Washing and toilet facilities","A workshop production counter","An electrical motor starter"],"answer":1,"why":"The manual includes washing, toilets and seating under welfare facilities.","id":595,"group":"Other safety","focus":false,"answerText":"Washing and toilet facilities"},{"topic":"Safety duties & committees","page":"Safety p. 1","q":"According to the manual, a written safety policy is required for employers with more than:","options":["Ten employees","Twenty employees","Five employees","Fifty employees"],"answer":2,"why":"The manual states more than five employees; treat this as manual-based examination content.","id":596,"group":"Other safety","focus":false,"answerText":"Five employees"},{"topic":"Safety duties & committees","page":"Safety p. 1","q":"Who should receive a copy of the safety policy?","options":["Only the managing director","Every employee","Only external auditors","Only the safety committee secretary"],"answer":1,"why":"The policy should be brought to the attention of every employee.","id":597,"group":"Other safety","focus":false,"answerText":"Every employee"},{"topic":"Safety duties & committees","page":"Safety p. 1","q":"When should a safety policy be reviewed?","options":["When organisation or working conditions change","Only when an inspector visits","Only after an employee retires","Only at company formation"],"answer":0,"why":"The policy must be reviewed and revised when responsibilities or working conditions change.","id":598,"group":"Other safety","focus":false,"answerText":"When organisation or working conditions change"},{"topic":"Safety duties & committees","page":"Safety p. 2","q":"Who may request a workplace safety committee?","options":["At least two safety representatives","Any two customers","A single visiting supplier","The youngest two employees"],"answer":0,"why":"The manual specifies a request made in writing by at least two safety representatives.","id":599,"group":"Other safety","focus":false,"answerText":"At least two safety representatives"},{"topic":"Safety duties & committees","page":"Safety p. 2","q":"What is the main objective of a safety committee?","options":["Approve overtime claims","Choose company suppliers","Supervise marketing expenditure","Promote cooperation on workplace health and safety"],"answer":3,"why":"A safety committee promotes cooperation between employers and employees.","id":600,"group":"Other safety","focus":false,"answerText":"Promote cooperation on workplace health and safety"},{"topic":"Safety duties & committees","page":"Safety p. 2","q":"What should be reported to safety representatives?","options":["Only work completed early","Unsafe conditions and dangerous occurrences","Only equipment delivery dates","Annual leave applications"],"answer":1,"why":"Reporting unsafe conditions helps corrective actions.","id":601,"group":"Other safety","focus":false,"answerText":"Unsafe conditions and dangerous occurrences"},{"topic":"Safety duties & committees","page":"Safety p. 2","q":"What must employees do with provided protective equipment?","options":["Modify it for comfort without permission","Use it only during inspections","Lend it to visitors indefinitely","Use it correctly as instructed"],"answer":3,"why":"Employees must comply with safety procedures and make proper use of provided equipment.","id":602,"group":"Other safety","focus":false,"answerText":"Use it correctly as instructed"},{"topic":"Safety duties & committees","page":"Safety p. 2","q":"Which action breaches an employee safety duty?","options":["Reporting unsafe behaviour","Following safety training","Intentionally interfering with safety guards","Cooperating with investigations"],"answer":2,"why":"Employees must not intentionally interfere with or misuse safety provisions.","id":603,"group":"Other safety","focus":false,"answerText":"Intentionally interfering with safety guards"},{"topic":"Safety duties & committees","page":"Safety p. 2","q":"Why does the HSW Act cover members of the public?","options":["Work activities can also harm non-employees","Only employees suffer occupational injuries","All visitors must be employed by the site","Public access always removes employer duties"],"answer":0,"why":"Safety duties may extend to people affected by work, not just employees.","id":604,"group":"Other safety","focus":false,"answerText":"Work activities can also harm non-employees"},{"topic":"Work equipment & PPE","page":"Safety p. 3","q":"What must match the task when selecting work equipment?","options":["The operator’s preferred brand","Equipment design and suitability","The oldest available instruction book","Equipment paint colour"],"answer":1,"why":"Work equipment must be suitable for the actual work.","id":605,"group":"Other safety","focus":false,"answerText":"Equipment design and suitability"},{"topic":"Work equipment & PPE","page":"Safety p. 3","q":"What is a common danger from exposed transmission parts?","options":["Improved machine lubrication","Reduced shaft speed automatically","Increased supply voltage","Entanglement in moving machinery"],"answer":3,"why":"Moving transmission elements can trap clothing or body parts.","id":606,"group":"Other safety","focus":false,"answerText":"Entanglement in moving machinery"},{"topic":"Work equipment & PPE","page":"Safety p. 3","q":"Which device reduces contact with dangerous rotating parts?","options":["A larger workbench","A longer extension cable","A painted warning line alone","A suitable machine guard"],"answer":3,"why":"Machine guarding reduces access to dangerous moving components.","id":607,"group":"Other safety","focus":false,"answerText":"A suitable machine guard"},{"topic":"Work equipment & PPE","page":"Safety p. 3","q":"What can flying fragments from machinery cause?","options":["Improved cutting accuracy","Reduced workplace noise","Automatic machine isolation","Impact injuries"],"answer":3,"why":"Ejected material can strike people, requiring guarding or other controls.","id":608,"group":"Other safety","focus":false,"answerText":"Impact injuries"},{"topic":"Work equipment & PPE","page":"Safety p. 3","q":"Why must hand tools be maintained?","options":["Clean handles make tools stronger than new","Defects can create hazards during use","Maintenance removes the need for PPE","Damaged tools always work faster"],"answer":1,"why":"The manual identifies maintenance of tools and equipment as a safety requirement.","id":609,"group":"Other safety","focus":false,"answerText":"Defects can create hazards during use"},{"topic":"Work equipment & PPE","page":"Safety p. 3","q":"Which hazard can be caused by very hot surfaces?","options":["Burns from contact","Decreased bearing friction","Reduced electrical resistance only","Improved ventilation"],"answer":0,"why":"Hot equipment can cause contact burns.","id":610,"group":"Other safety","focus":false,"answerText":"Burns from contact"},{"topic":"Work equipment & PPE","page":"Safety p. 3","q":"What should prevent unintended machine operation?","options":["Removing the nameplate","Suitable controls and isolation arrangements","Turning the warning sign backwards","Placing a cloth over the switch"],"answer":1,"why":"Equipment should not start accidentally or after uncontrolled power restoration.","id":611,"group":"Other safety","focus":false,"answerText":"Suitable controls and isolation arrangements"},{"topic":"Work equipment & PPE","page":"Safety p. 4","q":"What is the purpose of an emergency-stop control?","options":["Replace every machine guard","Adjust the production speed","Bring machinery to a safe condition quickly","Increase motor torque"],"answer":2,"why":"Emergency stopping controls aim to halt dangerous movement as quickly as required.","id":612,"group":"Other safety","focus":false,"answerText":"Bring machinery to a safe condition quickly"},{"topic":"Work equipment & PPE","page":"Safety p. 4","q":"Where should emergency-stop controls be located?","options":["Behind fixed machinery guards","Inside a locked remote office","Where operators can reach them in an emergency","Only at the workshop entrance"],"answer":2,"why":"Controls must be accessible for intended emergency use.","id":613,"group":"Other safety","focus":false,"answerText":"Where operators can reach them in an emergency"},{"topic":"Work equipment & PPE","page":"Safety p. 4","q":"What does isolation separate equipment from?","options":["The equipment identification number","Its maintenance history","Its sources of energy","Its manufacturer’s records"],"answer":2,"why":"Isolation prevents dangerous energy from reaching equipment during work.","id":614,"group":"Other safety","focus":false,"answerText":"Its sources of energy"},{"topic":"Work equipment & PPE","page":"Safety p. 4","q":"Which is a possible means of electrical isolation?","options":["The pilot light alone","A suitable lockable isolating switch","A ventilation shutter","An ordinary painted label"],"answer":1,"why":"Approved isolating devices separate equipment from the supply.","id":615,"group":"Other safety","focus":false,"answerText":"A suitable lockable isolating switch"},{"topic":"Work equipment & PPE","page":"Safety p. 4","q":"Why should floor-mounted equipment be secured?","options":["To reduce toolbox sizes","To eliminate all vibration","To prevent movement or overturning","To increase the electrical supply"],"answer":2,"why":"Unsecured equipment may become unstable or move during operation.","id":616,"group":"Other safety","focus":false,"answerText":"To prevent movement or overturning"},{"topic":"Work equipment & PPE","page":"Safety p. 4","q":"Why is suitable workplace lighting necessary?","options":["It prevents every mechanical failure","It replaces equipment isolation","It removes the need for eye protection","It makes work and hazards clearly visible"],"answer":3,"why":"Lighting supports safe working and clear visibility.","id":617,"group":"Other safety","focus":false,"answerText":"It makes work and hazards clearly visible"},{"topic":"Work equipment & PPE","page":"Safety p. 4","q":"What must a warning sign be?","options":["Small enough to hide behind tools","Clear and unambiguous","Written only in technical abbreviations","Used instead of all safety precautions"],"answer":1,"why":"Warnings must be understandable and unambiguous.","id":618,"group":"Other safety","focus":false,"answerText":"Clear and unambiguous"},{"topic":"Work equipment & PPE","page":"Safety p. 5","q":"Which workplace factor reduces heat and airborne contamination?","options":["Increasing noise levels","Adequate ventilation","Unsecured ladders","Narrower access routes"],"answer":1,"why":"Ventilation helps maintain a suitable working environment.","id":619,"group":"Other safety","focus":false,"answerText":"Adequate ventilation"},{"topic":"Work equipment & PPE","page":"Safety p. 5","q":"What should workplace traffic routes be?","options":["Shared with unsecured materials","Blocked during busy shifts","Lit only at closing time","Clearly marked and wide enough"],"answer":3,"why":"Traffic routes must be safe and appropriate for people and vehicles.","id":620,"group":"Other safety","focus":false,"answerText":"Clearly marked and wide enough"},{"topic":"Work equipment & PPE","page":"Safety p. 5","q":"What should sanitary workplace provisions include?","options":["Toilets and washing facilities","Only fire hydrants","Only loading ramps","Only workshop lockers"],"answer":0,"why":"The manual lists toilets, washing and changing facilities.","id":621,"group":"Other safety","focus":false,"answerText":"Toilets and washing facilities"},{"topic":"Work equipment & PPE","page":"Safety p. 5","q":"Who is responsible for assessing PPE suitability?","options":["The equipment supplier alone","Only the PPE manufacturer","Only the employee’s friend","The employer"],"answer":3,"why":"The employer must assess the risks and select suitable PPE.","id":622,"group":"Other safety","focus":false,"answerText":"The employer"},{"topic":"Work equipment & PPE","page":"Safety p. 5","q":"What should employers provide about PPE use?","options":["Only an invoice","Information, instruction and training","Only a colour chart","No guidance if PPE is new"],"answer":1,"why":"The employer must ensure PPE users are instructed and trained.","id":623,"group":"Other safety","focus":false,"answerText":"Information, instruction and training"},{"topic":"Work equipment & PPE","page":"Safety p. 5","q":"What must be done with damaged PPE?","options":["Continue using it until it breaks","Share it with someone else","Hide the damage beneath tape","Maintain or replace it"],"answer":3,"why":"PPE must be maintained and suitable for its intended protective purpose.","id":624,"group":"Other safety","focus":false,"answerText":"Maintain or replace it"},{"topic":"Work equipment & PPE","page":"Safety p. 5","q":"Which item belongs to housekeeping?","options":["Removal of waste materials","Disabling emergency lighting","Increasing solvent storage","Leaving tools in escape routes"],"answer":0,"why":"Waste disposal and removal of obstructions form part of housekeeping.","id":625,"group":"Other safety","focus":false,"answerText":"Removal of waste materials"},{"topic":"Work equipment & PPE","page":"Safety p. 6","q":"Which protects eyes against flying particles?","options":["Safety goggles or suitable spectacles","Ear defenders","A dust apron","Leather work boots"],"answer":0,"why":"Eye protection is used against flying objects and impact hazards.","id":626,"group":"Other safety","focus":false,"answerText":"Safety goggles or suitable spectacles"},{"topic":"Work equipment & PPE","page":"Safety p. 6","q":"Which protects the face from suitable splash hazards?","options":["A lifting eye-bolt","An ear plug","A toe cap","A face shield"],"answer":3,"why":"Face shields offer face coverage when appropriate.","id":627,"group":"Other safety","focus":false,"answerText":"A face shield"},{"topic":"Work equipment & PPE","page":"Safety p. 6","q":"What type of PPE reduces inhalation exposure?","options":["Suitable respiratory protection","Cotton wrist bands","Steel toe caps","A hard hat"],"answer":0,"why":"Respiratory PPE is selected for inhalation hazards.","id":628,"group":"Other safety","focus":false,"answerText":"Suitable respiratory protection"},{"topic":"Work equipment & PPE","page":"Safety p. 6","q":"What do steel toe caps protect?","options":["Ears against vibration","Eyes against dust","Toes against impact or compression","Hands against chemical splashes"],"answer":2,"why":"Toe-capped safety footwear protects against specified toe injuries.","id":629,"group":"Other safety","focus":false,"answerText":"Toes against impact or compression"},{"topic":"Work equipment & PPE","page":"Safety p. 6","q":"What does a bump or impact safety helmet protect?","options":["The hand against heat","The head against specified impact hazards","The chest against solvents","The lungs against fumes"],"answer":1,"why":"Head protection limits injuries from falling or striking objects.","id":630,"group":"Other safety","focus":false,"answerText":"The head against specified impact hazards"},{"topic":"Work equipment & PPE","page":"Safety p. 6","q":"What is an example of protective body clothing?","options":["A threaded union","Coveralls or aprons","A machine pulley","A portable voltmeter"],"answer":1,"why":"The manual lists coveralls, overalls and aprons for body protection.","id":631,"group":"Other safety","focus":false,"answerText":"Coveralls or aprons"},{"topic":"Work equipment & PPE","page":"Safety p. 6","q":"Why must gloves match the task?","options":["Different hazards require different glove materials","Gloves cannot affect machine safety","Thicker gloves always protect against electricity","All glove types resist all chemicals"],"answer":0,"why":"Gloves should suit specific heat, chemical, abrasion and other hazards.","id":632,"group":"Other safety","focus":false,"answerText":"Different hazards require different glove materials"},{"topic":"Manual handling & noise","page":"Safety p. 7","q":"What is the first preferred control for hazardous manual handling?","options":["Lift faster to reduce time","Avoid the hazardous handling where reasonably practicable","Work without an assessment","Use more physical strength"],"answer":1,"why":"The first priority is avoiding hazardous manual handling where practicable.","id":633,"group":"Other safety","focus":false,"answerText":"Avoid the hazardous handling where reasonably practicable"},{"topic":"Manual handling & noise","page":"Safety p. 7","q":"If manual lifting cannot be avoided, what is next?","options":["Increase the load weight","Ask the worker to rush","Assess the handling task","Reduce the number of helpers"],"answer":2,"why":"Unavoidable manual handling needs risk assessment.","id":634,"group":"Other safety","focus":false,"answerText":"Assess the handling task"},{"topic":"Manual handling & noise","page":"Safety p. 7","q":"Which factor affects manual lifting risk?","options":["Only the operator’s height","The age of the equipment label","Only the load colour","Load weight, shape and grip"],"answer":3,"why":"Task load and working conditions affect handling risk.","id":635,"group":"Other safety","focus":false,"answerText":"Load weight, shape and grip"},{"topic":"Manual handling & noise","page":"Safety p. 7","q":"What should determine whether help is needed?","options":["Only the supervisor’s preferred pace","A universal belief that every worker can lift 25 kg","A risk assessment of the task","The number on the pallet label"],"answer":2,"why":"The manual stresses handling assessments rather than one safe weight for everyone.","id":636,"group":"Other safety","focus":false,"answerText":"A risk assessment of the task"},{"topic":"Manual handling & noise","page":"Safety p. 7","q":"What can reduce manual lifting risk?","options":["Mechanical lifting aids","Carrying loads above eye level","Longer unsupported reaches","Greater twisting during lifting"],"answer":0,"why":"Mechanical aids may reduce physical demands.","id":637,"group":"Other safety","focus":false,"answerText":"Mechanical lifting aids"},{"topic":"Manual handling & noise","page":"Safety p. 8","q":"What should be done before lifting a load?","options":["Twist the trunk to build momentum","Hold the load far from the body","Lift without checking grip","Plan the lift and route"],"answer":3,"why":"The manual begins with “Stop and think”.","id":638,"group":"Other safety","focus":false,"answerText":"Plan the lift and route"},{"topic":"Manual handling & noise","page":"Safety p. 8","q":"Why keep feet apart when lifting?","options":["To make turning faster","To prevent all back pain","To maintain a stable base","To increase the distance to the load"],"answer":2,"why":"Feet apart improve balance and stability.","id":639,"group":"Other safety","focus":false,"answerText":"To maintain a stable base"},{"topic":"Manual handling & noise","page":"Safety p. 8","q":"How should the back be positioned during a controlled lift?","options":["Stable and aligned with the task","Unsupported while jerking","Bent into an extreme curve","Twisted sharply during pickup"],"answer":0,"why":"The manual recommends a good posture and avoiding back twisting.","id":640,"group":"Other safety","focus":false,"answerText":"Stable and aligned with the task"},{"topic":"Manual handling & noise","page":"Safety p. 8","q":"Where should the load be held during lifting?","options":["Behind the upper back","Directly above the head","At full arm’s length","As close to the body as practical"],"answer":3,"why":"Holding the load close reduces strain and leverage on the back.","id":641,"group":"Other safety","focus":false,"answerText":"As close to the body as practical"},{"topic":"Manual handling & noise","page":"Safety p. 8","q":"What should you avoid when changing direction with a load?","options":["Using assistance","Twisting the trunk under load","Planning the route","Moving the feet"],"answer":1,"why":"Move feet to change direction rather than twisting the body.","id":642,"group":"Other safety","focus":false,"answerText":"Twisting the trunk under load"},{"topic":"Manual handling & noise","page":"Safety p. 8","q":"How should a load be raised?","options":["With the elbows locked overhead","By rotating the spine sharply","Smoothly without sudden jerks","With one sudden snatch"],"answer":2,"why":"The manual explicitly states “Don’t jerk”.","id":643,"group":"Other safety","focus":false,"answerText":"Smoothly without sudden jerks"},{"topic":"Manual handling & noise","page":"Safety p. 8","q":"Which grip is recommended when possible?","options":["A secure grip using both hands","One fingertip if the load is heavy","An unstable open-palmed grip","Holding only with wrists"],"answer":0,"why":"A secure two-handed grip gives more control.","id":644,"group":"Other safety","focus":false,"answerText":"A secure grip using both hands"},{"topic":"Manual handling & noise","page":"Safety p. 9","q":"How should a load normally be put down?","options":["By twisting at the waist","By dropping it as quickly as possible","By reversing the lifting procedure","By throwing it onto a pallet"],"answer":2,"why":"Lowering should be controlled and follows the reverse of the lift.","id":645,"group":"Other safety","focus":false,"answerText":"By reversing the lifting procedure"},{"topic":"Manual handling & noise","page":"Safety p. 9","q":"What is a trolley useful for?","options":["Detecting electrical faults","Moving loads horizontally","Increasing noise output","Testing gas cylinders"],"answer":1,"why":"Trolleys reduce the effort of moving loads on a level route.","id":646,"group":"Other safety","focus":false,"answerText":"Moving loads horizontally"},{"topic":"Manual handling & noise","page":"Safety p. 9","q":"Which device helps position a suspended load?","options":["A fixed fuse","A gas regulator only","A suitable hoist","A welding electrode"],"answer":2,"why":"Hand- or power-operated hoists may lift or support loads for positioning.","id":647,"group":"Other safety","focus":false,"answerText":"A suitable hoist"},{"topic":"Manual handling & noise","page":"Safety p. 9","q":"What can help lift loads that are difficult to grasp?","options":["A soldering iron","Hand-held hooks or suction pads","A thread-cutting tap","A larger spanner"],"answer":1,"why":"The manual names hooks and suction pads for difficult-to-grasp loads.","id":648,"group":"Other safety","focus":false,"answerText":"Hand-held hooks or suction pads"},{"topic":"Manual handling & noise","page":"Safety p. 9","q":"What two factors determine workplace noise exposure risk?","options":["Load temperature and speed","Only the machine colour","Sound level and exposure duration","Only the worker’s age"],"answer":2,"why":"Noise harm depends on how loud the noise is and how long exposure continues.","id":649,"group":"Other safety","focus":false,"answerText":"Sound level and exposure duration"},{"topic":"Manual handling & noise","page":"Safety p. 9","q":"What is the manual’s first noise action level?","options":["85 dB(A)","90 dB(A)","70 dB(A)","140 dB(A)"],"answer":0,"why":"The manual lists 85 dB(A) as its first action level; it is a historical manual value.","id":650,"group":"Other safety","focus":false,"answerText":"85 dB(A)"},{"topic":"Manual handling & noise","page":"Safety p. 9","q":"What is the manual’s second noise action level?","options":["90 dB(A)","85 dB(A)","140 dB(A)","80 dB(A)"],"answer":0,"why":"The manual lists 90 dB(A) as its second action level; current rules may differ.","id":651,"group":"Other safety","focus":false,"answerText":"90 dB(A)"},{"topic":"Manual handling & noise","page":"Safety p. 9","q":"What is the manual’s peak noise action level?","options":["81 dB(A)","108 dB(A)","93 dB(A)","140 dB(A)"],"answer":3,"why":"The manual gives 140 dB(A) as its peak action level.","id":652,"group":"Other safety","focus":false,"answerText":"140 dB(A)"},{"topic":"Manual handling & noise","page":"Safety p. 9","q":"Which listed machine produces about 108 dB(A)?","options":["Sheet-metal shop","Electric drill","Domestic food blender","Hand grinding metal"],"answer":3,"why":"The manual’s example table lists hand grinding metal at 108 dB(A).","id":653,"group":"Other safety","focus":false,"answerText":"Hand grinding metal"},{"topic":"Manual handling & noise","page":"Safety p. 9","q":"Which listed activity is approximately 102 dB(A)?","options":["Sheet-metal shop work","Electric drilling","Food blending","Chain saw operation"],"answer":3,"why":"The noise table gives chain saw = 102 dB(A).","id":654,"group":"Other safety","focus":false,"answerText":"Chain saw operation"},{"topic":"Manual handling & noise","page":"Safety p. 9","q":"Which listed source is approximately 87 dB(A)?","options":["Electric drill","Circular saw","Chain saw","Jet aircraft at 25 m"],"answer":0,"why":"The table gives an electric drill as 87 dB(A).","id":655,"group":"Other safety","focus":false,"answerText":"Electric drill"},{"topic":"Electrical safety","page":"Safety p. 10","q":"Why should electricity be treated with respect?","options":["It cannot cause fires","It can injure even when it cannot be seen","It is always visible before contact","It is safe whenever the light is off"],"answer":1,"why":"Electricity can cause shock, burns, arc hazards and fire.","id":656,"group":"Other safety","focus":false,"answerText":"It can injure even when it cannot be seen"},{"topic":"Electrical safety","page":"Safety p. 10","q":"What causes an electric burn?","options":["Heating as current passes through tissue","Low room temperature","Ordinary mechanical vibration","Noise from a motor"],"answer":0,"why":"Electrical current can heat and injure body tissue.","id":657,"group":"Other safety","focus":false,"answerText":"Heating as current passes through tissue"},{"topic":"Electrical safety","page":"Safety p. 10","q":"What is a common electrical fire cause?","options":["A correctly isolated device","Clean protective equipment","Properly fitted guards","Overheated cables or electrical equipment"],"answer":3,"why":"Overheating and faults may ignite surrounding material.","id":658,"group":"Other safety","focus":false,"answerText":"Overheated cables or electrical equipment"},{"topic":"Electrical safety","page":"Safety p. 10","q":"What can make electrical injury more likely?","options":["Effective isolation","Proper cable protection","Correct plug wiring","Damaged conductor insulation"],"answer":3,"why":"Damaged insulation increases the possibility of contact.","id":659,"group":"Other safety","focus":false,"answerText":"Damaged conductor insulation"},{"topic":"Electrical safety","page":"Safety p. 10","q":"Which electrical risk can cause severe external burns?","options":["Electric arc","Correct earthing","A good earth bond","Safe isolation"],"answer":0,"why":"An electric arc can release intense heat and radiation.","id":660,"group":"Other safety","focus":false,"answerText":"Electric arc"},{"topic":"Electrical safety","page":"Safety p. 11","q":"What is the purpose of double insulation?","options":["Replace all switches","Increase earth-fault current intentionally","Increase power consumption","Reduce contact with dangerous live parts"],"answer":3,"why":"The manual explains two layers of protective insulation.","id":661,"group":"Other safety","focus":false,"answerText":"Reduce contact with dangerous live parts"},{"topic":"Electrical safety","page":"Safety p. 11","q":"What protective device uses a test button to check operation?","options":["A spanner","RCD","Mechanical relay contact only","Plain fuse wire"],"answer":1,"why":"The manual calls for checking an RCD by operating its test button.","id":662,"group":"Other safety","focus":false,"answerText":"RCD"},{"topic":"Electrical safety","page":"Safety p. 11","q":"What does RCD stand for?","options":["Remote Control Diode","Rotating Current Distributor","Residual Current Device","Rated Circuit Divider"],"answer":2,"why":"RCD detects an imbalance between current paths and disconnects when necessary.","id":663,"group":"Other safety","focus":false,"answerText":"Residual Current Device"},{"topic":"Electrical safety","page":"Safety p. 11","q":"What should earthing help do during a fault?","options":["Overheat the tool deliberately","Keep exposed metal permanently live","Operate protective disconnection","Increase the user’s shock current"],"answer":2,"why":"A protective earth provides a fault path so protection can clear a fault.","id":664,"group":"Other safety","focus":false,"answerText":"Operate protective disconnection"},{"topic":"Electrical safety","page":"Safety p. 11","q":"Which reduced supply is mentioned for portable tools?","options":["110 volts","12,000 volts","0 volts only","415 kilovolts"],"answer":0,"why":"The manual discusses 110 V reduced-voltage systems in construction settings.","id":665,"group":"Other safety","focus":false,"answerText":"110 volts"},{"topic":"Electrical safety","page":"Safety p. 12","q":"What completes a dangerous shock circuit through a person?","options":["A fully enclosed conductor","A conductive path between different potentials","A correctly isolated circuit","A plastic handle held correctly"],"answer":1,"why":"Current passes through the body when a conducting path completes the circuit.","id":666,"group":"Other safety","focus":false,"answerText":"A conductive path between different potentials"},{"topic":"Electrical safety","page":"Safety p. 12","q":"What often increases electric shock risk?","options":["Disconnected supplies","Dry insulating footwear","Correct protective barriers","Wet conditions"],"answer":3,"why":"Moisture can reduce skin resistance and increase shock risk.","id":667,"group":"Other safety","focus":false,"answerText":"Wet conditions"},{"topic":"Electrical safety","page":"Safety p. 12","q":"Why are metal tools risky near live wiring?","options":["They conduct electrical current","They stop circuit current at once","They automatically become insulators","They neutralise voltage"],"answer":0,"why":"Most metal tools are electrical conductors.","id":668,"group":"Other safety","focus":false,"answerText":"They conduct electrical current"},{"topic":"Electrical safety","page":"Safety p. 12","q":"What must you avoid touching during electric shock rescue?","options":["A suitably tested isolator","A casualty still in contact with a live supply","A dry nonconductive barrier","An isolated emergency stop button"],"answer":1,"why":"Direct contact can put the rescuer in the electrical circuit.","id":669,"group":"Other safety","focus":false,"answerText":"A casualty still in contact with a live supply"},{"topic":"Electrical safety","page":"Safety p. 12","q":"Which part of the body may be disrupted by electric shock?","options":["Only the fingernails","Only the hair follicles","The heart and its rhythm","Only the outer clothing"],"answer":2,"why":"Electrical current can disrupt vital functions including the heart.","id":670,"group":"Other safety","focus":false,"answerText":"The heart and its rhythm"},{"topic":"Electrical safety","page":"Safety p. 13","q":"What is the first action for a person in contact with live electricity?","options":["Pull the person by bare hands","Apply water to the conductor","Disconnect the electrical supply safely","Begin working on the switchgear while live"],"answer":2,"why":"The supply must be made safe before touching the casualty.","id":671,"group":"Other safety","focus":false,"answerText":"Disconnect the electrical supply safely"},{"topic":"Electrical safety","page":"Safety p. 13","q":"Who should perform rescue breathing or CPR when needed?","options":["Only the equipment supplier","Anyone without instruction using any technique","A trained person following emergency guidance","Only a machine operator who is still working"],"answer":2,"why":"The manual calls for emergency aid and medical assistance; follow current first-aid training.","id":672,"group":"Other safety","focus":false,"answerText":"A trained person following emergency guidance"},{"topic":"Electrical safety","page":"Safety p. 13","q":"In the manual’s plug colour code, brown is:","options":["Neutral","Live","Protective bonding only","Earth"],"answer":1,"why":"The diagram labels brown as live.","id":673,"group":"Other safety","focus":false,"answerText":"Live"},{"topic":"Electrical safety","page":"Safety p. 13","q":"In the manual’s plug colour code, blue is:","options":["Earth","Neutral","Pilot signal only","Live"],"answer":1,"why":"The plug wiring illustration labels blue as neutral.","id":674,"group":"Other safety","focus":false,"answerText":"Neutral"},{"topic":"Electrical safety","page":"Safety p. 13","q":"In the manual’s plug colour code, green/yellow is:","options":["Live","Fuse rating","Earth","Neutral"],"answer":2,"why":"The plug wiring illustration labels green/yellow as the protective earth.","id":675,"group":"Other safety","focus":false,"answerText":"Earth"},{"topic":"Electrical safety","page":"Safety p. 13","q":"What is required when replacing a fuse?","options":["Any wire that fits","Correct type and rating","Copper cable instead of a fuse","A larger rating to stop trips"],"answer":1,"why":"A fuse must be correctly rated; never improvise fuse wire.","id":676,"group":"Other safety","focus":false,"answerText":"Correct type and rating"},{"topic":"Electrical safety","page":"Safety p. 13","q":"Which cord condition warrants removing a tool from service?","options":["Damaged insulation or exposed conductors","An intact moulded plug","A properly protected cable","A visible manufacturer’s label"],"answer":0,"why":"Defective cables create shock and fire hazards.","id":677,"group":"Other safety","focus":false,"answerText":"Damaged insulation or exposed conductors"},{"topic":"Electrical safety","page":"Safety p. 13","q":"What must be done before power-tool maintenance?","options":["Remove every guard while running","Leave it energised for convenience","Disconnect from the mains supply","Short the terminals together"],"answer":2,"why":"The manual requires disconnection before adjustment and repair.","id":678,"group":"Other safety","focus":false,"answerText":"Disconnect from the mains supply"},{"topic":"Safety signs & colour codes","page":"Safety p. 14","q":"Which colour means a mandatory action?","options":["Blue","Red","Green","Yellow"],"answer":0,"why":"The manual assigns blue to mandatory instructions.","id":679,"group":"Other safety","focus":false,"answerText":"Blue"},{"topic":"Safety signs & colour codes","page":"Safety p. 14","q":"Which colour identifies a first-aid sign?","options":["Black","Green","Yellow","Blue"],"answer":1,"why":"Green marks safe conditions, first aid and exits.","id":680,"group":"Other safety","focus":false,"answerText":"Green"},{"topic":"Safety signs & colour codes","page":"Safety p. 14","q":"Which colour typically identifies a hazard warning?","options":["Blue","Yellow","Green","White only"],"answer":1,"why":"Yellow means warning or risk of danger.","id":681,"group":"Other safety","focus":false,"answerText":"Yellow"},{"topic":"Safety signs & colour codes","page":"Safety p. 14","q":"Which colour identifies prohibition?","options":["Blue","Green","Red","Orange"],"answer":2,"why":"The manual gives red for prohibition signs and fire equipment.","id":682,"group":"Other safety","focus":false,"answerText":"Red"},{"topic":"Safety signs & colour codes","page":"Safety p. 14","q":"What does a no-smoking sign communicate?","options":["A safe condition","A prohibited action","An emergency exit","A mandatory action"],"answer":1,"why":"No-smoking is a prohibition sign.","id":683,"group":"Other safety","focus":false,"answerText":"A prohibited action"},{"topic":"Safety signs & colour codes","page":"Safety p. 14","q":"Which shape and colour combination generally marks a warning?","options":["Blue circle","Green rectangle","Red circle with a diagonal bar","Yellow triangle"],"answer":3,"why":"Warning signs are typically yellow triangles.","id":684,"group":"Other safety","focus":false,"answerText":"Yellow triangle"},{"topic":"Safety signs & colour codes","page":"Safety p. 14","q":"Which shape is commonly used for mandatory PPE signs?","options":["Green triangle","Red square","Blue circle","Yellow triangle"],"answer":2,"why":"Blue circular signs indicate mandatory actions such as wearing protection.","id":685,"group":"Other safety","focus":false,"answerText":"Blue circle"},{"topic":"Safety signs & colour codes","page":"Safety p. 14","q":"What do fire equipment signs commonly identify?","options":["Compressed-air pressure only","Safe lifting limits","Personal lockers","Extinguishers and fire alarm points"],"answer":3,"why":"Red fire equipment signs identify firefighting resources.","id":686,"group":"Other safety","focus":false,"answerText":"Extinguishers and fire alarm points"},{"topic":"Safety signs & colour codes","page":"Safety p. 15","q":"Which manual extinguisher colour is paired with CO₂?","options":["French blue","Pale cream","Black","Signal red"],"answer":2,"why":"The manual lists carbon dioxide extinguishers as black.","id":687,"group":"Fire & extinguishers","focus":true,"answerText":"Black"},{"topic":"Safety signs & colour codes","page":"Safety p. 15","q":"Which gas is labelled maroon in the manual?","options":["Acetylene","Argon","Nitrogen","Oxygen"],"answer":0,"why":"The cylinder chart lists acetylene as maroon.","id":688,"group":"Gas cylinders & codes","focus":true,"answerText":"Acetylene"},{"topic":"Safety signs & colour codes","page":"Safety p. 15","q":"Which gas is identified as peacock blue?","options":["Argon","Air","Propane","Hydrogen"],"answer":0,"why":"The manual lists argon as peacock blue.","id":689,"group":"Gas cylinders & codes","focus":true,"answerText":"Argon"},{"topic":"Safety signs & colour codes","page":"Safety p. 15","q":"Which gas uses French grey with a black band?","options":["Argon","Air","Carbon dioxide","Nitrogen"],"answer":3,"why":"The manual explicitly lists nitrogen as French grey with a black band.","id":690,"group":"Gas cylinders & codes","focus":true,"answerText":"Nitrogen"},{"topic":"Safety signs & colour codes","page":"Safety p. 15","q":"Which gas shares a black code with carbon dioxide?","options":["Argon","Hydrogen","Oxygen","Acetylene"],"answer":2,"why":"Oxygen and CO₂ are both listed as black in the manual.","id":691,"group":"Gas cylinders & codes","focus":true,"answerText":"Oxygen"},{"topic":"Safety signs & colour codes","page":"Safety p. 15","q":"Which two gases use signal red in the manual?","options":["Argon and acetylene","Hydrogen and propane","Oxygen and carbon dioxide","Air and nitrogen"],"answer":1,"why":"The cylinder table lists hydrogen and propane as signal red.","id":692,"group":"Gas cylinders & codes","focus":true,"answerText":"Hydrogen and propane"},{"topic":"Safety signs & colour codes","page":"Safety p. 15","q":"What must be checked before using a gas cylinder?","options":["Only its cylinder weight","Gas identity and safe operating procedures","Only its paint shade","Only its transport vehicle"],"answer":1,"why":"The manual calls for understanding gas properties and correct procedures.","id":693,"group":"Gas cylinders & codes","focus":true,"answerText":"Gas identity and safe operating procedures"},{"topic":"Safety signs & colour codes","page":"Safety p. 15","q":"What is the usual condition of gas inside an industrial cylinder?","options":["Always frozen solid","Always at zero gauge pressure","Stored at high pressure","Always at atmospheric pressure"],"answer":2,"why":"The manual states industrial cylinders contain gases at high pressure.","id":694,"group":"Gas cylinders & codes","focus":true,"answerText":"Stored at high pressure"},{"topic":"Fire prevention & firefighting","page":"Safety p. 16","q":"What chemical process is central to ordinary combustion?","options":["Permanent freezing","Evaporation without heat","Reaction with oxygen","Neutralisation with salt"],"answer":2,"why":"The manual describes fuel reacting with oxygen and producing heat.","id":695,"group":"Fire & extinguishers","focus":true,"answerText":"Reaction with oxygen"},{"topic":"Fire prevention & firefighting","page":"Safety p. 16","q":"What is one fire hazard from damaged wiring?","options":["Electrical overheating or sparking","Increased metal hardness","Improved insulation","Reduced ignition risk"],"answer":0,"why":"Damaged and overloaded circuits are possible ignition sources.","id":696,"group":"Fire & extinguishers","focus":true,"answerText":"Electrical overheating or sparking"},{"topic":"Fire prevention & firefighting","page":"Safety p. 16","q":"Why are oil-soaked rags a fire concern?","options":["They may ignite or contribute to combustion","They eliminate oxygen","They make fire extinguishers heavier","They cool every surface"],"answer":0,"why":"The manual lists oil-soaked rags among fire hazards and calls for correct disposal.","id":697,"group":"Fire & extinguishers","focus":true,"answerText":"They may ignite or contribute to combustion"},{"topic":"Fire prevention & firefighting","page":"Safety p. 16","q":"Why should combustible material be kept away from heaters?","options":["It prevents all sparks","It improves air quality automatically","Heat may ignite it","It reduces the extinguisher pressure"],"answer":2,"why":"Separation of fuel and heat sources reduces ignition risk.","id":698,"group":"Fire & extinguishers","focus":true,"answerText":"Heat may ignite it"},{"topic":"Fire prevention & firefighting","page":"Safety p. 16","q":"What should be removed before welding near flammable materials?","options":["Only safety notices","The flammable materials where practicable","All machine identification plates","Every mechanical fastener"],"answer":1,"why":"Hot work requires preventing ignition of adjacent combustibles.","id":699,"group":"Fire & extinguishers","focus":true,"answerText":"The flammable materials where practicable"},{"topic":"Fire prevention & firefighting","page":"Safety p. 16","q":"What is a good first step in fire prevention?","options":["Block fresh-air exits","Wait until smoke becomes visible","Prevent a fire from starting","Use water on all flames"],"answer":2,"why":"The manual says the best prevention is to stop a fire starting.","id":700,"group":"Fire & extinguishers","focus":true,"answerText":"Prevent a fire from starting"},{"topic":"Fire prevention & firefighting","page":"Safety p. 17","q":"What should never be stored in front of fire exits?","options":["Obstructions and materials","Clearly marked escape plans","Approved lighting","Emergency exit signs"],"answer":0,"why":"Escape routes must be kept clear.","id":701,"group":"Fire & extinguishers","focus":true,"answerText":"Obstructions and materials"},{"topic":"Fire prevention & firefighting","page":"Safety p. 17","q":"How should fire-resisting doors normally be maintained?","options":["Used to store containers","Closed unless approved systems hold them open","Wedged open for convenience","Painted over their closing mechanisms"],"answer":1,"why":"Fire doors must not be wedged open against safety requirements.","id":702,"group":"Fire & extinguishers","focus":true,"answerText":"Closed unless approved systems hold them open"},{"topic":"Fire prevention & firefighting","page":"Safety p. 17","q":"What must be checked about portable extinguishers?","options":["Whether they are decorative","Only the body colour","Only their purchase date","Correct type, availability and service condition"],"answer":3,"why":"The manual calls for sufficient correct extinguishers kept and maintained properly.","id":703,"group":"Fire & extinguishers","focus":true,"answerText":"Correct type, availability and service condition"},{"topic":"Fire prevention & firefighting","page":"Safety p. 17","q":"What should new employees understand in a fire drill?","options":["How to disable alarms","How to respond and evacuate","How to store flammable chemicals near heaters","How to increase production speed"],"answer":1,"why":"A fire drill familiarises personnel with emergency procedures.","id":704,"group":"Fire & extinguishers","focus":true,"answerText":"How to respond and evacuate"},{"topic":"Fire prevention & firefighting","page":"Safety p. 17","q":"According to the manual, how often should fire drills be practised?","options":["Only during company audits","Repeatedly, after instruction and training","Never, to avoid disruption","Only when a fire occurs"],"answer":1,"why":"The manual recommends repeated practice after initial drills.","id":705,"group":"Fire & extinguishers","focus":true,"answerText":"Repeatedly, after instruction and training"},{"topic":"Fire prevention & firefighting","page":"Safety p. 17","q":"Why should drills be announced in the manual’s discussion?","options":["To test equipment without people","To reduce panic and accidents","To close every escape route","To increase fire severity"],"answer":1,"why":"The manual states drills should always be announced to avoid panic and accidents.","id":706,"group":"Fire & extinguishers","focus":true,"answerText":"To reduce panic and accidents"},{"topic":"Fire prevention & firefighting","page":"Safety p. 17","q":"In the manual, emergency exit lighting must be:","options":["Available and unobstructed","Covered during maintenance","Disabled after office hours","Stored with combustible waste"],"answer":0,"why":"Escape facilities should remain accessible and operational.","id":707,"group":"Fire & extinguishers","focus":true,"answerText":"Available and unobstructed"},{"topic":"Fire prevention & firefighting","page":"Safety p. 18","q":"Which three elements form the fire triangle?","options":["Foam, sand and paint","Smoke, dust and vibration","Fuel, oxygen and heat","Carbon, nitrogen and water"],"answer":2,"why":"Combustion requires fuel, oxygen and sufficient heat.","id":708,"group":"Fire & extinguishers","focus":true,"answerText":"Fuel, oxygen and heat"},{"topic":"Fire prevention & firefighting","page":"Safety p. 18","q":"Removing fuel from a fire eliminates which element?","options":["Atmospheric pressure","The temperature gauge","Fire alarm sound","Combustible material"],"answer":3,"why":"The fuel element is the material being burned.","id":709,"group":"Fire & extinguishers","focus":true,"answerText":"Combustible material"},{"topic":"Fire prevention & firefighting","page":"Safety p. 18","q":"Which action interrupts the fire triangle by cooling?","options":["Adding oxygen","Increasing fuel","Increasing ventilation toward flames","Removing heat"],"answer":3,"why":"Cooling reduces temperature below that required for sustained combustion.","id":710,"group":"Fire & extinguishers","focus":true,"answerText":"Removing heat"},{"topic":"Fire prevention & firefighting","page":"Safety p. 18","q":"What does Class A describe in the manual?","options":["Pressurised steam","Cooking oil alone","Solid combustibles such as wood and paper","Flammable gases such as propane"],"answer":2,"why":"The manual defines Class A by solid combustible materials.","id":711,"group":"Fire & extinguishers","focus":true,"answerText":"Solid combustibles such as wood and paper"},{"topic":"Fire prevention & firefighting","page":"Safety p. 18","q":"What does Class B describe in the manual?","options":["Hot water","Flammable liquids","Combustible gases only","Wood and paper"],"answer":1,"why":"The manual gives oils, petrol, spirits and similar liquids as Class B.","id":712,"group":"Fire & extinguishers","focus":true,"answerText":"Flammable liquids"},{"topic":"Fire prevention & firefighting","page":"Safety p. 18","q":"What does Class C describe in the manual?","options":["Textile dust only","Water mist","Wood and paper","Flammable gases"],"answer":3,"why":"The manual identifies propane and butane as Class C gases.","id":713,"group":"Fire & extinguishers","focus":true,"answerText":"Flammable gases"},{"topic":"Fire prevention & firefighting","page":"Safety p. 18","q":"Which is an example of a Class C fuel?","options":["Paper","Wood","Petrol","Butane"],"answer":3,"why":"Butane is listed as a flammable-gas example.","id":714,"group":"Fire & extinguishers","focus":true,"answerText":"Butane"},{"topic":"Fire prevention & firefighting","page":"Safety p. 19","q":"Which extinguisher is primarily associated with Class A fires in the manual?","options":["Gas cylinder air","Unrated clean agent","Carbon dioxide","Water"],"answer":3,"why":"The manual associates water with ordinary solid combustibles.","id":715,"group":"Fire & extinguishers","focus":true,"answerText":"Water"},{"topic":"Fire prevention & firefighting","page":"Safety p. 19","q":"What does AFFF foam do on a flammable-liquid surface?","options":["Increases oxygen delivery","Forms a film that suppresses vapour release","Reacts to produce sparks","Makes the liquid electrically grounded"],"answer":1,"why":"Aqueous film-forming foam can form a protective film on suitable liquids.","id":716,"group":"Fire & extinguishers","focus":true,"answerText":"Forms a film that suppresses vapour release"},{"topic":"Fire prevention & firefighting","page":"Safety p. 19","q":"What is the manual’s dry-powder colour?","options":["Signal red","Black","French blue","Pale cream"],"answer":2,"why":"Dry powder is French blue in the manual’s historic colour chart.","id":717,"group":"Fire & extinguishers","focus":true,"answerText":"French blue"},{"topic":"Fire prevention & firefighting","page":"Safety p. 19","q":"Which agent can displace oxygen around a fire?","options":["Oxygen","Carbon dioxide","Liquid petrol","Compressed air"],"answer":1,"why":"CO₂ works partly by reducing local oxygen concentration.","id":718,"group":"Fire & extinguishers","focus":true,"answerText":"Carbon dioxide"},{"topic":"Fire prevention & firefighting","page":"Safety p. 19","q":"Which agent is listed as particularly unsuitable due to ozone effects?","options":["Foam","Halon","Water","Dry powder"],"answer":1,"why":"The manual says Halon is withdrawn due to ozone depletion concerns.","id":719,"group":"Fire & extinguishers","focus":true,"answerText":"Halon"},{"topic":"Fire prevention & firefighting","page":"Safety p. 19","q":"What is a disadvantage of CO₂ in occupied enclosed spaces?","options":["It always produces poisonous smoke","It adds oxygen to breathing air","It permanently freezes every surface","Possible oxygen displacement and asphyxiation"],"answer":3,"why":"CO₂ can displace breathable air; follow evacuation and site procedures.","id":720,"group":"Fire & extinguishers","focus":true,"answerText":"Possible oxygen displacement and asphyxiation"},{"topic":"Fire prevention & firefighting","page":"Safety p. 19","q":"Which fire-extinguisher medium offers fast flame knockdown across several classes?","options":["Cylinder air","Untreated water for all cases","Nitrogen used without rated equipment","Dry powder"],"answer":3,"why":"The manual describes powder as suitable for A, B, C and vehicle protection.","id":721,"group":"Fire & extinguishers","focus":true,"answerText":"Dry powder"},{"topic":"Fire prevention & firefighting","page":"Safety p. 19","q":"Which agent mainly cools ordinary solid fuel fires?","options":["Petrol vapour","Water","Compressed propane","Carbon dioxide gas"],"answer":1,"why":"Water removes heat from burning material.","id":722,"group":"Fire & extinguishers","focus":true,"answerText":"Water"},{"topic":"Accidents & safe working","page":"Safety p. 20","q":"What is a common cause of accidents involving tools?","options":["Using defective or unsuitable tools","Keeping aisles clear","Following work instructions","Inspecting tools before use"],"answer":0,"why":"Incorrect and damaged tools increase injury risk.","id":723,"group":"Other safety","focus":false,"answerText":"Using defective or unsuitable tools"},{"topic":"Accidents & safe working","page":"Safety p. 20","q":"What can fatigue contribute to?","options":["Automatic improvement in precision","Increased equipment guarding","Better emergency readiness","Reduced attention and accidents"],"answer":3,"why":"The manual lists fatigue among accident contributors.","id":724,"group":"Other safety","focus":false,"answerText":"Reduced attention and accidents"},{"topic":"Accidents & safe working","page":"Safety p. 20","q":"Which behaviour is unsafe near moving machines?","options":["Isolating before repair","Keeping access routes clear","Wearing loose clothing or jewellery","Using correct guards"],"answer":2,"why":"Loose items may be caught in moving machine parts.","id":725,"group":"Other safety","focus":false,"answerText":"Wearing loose clothing or jewellery"},{"topic":"Accidents & safe working","page":"Safety p. 20","q":"How can alcohol or drugs affect work safety?","options":["Improve emergency response","Increase concentration reliably","Impair judgement and coordination","Replace training"],"answer":2,"why":"The manual warns that these impair safe work.","id":726,"group":"Other safety","focus":false,"answerText":"Impair judgement and coordination"},{"topic":"Accidents & safe working","page":"Safety p. 20","q":"What should happen after observing unsafe machinery?","options":["Continue work to meet targets","Ask an untrained person to repair it live","Remove warning labels","Report and isolate it under the safe procedure"],"answer":3,"why":"Faults and dangerous equipment should be reported and made safe.","id":727,"group":"Other safety","focus":false,"answerText":"Report and isolate it under the safe procedure"},{"topic":"Accidents & safe working","page":"Safety p. 20","q":"Which condition can lead to slips and falls?","options":["Dry access routes","Good housekeeping","Wet or obstructed floors","Adequate lighting"],"answer":2,"why":"Slip and trip risks are increased by poor flooring and obstruction.","id":728,"group":"Other safety","focus":false,"answerText":"Wet or obstructed floors"},{"topic":"Accidents & safe working","page":"Safety p. 21","q":"What is prohibited as workplace horseplay?","options":["Asking for help with lifting","Practical jokes and silly tricks","Putting tools away","Reporting a hazard"],"answer":1,"why":"The manual explicitly prohibits horseplay and practical jokes.","id":729,"group":"Other safety","focus":false,"answerText":"Practical jokes and silly tricks"},{"topic":"Accidents & safe working","page":"Safety p. 21","q":"What should be used after handling chemicals, before eating?","options":["A dirty workshop rag","A bare metal scraper","Compressed air directed at skin","Appropriate hand cleaning"],"answer":3,"why":"Good hygiene involves washing hands appropriately.","id":730,"group":"Other safety","focus":false,"answerText":"Appropriate hand cleaning"},{"topic":"Accidents & safe working","page":"Safety p. 21","q":"What should be done with long hair near rotating machinery?","options":["Tie it to a nearby lever","Leave it hanging loose","Secure or cover it","Ignore it if the machine is guarded"],"answer":2,"why":"Long hair can be drawn into moving parts.","id":731,"group":"Other safety","focus":false,"answerText":"Secure or cover it"},{"topic":"Accidents & safe working","page":"Safety p. 21","q":"How should ladders be positioned?","options":["On a firm base at the correct angle","On a slippery unstable surface","Against a moving load","Across an occupied doorway without controls"],"answer":0,"why":"A safe ladder needs a firm base and suitable positioning.","id":732,"group":"Other safety","focus":false,"answerText":"On a firm base at the correct angle"},{"topic":"Accidents & safe working","page":"Safety p. 21","q":"What should you avoid while working on a ladder?","options":["Overreaching","Positioning the ladder securely","Checking ladder condition","Maintaining three-point contact where appropriate"],"answer":0,"why":"Overreaching can cause ladder instability and falls.","id":733,"group":"Other safety","focus":false,"answerText":"Overreaching"},{"topic":"Accidents & safe working","page":"Safety p. 21","q":"What should be done before cleaning a machine?","options":["Stop and isolate the power source","Use compressed air on the operator","Remove guards while it rotates","Increase motor speed"],"answer":0,"why":"The manual says never clean a machine while it is in motion.","id":734,"group":"Other safety","focus":false,"answerText":"Stop and isolate the power source"},{"topic":"Accidents & safe working","page":"Safety p. 21","q":"Which action prevents slips near a machine?","options":["Walk faster across wet floors","Cover spills with loose cardboard","Clean up spilled oil or grease","Leave spills until the end of the week"],"answer":2,"why":"Oil and grease spills can create slip hazards.","id":735,"group":"Other safety","focus":false,"answerText":"Clean up spilled oil or grease"},{"topic":"Accidents & safe working","page":"Safety p. 22","q":"What must be checked before operating a machine?","options":["The supply cable is frayed","Guards are fitted correctly","The emergency stop is hidden","The work area contains loose tools"],"answer":1,"why":"The manual stresses correctly fitted guards.","id":736,"group":"Other safety","focus":false,"answerText":"Guards are fitted correctly"},{"topic":"Accidents & safe working","page":"Safety p. 22","q":"Which approach is safe with compressed air?","options":["Use maximum pressure to test gloves","Never direct it at people or use it to clean clothing","Point the nozzle toward a colleague","Use it to remove dust from skin"],"answer":1,"why":"The manual warns against using compressed air on people or clothing.","id":737,"group":"Other safety","focus":false,"answerText":"Never direct it at people or use it to clean clothing"},{"topic":"Accidents & safe working","page":"Safety p. 22","q":"What should be done with harmful chemical splashes on clothing?","options":["Remove contaminated clothing and follow decontamination instructions","Ignore until the next shift","Dry them using a hot torch","Rinse only with oil"],"answer":0,"why":"Follow the relevant first-aid and decontamination procedure.","id":738,"group":"Other safety","focus":false,"answerText":"Remove contaminated clothing and follow decontamination instructions"},{"topic":"Accidents & safe working","page":"Safety p. 22","q":"What is required before connecting electrical equipment?","options":["Use damaged extension cords","Stand in water for better contact","Leave bare conductors accessible","Understand instructions and isolate as appropriate"],"answer":3,"why":"Electrical equipment should be used according to instructions and safe isolation practices.","id":739,"group":"Other safety","focus":false,"answerText":"Understand instructions and isolate as appropriate"},{"topic":"Accidents & safe working","page":"Safety p. 22","q":"What should be done after even a minor workplace injury?","options":["Report it and obtain appropriate first aid","Continue without assessment","Record it only if a machine was damaged","Conceal it if the bleeding stops"],"answer":0,"why":"The manual says report every injury, however trivial.","id":740,"group":"Other safety","focus":false,"answerText":"Report it and obtain appropriate first aid"},{"topic":"Accidents & safe working","page":"Safety p. 22","q":"What should you know before a fire occurs?","options":["The site’s fire drill and evacuation procedure","Only the fire extinguisher paint code","Only the fire alarm brand","Only the nearest production target"],"answer":0,"why":"Emergency familiarity improves safe evacuation.","id":741,"group":"Other safety","focus":false,"answerText":"The site’s fire drill and evacuation procedure"},{"topic":"Accidents & safe working","page":"Safety p. 22","q":"What should you do if unsure how to operate equipment?","options":["Guess from the control colour","Override the interlock","Ask an untrained colleague to try first","Seek instruction before using it"],"answer":3,"why":"The manual emphasises training and safe working.","id":742,"group":"Other safety","focus":false,"answerText":"Seek instruction before using it"},{"topic":"Assembly methods","q":"In batch assembly, supplied parts are generally:","options":["Partly forged","Fully machined and ready","Unfinished castings","Matched after a trial"],"answer":1,"why":"The manual says batch-assembly parts arrive fully machined and should need no skilled fitting.","page":"Assembly p.5","id":743,"group":"Assembly methods","focus":true,"answerText":"Fully machined and ready"},{"topic":"Assembly methods","q":"In line assembly, the work moves mainly by:","options":["Crane runway"
