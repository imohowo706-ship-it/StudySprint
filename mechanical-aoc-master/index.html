 series.","id":388,"group":"Fasteners & washers","focus":true,"answerText":"Unified National Coarse and Unified National Fine"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"Why is BA threading used in the manual?","options":["To replace all modern metric threads","Only on welded pipe flanges","For small fasteners below around 1/4-inch diameter in certain applications","Only on very large bridge bolts"],"answer":2,"why":"The manual describes BA use in small-diameter work.","id":389,"group":"Fasteners & washers","focus":true,"answerText":"For small fasteners below around 1/4-inch diameter in certain applications"},{"topic":"Mechanical fasteners & threads","page":"Assembly pp. 23–27","q":"What is thread pitch?","options":["The axial distance between adjacent corresponding thread points","The diameter of a bolt head","The mass of a thread","The length of a nut flat"],"answer":0,"why":"Pitch is a thread-spacing measurement along the axis.","id":390,"group":"Fasteners & washers","focus":true,"answerText":"The axial distance between adjacent corresponding thread points"},{"topic":"Locking devices","page":"Assembly pp. 27–29","q":"What is the main purpose of a locking device on a threaded fastening?","options":["Turn a bolt into a rivet","Increase the number of thread starts","Prevent loosening in service","Make a gasket unnecessary"],"answer":2,"why":"Locking devices resist unwanted loosening, especially under vibration.","id":391,"group":"Locking devices","focus":true,"answerText":"Prevent loosening in service"},{"topic":"Locking devices","page":"Assembly pp. 27–29","q":"How can a nylon-insert self-locking nut resist loosening?","options":["A cotter pin is always present","A polymer insert creates friction on the mating thread","The bolt becomes unthreaded","The nut permanently welds to the bolt"],"answer":1,"why":"Nylon-insert nuts provide prevailing torque by thread friction.","id":392,"group":"Locking devices","focus":true,"answerText":"A polymer insert creates friction on the mating thread"},{"topic":"Locking devices","page":"Assembly pp. 27–29","q":"What is the main role of a chemical thread-locking compound?","options":["Work as a pure bearing lubricant only","Replace every gasket in a system","Etch the threads completely away","Harden in the thread interface to resist loosening"],"answer":3,"why":"The manual describes adhesive thread-locking fluid which cures between mating threads.","id":393,"group":"Locking devices","focus":true,"answerText":"Harden in the thread interface to resist loosening"},{"topic":"Locking devices","page":"Assembly pp. 27–29","q":"What does the manual call the principle behind a slotted nut and split pin arrangement?","options":["Magnetic attraction of threads","Thermal expansion bonding","Hydraulic sealing","Mechanical prevention of rotation"],"answer":3,"why":"A pin through the stud/bolt prevents the slotted nut turning loose.","id":394,"group":"Locking devices","focus":true,"answerText":"Mechanical prevention of rotation"},{"topic":"Locking devices","page":"Assembly pp. 27–29","q":"A castellated nut is most commonly secured against rotation with:","options":["A soldering iron","A rubber hose","A gasket alone","A split pin through a matching hole"],"answer":3,"why":"Castellations allow a split pin to retain the nut.","id":395,"group":"Locking devices","focus":true,"answerText":"A split pin through a matching hole"},{"topic":"Locking devices","page":"Assembly pp. 27–29","q":"What distinguishes a slotted nut from a plain hexagonal nut?","options":["It is always made from plastic","Slots permit a split pin to secure it","The slotted nut has no internal thread","It can only be used once"],"answer":1,"why":"Slots align with the bolt's cross-hole to accept a split pin.","id":396,"group":"Locking devices","focus":true,"answerText":"Slots permit a split pin to secure it"},{"topic":"Locking devices","page":"Assembly pp. 27–29","q":"What is a Nyloc nut?","options":["A hand-operated torque wrench","A self-locking nut containing a nylon ring or insert","A nut permanently brazed to the bolt","A square rivet"],"answer":1,"why":"The manual describes the nylon ring creating a locking thread friction.","id":397,"group":"Locking devices","focus":true,"answerText":"A self-locking nut containing a nylon ring or insert"},{"topic":"Locking devices","page":"Assembly pp. 27–29","q":"How does an Aerotight-type nut resist loosening in the manual?","options":["It is held entirely by an adhesive gasket","It has no thread engagement","It is submerged in oil","Deformed arms create spring resistance on the bolt thread"],"answer":3,"why":"A spring-like deformation increases resistance to rotation.","id":398,"group":"Locking devices","focus":true,"answerText":"Deformed arms create spring resistance on the bolt thread"},{"topic":"Locking devices","page":"Assembly pp. 27–29","q":"What mechanism is associated with a Philidas-type self-locking nut?","options":["A removable external spring alone","A loose plain washer","A slotted upper portion with altered thread position produces interference","A molten metal key"],"answer":2,"why":"The reduced upper section is slotted and displaced to create locking resistance.","id":399,"group":"Locking devices","focus":true,"answerText":"A slotted upper portion with altered thread position produces interference"},{"topic":"Locking devices","page":"Assembly pp. 27–29","q":"What is characteristic of a torque-lock nut?","options":["A deformed upper part creates prevailing torque and thread grip","It needs a rivet through every face","It has no metal contact","It relies only on external paint"],"answer":0,"why":"The manual describes a partly deformed top providing grip on the thread.","id":400,"group":"Locking devices","focus":true,"answerText":"A deformed upper part creates prevailing torque and thread grip"},{"topic":"Locking devices","page":"Assembly pp. 27–29","q":"Where is a locking washer fitted?","options":["Under the nut or head of a threaded fastener","At the centre of a weld","Inside the cylinder bore instead of a piston","Only inside the electrical terminal"],"answer":0,"why":"Locking washers sit under a bolt head, screw head or nut.","id":401,"group":"Locking devices","focus":true,"answerText":"Under the nut or head of a threaded fastener"},{"topic":"Locking devices","page":"Assembly pp. 27–29","q":"What does a tab washer achieve?","options":["It has no contact with the fastening","A tab is bent to mechanically oppose nut or bolt rotation","It becomes liquid when loaded","It cuts threads into a smooth bore"],"answer":1,"why":"Bending the tab provides a physical locking action.","id":402,"group":"Locking devices","focus":true,"answerText":"A tab is bent to mechanically oppose nut or bolt rotation"},{"topic":"Locking devices","page":"Assembly pp. 27–29","q":"What is the locking principle of a shakeproof/star washer?","options":["It removes the screw's threads","It forms a welded bead","Teeth bite against mating contact surfaces","It uses only hydraulic pressure"],"answer":2,"why":"Star washer teeth create resistance at contact surfaces.","id":403,"group":"Locking devices","focus":true,"answerText":"Teeth bite against mating contact surfaces"},{"topic":"Locking devices","page":"Assembly pp. 27–29","q":"What is a spring or helical locking washer intended to do in the manual?","options":["Maintain resistance to loosening by its spring action","Serve as the only gasket for pressure containment","Create a new tapped hole","Act as a precision dowel"],"answer":0,"why":"The manual presents helical-spring washers as locking devices; actual suitability depends on the joint design.","id":404,"group":"Locking devices","focus":true,"answerText":"Maintain resistance to loosening by its spring action"},{"topic":"Locking devices","page":"Assembly pp. 27–29","q":"What is the purpose of an internal-tooth shakeproof washer?","options":["To drill the bolt hole","To bite into a surface near the fastener bore","To carry welding current","To form the rivet's second head"],"answer":1,"why":"Internal teeth contact and bite into the clamped surface.","id":405,"group":"Locking devices","focus":true,"answerText":"To bite into a surface near the fastener bore"},{"topic":"Locking devices","page":"Assembly pp. 27–29","q":"When may a shakeproof washer be useful according to the manual?","options":["When an entire load is supported only by paint","When components must freely rotate apart","When threads are removed","Where resisting rotation and secure fixing are important"],"answer":3,"why":"Toothed designs are intended to discourage the fastener turning loose.","id":406,"group":"Locking devices","focus":true,"answerText":"Where resisting rotation and secure fixing are important"},{"topic":"Locking devices","page":"Assembly pp. 27–29","q":"What is one advantage of prevailing-torque nuts over plain nuts?","options":["They prevent all corrosion in any environment","They can be tightened with no thread engagement","They provide additional thread friction against accidental loosening","They always remove the need for correct tightening"],"answer":2,"why":"A prevailing-torque feature contributes resistance to loosening but does not replace good joint design.","id":407,"group":"Locking devices","focus":true,"answerText":"They provide additional thread friction against accidental loosening"},{"topic":"Locking devices","page":"Assembly pp. 27–29","q":"How do many mechanical locking arrangements differ from adhesive locking?","options":["They always melt the nut","They dissolve the bolt","They physically obstruct or resist rotation rather than cure between threads","They require a welding torch"],"answer":2,"why":"Pins, tabs and deformed nuts work mechanically.","id":408,"group":"Locking devices","focus":true,"answerText":"They physically obstruct or resist rotation rather than cure between threads"},{"topic":"Locking devices","page":"Assembly pp. 27–29","q":"Why might a new split pin be needed during reassembly?","options":["The bolt must always be drilled larger","The nut cannot be tightened again","A split pin is a permanent weld","Split pins are often replaced after removal to maintain reliable retention"],"answer":3,"why":"A used split pin may be damaged or weakened during removal.","id":409,"group":"Locking devices","focus":true,"answerText":"Split pins are often replaced after removal to maintain reliable retention"},{"topic":"Locking devices","page":"Assembly pp. 27–29","q":"What is the key difference between a plain flat washer and a lock washer in the manual?","options":["Both always create identical locking action","Lock washers replace bolts","The flat washer is always a thread-locking adhesive","A flat washer spreads load; a lock washer is intended to resist loosening"],"answer":3,"why":"The manual separates load-distributing washers from locking devices.","id":410,"group":"Locking devices","focus":true,"answerText":"A flat washer spreads load; a lock washer is intended to resist loosening"},{"topic":"Riveting & soft soldering","page":"Assembly pp. 29–32","q":"Why are rivets used in assembly?","options":["They always permit removal without damage","They act as a heating flux","They form permanent mechanical fastenings","They replace all threaded holes"],"answer":2,"why":"Riveting creates a permanent connection by deforming a rivet end.","id":411,"group":"Riveting","focus":true,"answerText":"They form permanent mechanical fastenings"},{"topic":"Riveting & soft soldering","page":"Assembly pp. 29–32","q":"What is the main difference between solid and tubular rivets?","options":["Tubular rivets are welded instead of formed","Solid rivets have no shank","Solid rivets are always plastic","A tubular rivet has a hollow section requiring less force to clinch"],"answer":3,"why":"The manual notes hollow tubular rivets require lower closing force.","id":412,"group":"Riveting","focus":true,"answerText":"A tubular rivet has a hollow section requiring less force to clinch"},{"topic":"Riveting & soft soldering","page":"Assembly pp. 29–32","q":"What is a semi-tubular rivet especially useful for?","options":["Joining suitable thinner materials with reduced forming force","Sealing a pressure vessel without design checks","Replacing all bolts","High-pressure pipe welding"],"answer":0,"why":"The hollow portion reduces force for clinching.","id":413,"group":"Riveting","focus":true,"answerText":"Joining suitable thinner materials with reduced forming force"},{"topic":"Riveting & soft soldering","page":"Assembly pp. 29–32","q":"What is the feature of a blind rivet?","options":["Both sides must always be reached by hammers","It is completely reusable","It can be installed when access is available from only one side","It requires molten lead filler"],"answer":2,"why":"Blind rivets, also called pop rivets, are accessible from one side.","id":414,"group":"Riveting","focus":true,"answerText":"It can be installed when access is available from only one side"},{"topic":"Riveting & soft soldering","page":"Assembly pp. 29–32","q":"What is the job of the mandrel in a blind rivet?","options":["Pulling to expand and form the rivet body before breaking at a designed point","Measuring electrical continuity","Lubricating a gearbox","Applying solder flux"],"answer":0,"why":"The mandrel forms the rivet when pulled by the setting tool.","id":415,"group":"Riveting","focus":true,"answerText":"Pulling to expand and form the rivet body before breaking at a designed point"},{"topic":"Riveting & soft soldering","page":"Assembly pp. 29–32","q":"What is meant by a self-piercing rivet?","options":["A stud with no head","A bolt with nylon thread insert","A completely hollow solder joint","A rivet that pierces suitable sheet material and clinches without a conventional predrilled hole"],"answer":3,"why":"The manual describes self-piercing rivets penetrating the sheets during setting.","id":416,"group":"Riveting","focus":true,"answerText":"A rivet that pierces suitable sheet material and clinches without a conventional predrilled hole"},{"topic":"Riveting & soft soldering","page":"Assembly pp. 29–32","q":"How does soft soldering join metals?","options":["A low-melting filler flows between surfaces without melting the parent metals","A rivet is hammered into a cavity","A bolt thread is cut between plates","Both parent metals must fully melt"],"answer":0,"why":"Soldering uses a fusible filler metal to form a joint.","id":417,"group":"Soft soldering","focus":true,"answerText":"A low-melting filler flows between surfaces without melting the parent metals"},{"topic":"Riveting & soft soldering","page":"Assembly pp. 29–32","q":"What is flux in soldering used for?","options":["Creating a bolt head","Acting as a lifting lug","Increasing the parent metal melting temperature","Removing/preventing oxide films so solder can wet the surfaces"],"answer":3,"why":"Flux assists wetting by dealing with oxides on surfaces.","id":418,"group":"Soft soldering","focus":true,"answerText":"Removing/preventing oxide films so solder can wet the surfaces"},{"topic":"Riveting & soft soldering","page":"Assembly pp. 29–32","q":"Which type of soldering flux may be corrosive and require thorough residue removal?","options":["A nylon lock-nut insert","A neutral storage wax","An active acidic flux such as zinc-chloride-based flux","A plain steel washer"],"answer":2,"why":"Active corrosive flux residues must be cleaned after soldering.","id":419,"group":"Soft soldering","focus":true,"answerText":"An active acidic flux such as zinc-chloride-based flux"},{"topic":"Riveting & soft soldering","page":"Assembly pp. 29–32","q":"What kind of flux is usually preferred for electronic soldering?","options":["An appropriate non-corrosive rosin/resin-type flux","Rust particles","Concrete slurry","Strong corrosive masonry acid"],"answer":0,"why":"The manual describes rosin-based passive flux for electrical work.","id":420,"group":"Soft soldering","focus":true,"answerText":"An appropriate non-corrosive rosin/resin-type flux"},{"topic":"Riveting & soft soldering","page":"Assembly pp. 29–32","q":"Why must a soldering iron supply sufficient heat to the joint?","options":["To melt the entire machine assembly","To form a rivet by impact","To raise the work surfaces enough for solder to wet and flow","To destroy insulation deliberately"],"answer":2,"why":"The joint itself needs adequate temperature, not just the iron tip.","id":421,"group":"Soft soldering","focus":true,"answerText":"To raise the work surfaces enough for solder to wet and flow"},{"topic":"Riveting & soft soldering","page":"Assembly pp. 29–32","q":"Why is uncontrolled soldering heat dangerous near electronic components?","options":["It reduces the need for flux","It can damage insulation and heat-sensitive parts","It converts solder to a mechanical bolt","It guarantees stronger conductors"],"answer":1,"why":"The manual warns that heat sinks and care may be needed around sensitive items.","id":422,"group":"Soft soldering","focus":true,"answerText":"It can damage insulation and heat-sensitive parts"},{"topic":"Riveting & soft soldering","page":"Assembly pp. 29–32","q":"What is a heat sink used for in small soldering work?","options":["Adding solder automatically","Creating a power supply","Providing mechanical thread locking","Absorbing or diverting some heat away from vulnerable components"],"answer":3,"why":"A heat sink limits heat transferred into sensitive nearby parts.","id":423,"group":"Soft soldering","focus":true,"answerText":"Absorbing or diverting some heat away from vulnerable components"},{"topic":"Riveting & soft soldering","page":"Assembly pp. 29–32","q":"Why might a soldering iron be unsuitable for a very large joint?","options":["Large surfaces cannot conduct heat","The iron automatically welds the metals","The joint surfaces absorb heat faster than the iron can supply it","Solder melts only with high-pressure gas"],"answer":2,"why":"Larger masses may need an appropriate higher-capacity heat source.","id":424,"group":"Soft soldering","focus":true,"answerText":"The joint surfaces absorb heat faster than the iron can supply it"},{"topic":"Riveting & soft soldering","page":"Assembly pp. 29–32","q":"In the manual, soft solder is generally composed of which metals?","options":["Aluminium and silver only","Copper and zinc only","Tin and lead alloys","Iron and nickel only"],"answer":2,"why":"The manual's historical solder section discusses tin-lead compositions; modern lead-free solders also exist.","id":425,"group":"Soft soldering","focus":true,"answerText":"Tin and lead alloys"},{"topic":"Riveting & soft soldering","page":"Assembly pp. 29–32","q":"What is the melting-point behaviour of a 60/40 tin-lead solder in the manual's table?","options":["It is already liquid at room temperature","It stays solid up to 500°C","It melts only above steel's melting point","It begins to melt at about 183°C and is fully liquid around 188°C"],"answer":3,"why":"The manual lists the 60% tin, 40% lead composition near 183°C solidus and 188°C liquidus.","id":426,"group":"Soft soldering","focus":true,"answerText":"It begins to melt at about 183°C and is fully liquid around 188°C"},{"topic":"Riveting & soft soldering","page":"Assembly pp. 29–32","q":"What does 'solidus' mean in a solder-alloy table?","options":["The colour of a flux","Temperature below which the alloy is completely solid","The maximum operating current","The diameter of a soldering iron"],"answer":1,"why":"Solidus marks the fully solid boundary.","id":427,"group":"Soft soldering","focus":true,"answerText":"Temperature below which the alloy is completely solid"},{"topic":"Riveting & soft soldering","page":"Assembly pp. 29–32","q":"What does 'liquidus' mean in a solder-alloy table?","options":["The tensile strength of a washer","Temperature above which the alloy is completely liquid","The lowest possible bolt torque","The mass of solid lead"],"answer":1,"why":"Liquidus marks the fully liquid boundary.","id":428,"group":"Soft soldering","focus":true,"answerText":"Temperature above which the alloy is completely liquid"},{"topic":"Riveting & soft soldering","page":"Assembly pp. 29–32","q":"Why are fillets and proper support important in soldered joints?","options":["Solder alone is relatively weak, so mechanical support can improve joint reliability","A solder joint can never conduct electricity","Fillets eliminate all thermal effects","The solder must carry every load unsupported"],"answer":0,"why":"The manual notes that additional mechanical strength may be needed in soldered connections.","id":429,"group":"Soft soldering","focus":true,"answerText":"Solder alone is relatively weak, so mechanical support can improve joint reliability"},{"topic":"Riveting & soft soldering","page":"Assembly pp. 29–32","q":"How can an electrical wire be strengthened before soldering to a terminal?","options":["Leave it suspended only by a solder drop","Wrap or bend it around the terminal to provide a mechanical connection","Use a thick rubber band instead","Remove all metal contact"],"answer":1,"why":"The manual recommends a physical wrap/bend rather than relying on solder alone.","id":430,"group":"Soft soldering","focus":true,"answerText":"Wrap or bend it around the terminal to provide a mechanical connection"},{"topic":"Brazing","page":"Assembly pp. 32–34","q":"What happens to the parent metals during brazing?","options":["They are drilled and tapped","They remain solid while molten filler metal joins them","They must both fully melt","They are held only by screws"],"answer":1,"why":"Brazing uses filler metal above the soldering range without melting the parent metals.","id":431,"group":"Brazing","focus":true,"answerText":"They remain solid while molten filler metal joins them"},{"topic":"Brazing","page":"Assembly pp. 32–34","q":"How does brazing filler often enter a closely fitted joint?","options":["A hammer blow","Capillary action","Gravity acting on a loose nut","Electromagnetic attraction only"],"answer":1,"why":"Capillary action draws molten filler through suitable joint clearances.","id":432,"group":"Brazing","focus":true,"answerText":"Capillary action"},{"topic":"Brazing","page":"Assembly pp. 32–34","q":"What is the primary purpose of brazing flux?","options":["Provide mechanical support after cooling only","Remove surface oxides and aid filler wetting","Increase the size of the bolts","Set the machine speed"],"answer":1,"why":"Flux enables filler metal to spread and bond to clean surfaces.","id":433,"group":"Brazing","focus":true,"answerText":"Remove surface oxides and aid filler wetting"},{"topic":"Brazing","page":"Assembly pp. 32–34","q":"What does the manual list as an important joint-preparation step before brazing?","options":["Paint over all dirt","Leave surfaces oily for protection","Fit a polymer gasket inside the flame","Remove rust, grease and oxide films from surfaces"],"answer":3,"why":"Clean surfaces are important for sound filler wetting.","id":434,"group":"Brazing","focus":true,"answerText":"Remove rust, grease and oxide films from surfaces"},{"topic":"Brazing","page":"Assembly pp. 32–34","q":"What forms of brazing alloys are listed in the manual?","options":["Only cast billets","Rod, strip, wire, foil and powder","Only nuts and rivets","Only painted sheet metal"],"answer":1,"why":"The manual lists multiple forms of brazing filler material.","id":435,"group":"Brazing","focus":true,"answerText":"Rod, strip, wire, foil and powder"},{"topic":"Brazing","page":"Assembly pp. 32–34","q":"Which common brazing-filler family is based principally on copper and zinc?","options":["Tin-lead soft solder","Brass brazing alloy","Carbon-steel bolt","Nylon adhesive"],"answer":1,"why":"Copper-zinc brazing fillers are widely called brass or spelter-type fillers.","id":436,"group":"Brazing","focus":true,"answerText":"Brass brazing alloy"},{"topic":"Brazing","page":"Assembly pp. 32–34","q":"What is the purpose of an appropriate joint gap in brazing?","options":["Prevent any wetting","Permit capillary action and filler distribution","Ensure adhesive evaporation","Guarantee all parent metal melts"],"answer":1,"why":"The manual discusses close clearance suitable for filler flow.","id":437,"group":"Brazing","focus":true,"answerText":"Permit capillary action and filler distribution"},{"topic":"Brazing","page":"Assembly pp. 32–34","q":"Why may silver brazing alloys be selected?","options":["Good wetting and ability to join various similar or dissimilar metals","They are always insulating materials","They are always the cheapest filler","They never require joint preparation"],"answer":0,"why":"Silver-brazing alloys are noted for joining performance and varied applications.","id":438,"group":"Brazing","focus":true,"answerText":"Good wetting and ability to join various similar or dissimilar metals"},{"topic":"Brazing","page":"Assembly pp. 32–34","q":"What does the manual warn about cadmium-containing brazing alloys?","options":["They require no ventilation","They can produce toxic fumes during heating","They are non-toxic at every temperature","They are used exclusively as electrical insulators"],"answer":1,"why":"The text highlights cadmium-fume toxicity and need for appropriate controls.","id":439,"group":"Brazing","focus":true,"answerText":"They can produce toxic fumes during heating"},{"topic":"Brazing","page":"Assembly pp. 32–34","q":"What should be done with flux residues after brazing?","options":["Cover residues with paint immediately","Use them as permanent mechanical fasteners","Leave all residues regardless of corrosivity","Remove them using a suitable method"],"answer":3,"why":"Residues can be corrosive or contaminate the work if not cleaned.","id":440,"group":"Brazing","focus":true,"answerText":"Remove them using a suitable method"},{"topic":"Brazing","page":"Assembly pp. 32–34","q":"Why can an excessively wide brazed joint gap be undesirable?","options":["It forces all parts to align correctly","Capillary filling and joint strength may be reduced","It automatically improves wetting","It removes the need for flux"],"answer":1,"why":"Gap selection influences filler flow and strength.","id":441,"group":"Brazing","focus":true,"answerText":"Capillary filling and joint strength may be reduced"},{"topic":"Brazing","page":"Assembly pp. 32–34","q":"What is the major difference between soft soldering and brazing?","options":["Brazing uses a higher filler-metal working temperature","Brazing is exclusively adhesive","Soft soldering uses rivets","Soft soldering always melts the parent metal"],"answer":0,"why":"Brazing is distinguished by higher-temperature filler joining with solid parent metals.","id":442,"group":"Brazing","focus":true,"answerText":"Brazing uses a higher filler-metal working temperature"},{"topic":"Brazing","page":"Assembly pp. 32–34","q":"What does the manual recommend about brazing using oxyacetylene heat?","options":["Hold an intensely localised flame at one corner for the entire process","Heat only the filler away from the joint","Quench every workpiece without exception","Move the flame to obtain reasonably even heat distribution"],"answer":3,"why":"Uniform joint heating supports filler flow and reduces distortion.","id":443,"group":"Brazing","focus":true,"answerText":"Move the flame to obtain reasonably even heat distribution"},{"topic":"Brazing","page":"Assembly pp. 32–34","q":"What does a 'joint in shear' aim to favour?","options":["Only paint adhesion","Shear rather than peel/tensile opening loads across the joint","Forces that peel the joint apart","Electrical insulation only"],"answer":1,"why":"The manual recommends designing joints to load the bonded/brazed region in shear when practical.","id":444,"group":"Brazing","focus":true,"answerText":"Shear rather than peel/tensile opening loads across the joint"},{"topic":"Brazing","page":"Assembly pp. 32–34","q":"What is the main reason to select a lap rather than a simple butt joint for some brazed connections?","options":["Greater effective joining area","To remove capillary action","To decrease contact area to zero","To remove any need for heat"],"answer":0,"why":"Lap configurations can increase joint contact area.","id":445,"group":"Brazing","focus":true,"answerText":"Greater effective joining area"},{"topic":"Brazing","page":"Assembly pp. 32–34","q":"What does 'wetting' mean in brazing or soldering?","options":["Molten filler spreads and adheres to suitably prepared surfaces","The work is simply rinsed in cold water","Water enters the welding electrode","A washer becomes lubricated"],"answer":0,"why":"Good wetting is necessary to form an effective metallurgical joint.","id":446,"group":"Brazing","focus":true,"answerText":"Molten filler spreads and adheres to suitably prepared surfaces"},{"topic":"Welding","page":"Assembly pp. 34–36","q":"What distinguishes welding from soldering and brazing in the manual?","options":["The parent metals are locally melted and fused","Only adhesive bonds the parts","No heat is used in any welding process","Bolts are always required"],"answer":0,"why":"The manual discusses fusion welding, where parent metal is melted at the joint.","id":447,"group":"Welding","focus":true,"answerText":"The parent metals are locally melted and fused"},{"topic":"Welding","page":"Assembly pp. 34–36","q":"What is the role of filler metal in many welding processes?","options":["Replace all shielding","Supplement molten metal to form the weld joint","Keep the parents below room temperature","Stop any heat from reaching the joint"],"answer":1,"why":"Filler can add material to the weld pool when required.","id":448,"group":"Welding","focus":true,"answerText":"Supplement molten metal to form the weld joint"},{"topic":"Welding","page":"Assembly pp. 34–36","q":"What is an electric arc in arc welding?","options":["A rotating cutting blade","A purely mechanical spring force","An electrical discharge through ionised gas between electrode and work","A cured adhesive film"],"answer":2,"why":"An arc supplies intense heat to melt the metal at the joint.","id":449,"group":"Welding","focus":true,"answerText":"An electrical discharge through ionised gas between electrode and work"},{"topic":"Welding","page":"Assembly pp. 34–36","q":"What usually happens to a consumable arc-welding electrode?","options":["It remains unchanged forever","It melts and supplies filler metal","It turns into a rivet","It cuts the bolt threads"],"answer":1,"why":"Consumable wire or electrodes add molten metal to the weld.","id":450,"group":"Welding","focus":true,"answerText":"It melts and supplies filler metal"},{"topic":"Welding","page":"Assembly pp. 34–36","q":"Which process in the manual uses a flux-coated consumable stick electrode?","options":["TIG/GTAW only","Adhesive bonding","Soft soldering","Manual metal arc (MMA) welding"],"answer":3,"why":"MMA/SMAW uses a flux-coated consumable electrode.","id":451,"group":"Welding","focus":true,"answerText":"Manual metal arc (MMA) welding"},{"topic":"Welding","page":"Assembly pp. 34–36","q":"What is one function of flux coating on an MMA electrode?","options":["Thread a bolt hole","Hold a shaft bearing in alignment","Produce shielding gases and slag to protect molten metal","Act as an O-ring"],"answer":2,"why":"Flux helps shield the hot weld pool from atmospheric contamination.","id":452,"group":"Welding","focus":true,"answerText":"Produce shielding gases and slag to protect molten metal"},{"topic":"Welding","page":"Assembly pp. 34–36","q":"Which welding method uses a non-consumable tungsten electrode?","options":["Manual stick welding only","Tungsten inert gas (TIG) welding","Riveting","Brazing with brass filler"],"answer":1,"why":"TIG/GTAW uses tungsten and shielding gas; filler may be added separately.","id":453,"group":"Welding","focus":true,"answerText":"Tungsten inert gas (TIG) welding"},{"topic":"Welding","page":"Assembly pp. 34–36","q":"Which shielding gas type is associated with TIG welding in the manual?","options":["Air deliberately blown into the weld pool","Moisture vapour","Combustion products alone","Inert gas such as argon or helium"],"answer":3,"why":"TIG employs inert shielding gas.","id":454,"group":"Welding","focus":true,"answerText":"Inert gas such as argon or helium"},{"topic":"Welding","page":"Assembly pp. 34–36","q":"In TIG welding, is separate filler metal always required?","options":["A rivet always replaces it","No molten joint ever forms","Yes, a consumable tungsten rod must always melt","No, it may be added depending on the joint"],"answer":3,"why":"TIG can weld with or without added filler.","id":455,"group":"Welding","focus":true,"answerText":"No, it may be added depending on the joint"},{"topic":"Welding","page":"Assembly pp. 34–36","q":"Which process uses a continuously fed wire electrode through a welding gun?","options":["Riveting","Soft soldering","Hand scraping","Metal arc gas-shielded (MAGS/MIG-MAG) welding"],"answer":3,"why":"The manual describes continuous wire feed with shielding gas.","id":456,"group":"Welding","focus":true,"answerText":"Metal arc gas-shielded (MAGS/MIG-MAG) welding"},{"topic":"Welding","page":"Assembly pp. 34–36","q":"What is the purpose of shielding gas in gas-shielded arc welding?","options":["Melt the wire without an arc","Protect molten metal from atmospheric contamination","Act as a mechanical fastener","Increase surface rust deliberately"],"answer":1,"why":"Shielding reduces adverse reactions with surrounding atmosphere.","id":457,"group":"Welding","focus":true,"answerText":"Protect molten metal from atmospheric contamination"},{"topic":"Welding","page":"Assembly pp. 34–36","q":"Which shielding gas is specifically associated with the manual's CO2 welding description?","options":["Acetylene alone","Pure oxygen only","Nitrous oxide","Carbon dioxide"],"answer":3,"why":"The manual notes carbon dioxide shielding for some low-alloy steel applications.","id":458,"group":"Welding","focus":true,"answerText":"Carbon dioxide"},{"topic":"Welding","page":"Assembly pp. 34–36","q":"What does 'MMA' stand for in the welding section?","options":["Manual milling allowance","Mechanical mounting assembly","Manual metal arc","Molten metal adhesive"],"answer":2,"why":"MMA is the manual's term for flux-coated stick-arc welding.","id":459,"group":"Welding","focus":true,"answerText":"Manual metal arc"},{"topic":"Welding","page":"Assembly pp. 34–36","q":"Which welding process is presented as suitable for thin sheet metal and small parts requiring a high-quality weld?","options":["TIG welding","Blind riveting only","Flame cutting","Bolting only"],"answer":0,"why":"The manual highlights TIG for thin sheet and small precision work.","id":460,"group":"Welding","focus":true,"answerText":"TIG welding"},{"topic":"Welding","page":"Assembly pp. 34–36","q":"In oxy-fuel gas welding, what produces the welding heat?","options":["Resistance in a nylon nut","An unheated adhesive","Mechanical friction in a dowel","Combustion of a fuel gas with oxygen"],"answer":3,"why":"Gas welding uses a controlled flame produced by fuel and oxygen.","id":461,"group":"Welding","focus":true,"answerText":"Combustion of a fuel gas with oxygen"},{"topic":"Welding","page":"Assembly pp. 34–36","q":"Which fuel gas is the manual's main example for high-temperature gas welding?","options":["Acetylene","Nitrogen","Carbon dioxide","Argon"],"answer":0,"why":"Oxyacetylene uses acetylene and oxygen to produce a very hot flame.","id":462,"group":"Welding","focus":true,"answerText":"Acetylene"},{"topic":"Welding","page":"Assembly pp. 34–36","q":"What approximate flame temperature does the manual give for oxyacetylene gas welding?","options":["About 600°C","About 3250°C","About 100°C","About 183°C"],"answer":1,"why":"The manual quotes a high-temperature oxyacetylene flame around 3250°C.","id":463,"group":"Welding","focus":true,"answerText":"About 3250°C"},{"topic":"Welding","page":"Assembly pp. 34–36","q":"What is the purpose of controlling the gas mixture at the torch?","options":["Set the thread pitch of bolts","Reduce the joint area to zero","Adjust flame characteristics and heat delivery","Create an adhesive layer"],"answer":2,"why":"The fuel/oxygen ratio changes the flame condition.","id":464,"group":"Welding","focus":true,"answerText":"Adjust flame characteristics and heat delivery"},{"topic":"Welding","page":"Assembly pp. 34–36","q":"Why can a highly localised welding heat source be advantageous on thin work?","options":["It eliminates the need for correct technique","It removes fire hazards","It can reduce overall heat input and distortion when applied correctly","It always prevents every weld defect"],"answer":2,"why":"Controlled localised heating can limit deformation.","id":465,"group":"Welding","focus":true,"answerText":"It can reduce overall heat input and distortion when applied correctly"},{"topic":"Welding","page":"Assembly pp. 34–36","q":"Which of these is a potential result of poor welding control?","options":["Distortion or damage to adjacent heat-sensitive items","Guaranteed perfect joint fit","Complete elimination of residual stresses","Automatic electrical isolation"],"answer":0,"why":"Welding heat can affect parent metal and surrounding components.","id":466,"group":"Welding","focus":true,"answerText":"Distortion or damage to adjacent heat-sensitive items"},{"topic":"Welding","page":"Assembly pp. 34–36","q":"When is a welded joint a poor choice according to the assembly principles?","options":["When a sound qualified procedure exists","When a component must be removed routinely for maintenance","When a permanent piping joint is designed for welding","When heat can be managed"],"answer":1,"why":"Permanent joints make routine dismantling difficult.","id":467,"group":"Welding","focus":true,"answerText":"When a component must be removed routinely for maintenance"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"What does adhesive bonding mean?","options":["Joining mating surfaces with a bonding substance","Threading two nuts together","Melting two steel plates together","Using a metal rivet only"],"answer":0,"why":"Adhesive bonding forms a connection by a material between surfaces.","id":468,"group":"Adhesives & bonding","focus":true,"answerText":"Joining mating surfaces with a bonding substance"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"How does the manual classify adhesives at the highest level?","options":["Coarse and fine pitch","Natural and synthetic","Only hot and cold steel","Metric and imperial"],"answer":1,"why":"Natural and synthetic are the two broad groups shown.","id":469,"group":"Adhesives & bonding","focus":true,"answerText":"Natural and synthetic"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"What are the natural adhesive origins identified in the manual?","options":["Animal, vegetable and mineral","Only electricity and gas","Copper and zinc","Welding rod and flux"],"answer":0,"why":"Natural adhesives are classified by source.","id":470,"group":"Adhesives & bonding","focus":true,"answerText":"Animal, vegetable and mineral"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"Which industry is identified as a common user of natural adhesives?","options":["Woodworking and packaging","High-pressure pipe valve manufacture only","Gas-turbine rotor welding only","Aircraft turbine blade casting"],"answer":0,"why":"The manual highlights traditional woodworking and packaging applications.","id":471,"group":"Adhesives & bonding","focus":true,"answerText":"Woodworking and packaging"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"What is a basic advantage of adhesive joining for dissimilar materials?","options":["It forces all materials to expand identically","It can join unlike materials without drilling or heating them to melting","It always yields a metal-conducting joint","It requires every joint to be riveted"],"answer":1,"why":"Adhesives can bond metals and non-metals, including thin or fragile parts.","id":472,"group":"Adhesives & bonding","focus":true,"answerText":"It can join unlike materials without drilling or heating them to melting"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"How can adhesive joining improve the outside of a product?","options":["It always makes a rougher weld bead","It necessarily creates protruding fasteners","It removes the need for finishing","It avoids exposed bolt or rivet heads and can leave a smooth surface"],"answer":3,"why":"The manual notes the absence of fastener heads on bonded surfaces.","id":473,"group":"Adhesives & bonding","focus":true,"answerText":"It avoids exposed bolt or rivet heads and can leave a smooth surface"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"What is a major maintenance disadvantage of many structural adhesive joints?","options":["Every adhesive joint unscrews by hand","They are difficult to dismantle for repair or replacement","They require no preparation","All adhesives are removable in hot water"],"answer":1,"why":"Permanent bonding complicates repair.","id":474,"group":"Adhesives & bonding","focus":true,"answerText":"They are difficult to dismantle for repair or replacement"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"Why is surface preparation important before adhesive bonding?","options":["Dust increases adhesion automatically","Surface contact is irrelevant","Grease always acts as primer","Poor cleaning and contamination can weaken the bond"],"answer":3,"why":"Bonding requires suitable, properly prepared surfaces.","id":475,"group":"Adhesives & bonding","focus":true,"answerText":"Poor cleaning and contamination can weaken the bond"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"What does the manual say about adhesive temperature limitations?","options":["All bonds melt exactly at 183°C","All adhesives resist unlimited heat","Most adhesives have lower temperature limits than many other joining methods","Temperature never affects adhesive strength"],"answer":2,"why":"Adhesive properties can degrade at elevated temperature.","id":476,"group":"Adhesives & bonding","focus":true,"answerText":"Most adhesives have lower temperature limits than many other joining methods"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"Which property can adhesive layers provide besides joining?","options":["Unlimited electrical conductivity in every product","Always perfect heat conduction","Guaranteed corrosion of both parts","Electrical insulation, damping or flexibility depending on the material"],"answer":3,"why":"The manual mentions electrical insulation, vibration damping and some joint flexibility.","id":477,"group":"Adhesives & bonding","focus":true,"answerText":"Electrical insulation, damping or flexibility depending on the material"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"Which three synthetic-adhesive families are named?","options":["Only BSW, BSF and BA","Thermoplastic resins, thermoplastic rubbers and thermosetting resins","Only nitric acid, water and grease","Only metals, ceramics and glass"],"answer":1,"why":"These are the synthetic groupings in the manual.","id":478,"group":"Adhesives & bonding","focus":true,"answerText":"Thermoplastic resins, thermoplastic rubbers and thermosetting resins"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"How does a thermoplastic adhesive respond to heating?","options":["It is always a solder alloy","It automatically becomes a weld","It softens without the same permanent cross-linked chemical change as thermosets","It can never soften"],"answer":2,"why":"Thermoplastic resins soften on heating and harden on cooling.","id":479,"group":"Adhesives & bonding","focus":true,"answerText":"It softens without the same permanent cross-linked chemical change as thermosets"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"Which type is also known as superglue?","options":["Cyanoacrylate","Epoxy putty only","Neoprene contact adhesive","Tin-lead solder"],"answer":0,"why":"The manual describes cyanoacrylate as superglue.","id":480,"group":"Adhesives & bonding","focus":true,"answerText":"Cyanoacrylate"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"What generally causes moisture-curing cyanoacrylate to bond?","options":["Melting both parent metals","Driving a rivet into the surface","Applying very high pressure steam only","Moisture at the surfaces initiates rapid polymerisation"],"answer":3,"why":"Cyanoacrylate bonds can cure rapidly in the presence of surface moisture.","id":481,"group":"Adhesives & bonding","focus":true,"answerText":"Moisture at the surfaces initiates rapid polymerisation"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"What is a common limitation of cyanoacrylate in the manual?","options":["It always needs a welding torch","It has no usable industrial applications","It is an expensive adhesive and careful surfaces/bonding conditions matter","It is a conventional mechanical nut"],"answer":2,"why":"The manual discusses high cost and bonding behaviour.","id":482,"group":"Adhesives & bonding","focus":true,"answerText":"It is an expensive adhesive and careful surfaces/bonding conditions matter"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"Which thermoplastic rubber is commonly called neoprene?","options":["Cyanoacrylate","Polychloroprene","Phenol-formaldehyde","Tin-lead eutectic alloy"],"answer":1,"why":"Neoprene is the common name for polychloroprene rubber.","id":483,"group":"Adhesives & bonding","focus":true,"answerText":"Polychloroprene"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"What is typical of neoprene contact adhesives?","options":["They are always arc welded","They are pure metal brazing fillers","Solvent-based adhesives applied to surfaces, with solvent evaporation before contact bonding","They are not adhesives"],"answer":2,"why":"The manual describes polychloroprene/neoprene solvent-based contact adhesive.","id":484,"group":"Adhesives & bonding","focus":true,"answerText":"Solvent-based adhesives applied to surfaces, with solvent evaporation before contact bonding"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"What limitation does the manual note for many neoprene contact-bonded joints?","options":["They are generally suited to comparatively low-load applications","They have no temperature limitations","They always exceed welded steel in strength","They cannot join non-metallic materials"],"answer":0,"why":"The manual cautions that structural high-load applications may be unsuitable.","id":485,"group":"Adhesives & bonding","focus":true,"answerText":"They are generally suited to comparatively low-load applications"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"What is a thermosetting adhesive?","options":["A steel pin under tension","An adhesive that cures by chemical reaction, heat, catalyst or both to form a permanent network","A tin-lead filler metal","An adhesive that always softens reversibly each time it is heated"],"answer":1,"why":"Thermosetting resins form irreversible chemical structures on curing.","id":486,"group":"Adhesives & bonding","focus":true,"answerText":"An adhesive that cures by chemical reaction, heat, catalyst or both to form a permanent network"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"Which material family is typically supplied in two parts as resin and hardener?","options":["Brass riveting rods","Epoxy adhesives","Plain flat washers","BSW threads"],"answer":1,"why":"Many epoxies cure after resin and hardener are mixed.","id":487,"group":"Adhesives & bonding","focus":true,"answerText":"Epoxy adhesives"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"What can change the cure time of an epoxy adhesive?","options":["Temperature and the specific epoxy formulation","Only the thread pitch of a bolt","Only the diameter of a pipe","The colour of the operator's gloves alone"],"answer":0,"why":"The manual notes cure can occur at room or elevated temperature, depending on formulation.","id":488,"group":"Adhesives & bonding","focus":true,"answerText":"Temperature and the specific epoxy formulation"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"Which applications are specifically noted for epoxy bonding?","options":["Metal bonding, reinforced plastics and bridge/building repair","High-speed flame cutting only","Operating an impact spanner","Replacing every electrical earth"],"answer":0,"why":"The manual gives industrial epoxy applications across materials and construction.","id":489,"group":"Adhesives & bonding","focus":true,"answerText":"Metal bonding, reinforced plastics and bridge/building repair"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"What is one advantage of adhesive bonding compared with drilling holes for mechanical fasteners?","options":["It always improves conductivity","It needs no adhesive curing","It automatically meets every pressure code","It can avoid local weakening caused by drilled holes"],"answer":3,"why":"Avoiding holes can preserve cross-section and appearance in suitable designs.","id":490,"group":"Adhesives & bonding","focus":true,"answerText":"It can avoid local weakening caused by drilled holes"},{"topic":"Adhesives and types","page":"Assembly pp. 37–40","q":"What does the manual identify as a risk in long-term adhesive use?","options":["Metals becoming non-conductors","Permanent immunity to chemical attack","Mechanical strength increasing forever","Environmental durability and ageing limitations"],"answer":3,"why":"Bond performance can decline with moisture, heat, chemicals and time.","id":491,"group":"Adhesives & bonding","focus":true,"answerText":"Environmental durability and ageing limitations"},{"topic":"Electrical connections & joining comparison","page":"Assembly pp. 41–42","q":"What should a correctly made electrical terminal connection avoid?","options":["A secure connection","Mechanical strain on the conductor and terminal","Any metallic contact","Appropriate insulation"],"answer":1,"why":"The manual says the wire and its terminal should not be under appreciable mechanical stress.","id":492,"group":"Electrical connections","focus":false,"answerText":"Mechanical strain on the conductor and terminal"},{"topic":"Electrical connections & joining comparison","page":"Assembly pp. 41–42","q":"Why is a screw terminal commonly used?","options":["It prevents every overload","It melts the conductor into a weld automatically","It replaces all insulation","It clamps a conductor securely in a suitable terminal"],"answer":3,"why":"Mechanical terminals retain conductors by designed clamping force.","id":493,"group":"Electrical connections","focus":false,"answerText":"It clamps a conductor securely in a suitable terminal"},{"topic":"Electrical connections & joining comparison","page":"Assembly pp. 41–42","q":"What is a crimped electrical connection?","options":["A pipe flange fused by heat","A solder alloy heated to liquidus","A connector mechanically compressed onto a conductor","An adhesive applied to a wall"],"answer":2,"why":"Crimping deforms a suitable terminal around a wire to secure it.","id":494,"group":"Electrical connections","focus":false,"answerText":"A connector mechanically compressed onto a conductor"},{"topic":"Electrical connections & joining comparison","page":"Assembly pp. 41–42","q":"Why is solder alone discouraged as the only physical support for an electrical wire?","options":["Solder is always stronger than steel","Solder has unlimited fatigue strength","Mechanical strain may crack or fail the soldered joint","Wires never experience vibration"],"answer":2,"why":"The manual recommends wire bending/wrapping or other support as appropriate.","id":495,"group":"Soft soldering","focus":true,"answerText":"Mechanical strain may crack or fail the soldered joint"},{"topic":"Electrical connections & joining comparison","page":"Assembly pp. 41–42","q":"What is a bullet connector designed to provide in vehicle wiring?","options":["A pressure vessel gasket","A permanent pipe weld","A quickly disconnectable electrical connection","A lifting attachment"],"answer":2,"why":"Bullet-type male/female electrical connectors allow separation for service.","id":496,"group":"Electrical connections","focus":false,"answerText":"A quickly disconnectable electrical connection"},{"topic":"Electrical connections & joining comparison","page":"Assembly pp. 41–42","q":"Which joining method typically needs the parent metals to melt?","options":["Brazing","Soft soldering","Fusion welding","Adhesive bonding"],"answer":2,"why":"Welding is distinguished from the lower-temperature filler methods in the manual.","id":497,"group":"Electrical connections","focus":false,"answerText":"Fusion welding"},{"topic":"Electrical connections & joining comparison","page":"Assembly pp. 41–42","q":"Which two joining processes normally use a separate molten filler without melting the parent metals?","options":["Soldering and brazing","Arc welding and gas welding","Mechanical riveting and bolting","Adhesive bonding and riveting"],"answer":0,"why":"Soldering and brazing involve filler flow with the workpieces remaining solid.","id":498,"group":"Electrical connections","focus":false,"answerText":"Soldering and brazing"},{"topic":"Electrical connections & joining comparison","page":"Assembly pp. 41–42","q":"Which of the following is normally an electrical insulator rather than a conductor?","options":["Most structural adhesives","Typical metal brazed joint","Steel bolt","Metal soldered joint"],"answer":0,"why":"The manual's comparative table classifies adhesives as insulating.","id":499,"group":"Electrical connections","focus":false,"answerText":"Most structural adhesives"},{"topic":"Safety responsibilities, workplace & PPE","page":"Safety pp. 1–6","q":"According to the manual, what general duty does an employer have under health and safety law?","options":["Delegate every safety duty to trainees","Avoid inspecting equipment","Protect employee health, safety and welfare so far as reasonably practicable","Provide only uniforms"],"answer":2,"why":"The safety section outlines employer duties under the UK HSW Act framework used in the manual.","id":500,"group":"Other safety","focus":false,"answerText":"Protect employee health, safety and welfare so far as reasonably practicable"},{"topic":"Safety responsibilities, workplace & PPE","page":"Safety pp. 1–6","q":"What does the employer's duty to provide safe plant include?","options":["Removing all warning labels","Allowing any person to work untrained","Using only the oldest tools","Suitable maintenance of machinery, equipment and systems of work"],"answer":3,"why":"The manual expects safe, maintained plant and systems of work.","id":501,"group":"Other safety","focus":false,"answerText":"Suitable maintenance of machinery, equipment and systems of work"},{"topic":"Safety responsibilities, workplace & PPE","page":"Safety pp. 1–6","q":"What is the purpose of employee information and training?","options":["To prevent reporting defects","To enable safe work practices and hazard awareness","To avoid all supervision","To replace maintenance"],"answer":1,"why":"Instruction and training make workers aware of hazards and controls.","id":502,"group":"Other safety","focus":false,"answerText":"To enable safe work practices and hazard awareness"},{"topic":"Safety responsibilities, workplace & PPE","page":"Safety pp. 1–6","q":"What should employees do when safety equipment is supplied?","options":["Ignore notices in noisy areas","Use it correctly and cooperate with safety arrangements","Remove guards when inconvenient","Work without permits"],"answer":1,"why":"Employees have responsibilities to work safely and use provided safeguards.","id":503,"group":"Other safety","focus":false,"answerText":"Use it correctly and cooperate with safety arrangements"},{"topic":"Safety responsibilities, workplace & PPE","page":"Safety pp. 1–6","q":"What is the role of a workplace safety policy?","options":["Act as a machine lubrication chart only","Replace every risk assessment","State safety responsibilities, arrangements and objectives","Specify only the colour of uniforms"],"answer":2,"why":"The safety policy documents health and safety arrangements.","id":504,"group":"Other safety","focus":false,"answerText":"State safety responsibilities, arrangements and objectives"},{"topic":"Safety responsibilities, workplace & PPE","page":"Safety pp. 1–6","q":"What should a safety committee examine?","options":["Accidents, hazard reports and effectiveness of safety measures","The design of all customer invoices","Only the company's dress code","Only product sales"],"answer":0,"why":"Safety committees review working conditions and precautions.","id":505,"group":"Other safety","focus":false,"answerText":"Accidents, hazard reports and effectiveness of safety measures"},{"topic":"Safety responsibilities, workplace & PPE","page":"Safety pp. 1–6","q":"What is the difference between a hazard and a risk?","options":["A hazard only exists after an injury","A risk is always a piece of equipment","A hazard can cause harm; risk concerns the likelihood and consequences of harm","They are always identical words"],"answer":2,"why":"The manual focuses on recognising and controlling workplace hazards.","id":506,"group":"Other safety","focus":false,"answerText":"A hazard can cause harm; risk concerns the likelihood and consequences of harm"},{"topic":"Safety responsibilities, workplace & PPE","page":"Safety pp. 1–6","q":"What is a primary reason to report unsafe conditions promptly?","options":["To remove guards without approval","So hazards can be corrected before an accident","To delay maintenance indefinitely","To avoid any paperwork"],"answer":1,"why":"Reporting supports prevention and corrective action.","id":507,"group":"Other safety","focus":false,"answerText":"So hazards can be corrected before an accident"},{"topic":"Safety responsibilities, workplace & PPE","page":"Safety pp. 1–6","q":"Why is adequate lighting important around machines?","options":["It helps workers see equipment, hazards and controls","It guarantees zero electrical risk","It removes the need for guarding","It replaces PPE"],"answer":0,"why":"Safe work depends on sufficient visibility.","id":508,"group":"Other safety","focus":false,"answerText":"It helps workers see equipment, hazards and controls"},{"topic":"Safety responsibilities, workplace & PPE","page":"Safety pp. 1–6","q":"What should work areas and walkways be kept free from?","options":["Every emergency exit","All lighting","All warning signs","Obstructions, spillages and trip hazards"],"answer":3,"why":"Housekeeping reduces falls and permits movement and emergency access.","id":509,"group":"Other safety","focus":false,"answerText":"Obstructions, spillages and trip hazards"},{"topic":"Safety responsibilities, workplace & PPE","page":"Safety pp. 1–6","q":"Why is ventilation important in some workplaces?","options":["It replaces all respirators in any situation","It turns flammable gas into oxygen","It helps control airborne contaminants and heat","It increases dust exposure"],"answer":2,"why":"Ventilation is part of controlling the workplace atmosphere.","id":510,"group":"Other safety","focus":false,"answerText":"It helps control airborne contaminants and heat"},{"topic":"Safety responsibilities, workplace & PPE","page":"Safety pp. 1–6","q":"What does PPE stand for?","options":["Plant Production Efficiency","Periodic Performance Examination","Personal Protective Equipment","Pressure Pipe Extension"],"answer":2,"why":"PPE protects an individual from residual risks.","id":511,"group":"Other safety","focus":false,"answerText":"Personal Protective Equipment"},{"topic":"Safety responsibilities, workplace & PPE","page":"Safety pp. 1–6","q":"Where should PPE generally sit in the risk-control hierarchy?","options":["Before hazard elimination is considered","As a last line of protection after other controls where practicable","As a replacement for machine guarding","As the only control for every hazard"],"answer":1,"why":"The manual emphasises PPE as a last resort.","id":512,"group":"Other safety","focus":false,"answerText":"As a last line of protection after other controls where practicable"},{"topic":"Safety responsibilities, workplace & PPE","page":"Safety pp. 1–6","q":"Which protection is intended to reduce impact or splash risks to the eyes?","options":["Welding rod alone","Appropriate goggles or face protection","A standard flat washer","A rubber coupling"],"answer":1,"why":"Eye PPE is selected for the expected hazard.","id":513,"group":"Other safety","focus":false,"answerText":"Appropriate goggles or face protection"},{"topic":"Safety responsibilities, workplace & PPE","page":"Safety pp. 1–6","q":"What is the purpose of a safety helmet in the manual?","options":["Provide hearing protection","Protect the head from falling or striking objects","Insulate every electrical circuit","Replace all overhead protection"],"answer":1,"why":"Head protection limits certain impact injuries.","id":514,"group":"Other safety","focus":false,"answerText":"Protect the head from falling or striking objects"},{"topic":"Safety responsibilities, workplace & PPE","page":"Safety pp. 1–6","q":"What are safety shoes with toe protection intended to guard against?","options":["Toxic gas inhalation","Electrical arcing at every voltage","Eye injuries from chips","Toe injuries from falling or striking objects"],"answer":3,"why":"The manual discusses steel-toe and other protective footwear.","id":515,"group":"Other safety","focus":false,"answerText":"Toe injuries from falling or striking objects"},{"topic":"Safety responsibilities, workplace & PPE","page":"Safety pp. 1–6","q":"What are gloves selected to protect against?","options":["Only poor lighting","Hazards such as abrasion, heat, chemicals or contamination as appropriate","Only loud noise","All rotating machinery hazards in every situation"],"answer":1,"why":"Glove selection depends on the task; gloves may themselves present entanglement risks near rotating machinery.","id":516,"group":"Other safety","focus":false,"answerText":"Hazards such as abrasion, heat, chemicals or contamination as appropriate"},{"topic":"Safety responsibilities, workplace & PPE","page":"Safety pp. 1–6","q":"What does the manual identify as a purpose of protective clothing?","options":["Replace ventilation","Guarantee no chemical exposure","Make machine guarding unnecessary","Protect the body against particular workplace hazards"],"answer":3,"why":"Protective clothing may defend against contamination, splashes or other risks.","id":517,"group":"Other safety","focus":false,"answerText":"Protect the body against particular workplace hazards"},{"topic":"Manual handling, noise & electrical safety","page":"Safety pp. 7–13","q":"What are the three risk-control priorities for manual handling in the manual?","options":["Avoid hazardous handling, assess unavoidable tasks, reduce injury risk","Always use maximum force, avoid planning, ignore fatigue","Wear gloves only, then lift anything","Lift every load alone, hurry, twist"],"answer":0,"why":"The manual sets out avoid-assess-reduce in that order.","id":518,"group":"Other safety","focus":false,"answerText":"Avoid hazardous handling, assess unavoidable tasks, reduce injury risk"},{"topic":"Manual handling, noise & electrical safety","page":"Safety pp. 7–13","q":"What should a worker do before manually lifting a load?","options":["Lift immediately to test the back","Twist quickly to warm up","Ignore obstacles until moving","Plan the task and assess the load, path and help needed"],"answer":3,"why":"'Stop and think' is the manual's first handling step.","id":519,"group":"Other safety","focus":false,"answerText":"Plan the task and assess the load, path and help needed"},{"topic":"Manual handling, noise & electrical safety","page":"Safety pp. 7–13","q":"How should feet be positioned for a controlled manual lift?","options":["Feet touching with heels raised","Balance on one foot","Stand with feet on a slippery surface","A stable base with feet apart and one foot slightly forward"],"answer":3,"why":"A stable stance helps maintain balance.","id":520,"group":"Other safety","focus":false,"answerText":"A stable base with feet apart and one foot slightly forward"},{"topic":"Manual handling, noise & electrical safety","page":"Safety pp. 7–13","q":"What lifting posture does the manual recommend?","options":["Jerk with the back","Bend hips and knees appropriately and keep the load close","Twist the spine while lifting","Hold the load at arm's length"],"answer":1,"why":"The manual stresses stable posture, controlled movement and avoiding twist.","id":521,"group":"Other safety","focus":false,"answerText":"Bend hips and knees appropriately and keep the load close"},{"topic":"Manual handling, noise & electrical safety","page":"Safety pp. 7–13","q":"Why should a load be held close to the body?","options":["It eliminates all lifting risk","It increases the load's weight","It reduces the moment and strain on the back","It requires greater reach"],"answer":2,"why":"Keeping a load close reduces leverage on the spine.","id":522,"group":"Other safety","focus":false,"answerText":"It reduces the moment and strain on the back"},{"topic":"Manual handling, noise & electrical safety","page":"Safety pp. 7–13","q":"What does 'Don't jerk' mean in manual handling?","options":["Move smoothly and maintain control","Rotate quickly under load","Drop the load to avoid fatigue","Lift with a sudden tug"],"answer":0,"why":"Controlled movement reduces sudden forces.","id":523,"group":"Other safety","focus":false,"answerText":"Move smoothly and maintain control"},{"topic":"Manual handling, noise & electrical safety","page":"Safety pp. 7–13","q":"What should a person do when a load is too awkward or heavy?","options":["Use assistance or appropriate handling equipment","Throw it forward","Always lift it alone","Ignore access restrictions"],"answer":0,"why":"The manual calls for suitable aids and team handling where needed.","id":524,"group":"Other safety","focus":false,"answerText":"Use assistance or appropriate handling equipment"},{"topic":"Manual handling, noise & electrical safety","page":"Safety pp. 7–13","q":"What does dB(A) refer to in workplace noise assessment?","options":["Bolt diameter in millimetres","Adhesive thickness","A-weighted sound level in decibels","Air flow in litres"],"answer":2,"why":"A-weighted decibels indicate sound exposure relevant to hearing risk.","id":525,"group":"Other safety","focus":false,"answerText":"A-weighted sound level in decibels"},{"topic":"Manual handling, noise & electrical safety","page":"Safety pp. 7–13","q":"What hearing effect can prolonged excessive noise cause?","options":["Improved hearing acuity","Increased electrical resistance","Permanent hearing damage","Automatic equilibrium protection"],"answer":2,"why":"Noise exposure can harm hearing over time.","id":526,"group":"Other safety","focus":false,"answerText":"Permanent hearing damage"},{"topic":"Manual handling, noise & electrical safety","page":"Safety pp. 7–13","q":"Which approach to excessive workplace noise is preferred in the manual?","options":["Use earplugs as the only possible measure","Increase machine speed to mask noise","Reduce noise at source and along its path before relying on ear protection","Remove guards for quiet operation"],"answer":2,"why":"Engineering controls should come before sole reliance on hearing PPE.","id":527,"group":"Other safety","focus":false,"answerText":"Reduce noise at source and along its path before relying on ear protection"},{"topic":"Manual handling, noise & electrical safety","page":"Safety pp. 7–13","q":"What is electric shock?","options":["A wire's normal insulation colour","Any motor overheating without contact","A small mechanical vibration","Current passing through the body causing physiological harm"],"answer":3,"why":"Electric shock arises when dangerous current flows through the body.","id":528,"group":"Other safety","focus":false,"answerText":"Current passing through the body causing physiological harm"},{"topic":"Manual handling, noise & electrical safety","page":"Safety pp. 7–13","q":"Why is damaged electrical insulation dangerous?","options":["It increases a cable's safe rating","It makes voltage disappear","It can expose conductors and permit hazardous contact","It prevents all earth faults"],"answer":2,"why":"Insulation is a key barrier against electrical contact.","id":529,"group":"Other safety","focus":false,"answerText":"It can expose conductors and permit hazardous contact"},{"topic":"Manual handling, noise & electrical safety","page":"Safety pp. 7–13","q":"What is the purpose of protective earthing?","options":["Ensure every appliance uses two wires","Replace all overload protection","Provide a fault-current path so protection can disconnect a dangerous supply","Increase exposed metal voltage during a fault"],"answer":2,"why":"Earthing helps automatic disconnection in fault conditions.","id":530,"group":"Other safety","focus":false,"answerText":"Provide a fault-current path so protection can disconnect a dangerous supply"},{"topic":"Manual handling, noise & electrical safety","page":"Safety pp. 7–13","q":"What does an RCD do?","options":["Detect residual current imbalance and disconnect when its criteria are met","Replace the earth conductor in every case","Increase output frequency","Measure weld temperature"],"answer":0,"why":"Residual current protection helps reduce electric-shock risk.","id":531,"group":"Other safety","focus":false,"answerText":"Detect residual current imbalance and disconnect when its criteria are met"},{"topic":"Manual handling, noise & electrical safety","page":"Safety pp. 7–13","q":"What is double insulation?","options":["Two bare conductors twisted together","Two earth cables touching each other","One damaged cover over a live wire","Two independent protective insulation layers or equivalent construction"],"answer":3,"why":"Double-insulated designs do not rely on a protective earth in the same way as Class I equipment.","id":532,"group":"Other safety","focus":false,"answerText":"Two independent protective insulation layers or equivalent construction"},{"topic":"Manual handling, noise & electrical safety","page":"Safety pp. 7–13","q":"Why may reduced-voltage systems be used with portable tools?","options":["To eliminate all need for inspection","To increase open-circuit voltage","To lower electric-shock risk in suitable applications","To permit unsafe wet working"],"answer":2,"why":"The manual cites reduced voltage for some portable construction equipment.","id":533,"group":"Other safety","focus":false,"answerText":"To lower electric-shock risk in suitable applications"},{"topic":"Manual handling, noise & electrical safety","page":"Safety pp. 7–13","q":"What is an arc flash hazard?","options":["A method of reading thread pitch","A harmless machine noise","A type of adhesive only","An electrical discharge causing extreme heat and light"],"answer":3,"why":"Electrical arcing can cause serious burns and injury.","id":534,"group":"Other safety","focus":false,"answerText":"An electrical discharge causing extreme heat and light"},{"topic":"Manual handling, noise & electrical safety","page":"Safety pp. 7–13","q":"What should be done before adjusting or repairing powered electrical equipment?","options":["Assume the switch alone guarantees isolation","Leave exposed live conductors energised","Bridge the fuse with copper wire","Disconnect/isolate the supply in accordance with procedure"],"answer":3,"why":"The manual emphasises safe isolation and competent electrical work.","id":535,"group":"Other safety","focus":false,"answerText":"Disconnect/isolate the supply in accordance with procedure"},{"topic":"Manual handling, noise & electrical safety","page":"Safety pp. 7–13","q":"What is the role of a fuse?","options":["Replace an earth connection","Interrupt overcurrent by melting a designed element","Function as a pressure relief valve","Increase a wire's current rating"],"answer":1,"why":"Fuses provide overcurrent protection when correctly rated and fitted.","id":536,"group":"Other safety","focus":false,"answerText":"Interrupt overcurrent by melting a designed element"},{"topic":"Manual handling, noise & electrical safety","page":"Safety pp. 7–13","q":"What is the first priority when someone remains in contact with a live electrical source?","options":["Throw water over the socket","Make the supply safe without touching the victim directly","Remove PPE and approach rapidly","Grab the victim with bare hands"],"answer":1,"why":"Isolate power and follow emergency response procedures before helping.","id":537,"group":"Other safety","focus":false,"answerText":"Make the supply safe without touching the victim directly"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"In the manual's safety-sign colour code, RED is associated with:","options":["General caution only","Prohibition and fire equipment","Safe-condition exits","Mandatory eye protection signs"],"answer":1,"why":"Red is used for prohibited actions and fire-fighting equipment identification.","id":538,"group":"Other safety","focus":false,"answerText":"Prohibition and fire equipment"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"In the manual's safety-sign colour code, YELLOW indicates:","options":["Mandatory instruction","Warning of danger","First aid location only","Safe condition"],"answer":1,"why":"Yellow warns of hazards such as electrical danger or obstacles.","id":539,"group":"Other safety","focus":false,"answerText":"Warning of danger"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"In the manual's safety-sign colour code, GREEN indicates:","options":["Mandatory PPE","Explosive material warning only","Safe condition, exits or first aid","Prohibition"],"answer":2,"why":"Green shows safe routes, emergency exits and first aid.","id":540,"group":"Other safety","focus":false,"answerText":"Safe condition, exits or first aid"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"In the manual's safety-sign colour code, BLUE indicates:","options":["Prohibition","Mandatory action or instruction","Fire-extinguisher medium only","General safe condition"],"answer":1,"why":"Blue signs specify actions that must be followed.","id":541,"group":"Other safety","focus":false,"answerText":"Mandatory action or instruction"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"What colour does the manual assign to WATER fire extinguishers?","options":["Pale cream","Black","Signal red","French blue"],"answer":2,"why":"The historical full-body colour chart on Safety p.15 lists water as signal red.","id":542,"group":"Fire & extinguishers","focus":true,"answerText":"Signal red"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"What colour does the manual assign to FOAM fire extinguishers?","options":["Black","Signal red","Pale cream","Peacock blue"],"answer":2,"why":"The manual's extinguisher chart lists foam as pale cream.","id":543,"group":"Fire & extinguishers","focus":true,"answerText":"Pale cream"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"What colour does the manual assign to DRY POWDER extinguishers?","options":["Signal red","Pale cream","Maroon","French blue"],"answer":3,"why":"The manual's table lists powder as French blue.","id":544,"group":"Fire & extinguishers","focus":true,"answerText":"French blue"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"What colour does the manual assign to CO2 extinguishers?","options":["Black","Pale cream","Maroon","French grey"],"answer":0,"why":"The manual's extinguisher colour coding lists carbon dioxide as black.","id":545,"group":"Fire & extinguishers","focus":true,"answerText":"Black"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"According to the manual, why are extinguishers colour-coded?","options":["To guarantee suitability for every type of fire","To identify the extinguishing medium quickly","To show the equipment's purchase year","To indicate the operator's rank"],"answer":1,"why":"Colour is an identification aid, not a substitute for correct selection.","id":546,"group":"Fire & extinguishers","focus":true,"answerText":"To identify the extinguishing medium quickly"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"Under the manual's gas-cylinder colour chart, ACETYLENE is:","options":["Peacock blue","Maroon","Black","French grey"],"answer":1,"why":"Safety p.15 lists acetylene cylinders as maroon.","id":547,"group":"Gas cylinders & codes","focus":true,"answerText":"Maroon"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"Under the manual's gas-cylinder chart, AIR is:","options":["French grey","Signal red","Maroon","Black with yellow"],"answer":0,"why":"Compressed air is listed as French grey.","id":548,"group":"Other safety","focus":false,"answerText":"French grey"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"Under the manual's gas-cylinder chart, ARGON is:","options":["Peacock blue","Pale cream","Maroon","Black"],"answer":0,"why":"Argon is listed as peacock blue.","id":549,"group":"Other safety","focus":false,"answerText":"Peacock blue"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"Under the manual's gas-cylinder chart, CARBON DIOXIDE is:","options":["Pale cream","Black","Signal red","Peacock blue"],"answer":1,"why":"Cylinder colour table: carbon dioxide, black.","id":550,"group":"Other safety","focus":false,"answerText":"Black"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"Under the manual's gas-cylinder chart, HYDROGEN is:","options":["Peacock blue","Signal red","French grey with a black band","Maroon"],"answer":1,"why":"Hydrogen cylinders are listed as signal red.","id":551,"group":"Other safety","focus":false,"answerText":"Signal red"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"Under the manual's gas-cylinder chart, NITROGEN is:","options":["French grey with a black band","Signal red","Peacock blue","Maroon"],"answer":0,"why":"The manual's nitrogen colour includes a black band on French grey.","id":552,"group":"Other safety","focus":false,"answerText":"French grey with a black band"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"Under the manual's gas-cylinder chart, OXYGEN is:","options":["Signal red","Pale cream","Black","Peacock blue"],"answer":2,"why":"The manual lists oxygen as black in its historical cylinder code.","id":553,"group":"Other safety","focus":false,"answerText":"Black"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"Under the manual's gas-cylinder chart, PROPANE is:","options":["Pale cream","Peacock blue","Signal red","Black"],"answer":2,"why":"The manual lists propane as signal red.","id":554,"group":"Other safety","focus":false,"answerText":"Signal red"},{"topic":"Safety signs, extinguishers & gas colours","page":"Safety pp. 14–15, 18–20","q":"Which two gases share the same signal-red cylinder colour in the manual?","options":["Nitrogen and carbon dioxide","Air
